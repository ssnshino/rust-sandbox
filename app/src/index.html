<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rust Sandbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #0f0f1a, #1a0f1a);
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .container { max-width: 640px; width: 100%; padding: 40px 24px; }
    h1 { font-size: 2rem; font-weight: 700; color: #f8f8f8; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 40px; }
    h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: #64748b; margin-bottom: 16px; }
    .cards { display: grid; gap: 12px; }
    .card {
      display: flex; align-items: center; gap: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 20px 24px;
      text-decoration: none; color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); transform: translateY(-1px); }
    .card-icon { font-size: 2rem; line-height: 1; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .card-desc  { font-size: 0.85rem; color: #94a3b8; }
    .badge {
      margin-left: auto; font-size: 0.7rem; padding: 3px 8px; border-radius: 99px;
      background: rgba(99,102,241,0.2); color: #a5b4fc;
      border: 1px solid rgba(99,102,241,0.3); white-space: nowrap;
    }
    .badge.new {
      background: rgba(124,58,237,0.3); color: #c4b5fd;
      border-color: rgba(124,58,237,0.5);
    }
    footer { margin-top: 40px; font-size: 0.8rem; color: #475569; }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rust Sandbox</h1>
    <p class="subtitle">ayano-lab の Rust 実験場。axum + WebSocket ベース。</p>

    <h2>実験一覧</h2>
    <div class="cards">
      <a class="card" href="/pong">
        <span class="card-icon">🏓</span>
        <div>
          <div class="card-title">Pong — シングル</div>
          <div class="card-desc">WebSocket でサーバー同期する CPU 対戦 Pong</div>
        </div>
        <span class="badge">1P</span>
      </a>
      <a class="card" href="/pong?mode=2p">
        <span class="card-icon">⚔️</span>
        <div>
          <div class="card-title">Pong — 2P 対戦</div>
          <div class="card-desc">別の端末・別タブで同時接続してリアルタイム対戦</div>
        </div>
        <span class="badge">2P</span>
      </a>
      <a class="card" href="/breakout">
        <span class="card-icon">🧱</span>
        <div>
          <div class="card-title">Breakout</div>
          <div class="card-desc">サーバーサイド物理演算のブロック崩し。マウス / キー / タッチ対応</div>
        </div>
        <span class="badge">1P</span>
      </a>
      <a class="card" href="/dungeon">
        <span class="card-icon">🏯</span>
        <div>
          <div class="card-title">あやかダンジョン</div>
          <div class="card-desc">平安京エイリアン × あやかダンジョン。穴を掘ってエイリアンを倒せ！</div>
        </div>
        <span class="badge new">NEW</span>
      </a>
    </div>

    <footer>
      <code>ayano-lab/docker/rust-sandbox</code>
    </footer>
  </div>
</body>
</html>
