<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>中型宇宙トラック野郎</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#050510;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh;
      font-family:'DotGothic16',monospace;
      color:#e2e8f0;
      user-select:none; overflow:hidden;
    }
    canvas { display:block; image-rendering:pixelated; }
    #wrap { position:relative; width:540px; max-width:100vw; }

    /* ── Overlays ── */
    .overlay {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(5,5,20,.88);
      gap:14px; z-index:10;
    }
    .overlay h1 {
      font-size:1.5rem; letter-spacing:.08em; color:#fff;
      text-shadow:0 0 8px #fff, 0 0 20px #a855f7, 0 0 40px #7c3aed;
    }
    .overlay h2 { font-size:1rem; color:#a855f7; }
    .overlay p  { font-size:0.8rem; color:#94a3b8; line-height:1.6; text-align:center; }
    .btn {
      padding:10px 28px;
      background:rgba(168,85,247,.2);
      border:1px solid rgba(168,85,247,.5);
      border-radius:8px; color:#e2e8f0; cursor:pointer;
      font-family:inherit; font-size:0.85rem; letter-spacing:.05em;
      transition:background .15s, box-shadow .15s;
    }
    .btn:hover { background:rgba(168,85,247,.35); box-shadow:0 0 12px rgba(168,85,247,.4); }

    #btn-back {
      position:absolute; top:10px; left:10px; z-index:20;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; padding:5px 12px; color:#9ca3af;
      font-family:inherit; font-size:0.7rem; cursor:pointer;
      transition:background .15s;
    }
    #btn-back:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }
    #btn-lang {
      position:fixed; top:10px; right:10px; z-index:200;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; padding:5px 12px; color:#9ca3af;
      font-family:inherit; font-size:0.7rem; cursor:pointer;
      transition:background .15s;
    }
    #btn-lang:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }

    /* ── HUD ── */
    #hud {
      position:absolute; top:0; left:0; right:0;
      padding:8px 14px;
      display:flex; align-items:center; gap:12px;
      pointer-events:none; z-index:5;
      background:linear-gradient(to bottom,rgba(5,5,20,.75) 0%,transparent 100%);
    }
    #hud-score  { font-size:0.82rem; color:#fde68a; text-shadow:0 0 6px #f59e0b; min-width:100px; }
    #hud-hp     { font-size:1rem; }
    #hud-info   { font-size:0.72rem; color:#a5b4fc; margin-left:auto; }

    /* Station banner (top + bottom) */
    #banner-from {
      position:absolute; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none; z-index:4; padding-top:2px;
    }
    #banner-from span {
      font-size:0.72rem; color:rgba(148,163,184,0.6);
      background:rgba(5,5,20,.4); padding:2px 10px; border-radius:4px;
    }

    /* ── GM Comment ── */
    #gm-comment {
      position:absolute; bottom:60px; right:12px;
      font-size:0.75rem; color:#f9a8d4;
      text-shadow:0 0 8px #ec4899;
      pointer-events:none; z-index:6;
      transition:opacity .3s; opacity:0;
      max-width:180px; text-align:right;
    }
    #gm-comment.show { opacity:1; }

    /* ── Score list ── */
    .score-list { width:260px; }
    .score-list table { width:100%; border-collapse:collapse; font-size:0.75rem; }
    .score-list td { padding:3px 6px; color:#94a3b8; }
    .score-list tr:first-child td { color:#fde68a; }
    .score-list tr:nth-child(2) td { color:#e2e8f0; }
    .score-list tr:nth-child(3) td { color:#fdba74; }
    .score-list .rank { color:#6b7280; width:24px; }

    /* ── Virtual stick ── */
    #vstick-area {
      position:absolute; bottom:16px; left:16px;
      width:120px; height:120px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:50%; display:none; z-index:8;
      touch-action:none;
    }
    #vstick-knob {
      position:absolute; width:48px; height:48px; border-radius:50%;
      background:rgba(168,85,247,.35); border:1px solid rgba(168,85,247,.6);
      top:50%; left:50%; transform:translate(-50%,-50%);
    }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="540" height="540"></canvas>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <span id="hud-score">SCORE: 0</span>
    <span id="hud-hp"></span>
    <span id="hud-info"></span>
  </div>

  <!-- GM comment -->
  <div id="gm-comment"></div>

  <!-- Title screen -->
  <div id="screen-title" class="overlay">
    <h1 data-i18n="title">🚛 宇宙トラック野郎 🚛</h1>
    <p data-i18n="title_sub">アステロイドベルトをかきわけて配達！<br>出発ステーションから目的地へ向かえ！</p>
    <div style="display:flex;gap:10px;align-items:center;">
      <input id="name-input" type="text" maxlength="16"
        style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
               border-radius:6px;padding:8px 12px;color:#e2e8f0;font-family:inherit;font-size:0.85rem;width:160px;"
        data-i18n-placeholder="name_placeholder">
      <button class="btn" id="btn-start" data-i18n="btn_start">スタート！</button>
    </div>
    <div id="title-scores" class="score-list"></div>
    <p style="font-size:0.7rem;color:#4b5563;" data-i18n="controls">矢印キー / WASD で操作</p>
  </div>

  <!-- Gameover screen -->
  <div id="screen-gameover" class="overlay" style="display:none">
    <h1 data-i18n="gameover">GAME OVER</h1>
    <h2 id="go-score"></h2>
    <p id="go-rank"></p>
    <div id="go-scores" class="score-list"></div>
    <button class="btn" id="btn-restart" data-i18n="btn_restart">もう一度</button>
  </div>

  <!-- Stage clear flash (brief) -->
  <div id="screen-stageclear" class="overlay" style="display:none; background:rgba(5,5,20,.6);">
    <h1 id="sc-title" style="font-size:2rem;"></h1>
    <h2 id="sc-sub"></h2>
  </div>

  <button id="btn-back" onclick="location.href='/'">← <span data-i18n="back">メニュー</span></button>
  <button id="btn-lang">🇯🇵 / 🇬🇧</button>

  <div id="vstick-area"><div id="vstick-knob"></div></div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
const I18N = {
  ja: {
    title:         '🚛 宇宙トラック野郎 🚛',
    title_sub:     'アステロイドベルトをかきわけて配達！\n出発ステーションから目的地へ向かえ！',
    name_placeholder: 'なまえ',
    btn_start:     'スタート！',
    btn_restart:   'もう一度',
    controls:      '矢印キー / WASD で操作',
    back:          'メニュー',
    gameover:      'GAME OVER',
    score_label:   'スコア: ',
    round_label:   'ROUND ',
    lap_label:     'LAP ',
    stage_label:   (s,t) => `${s.symbol} ${s.name_ja}  →  ${t.symbol} ${t.name_ja}`,
    delivery_banner: (s,t) => `${s.symbol} → ${t.symbol} 配達完了！`,
    lap_clear_title: '1 LAP クリア！！',
    lap_clear_sub:   (r) => `ROUND ${r} へ突入！`,
    rank_msg:      (r) => `${r}位にランクイン！`,
    no_rank:       'ランク外',
    // GM comments
    gm_delivery:   ['届いたよっ！','ナイスドライブ！','よっしゃ！','グッジョブ！'],
    gm_damage:     ['いたっ！','こわれちゃう！','きをつけて！'],
    gm_lap_clear:  ['いっしゅうしたよ！！','さすがトラック野郎！','やったぁ！'],
  },
  en: {
    title:         '🚛 Space Truckers 🚛',
    title_sub:     'Dodge the asteroid belt and deliver cargo!\nNavigate from station to station!',
    name_placeholder: 'Your name',
    btn_start:     'Start!',
    btn_restart:   'Try Again',
    controls:      'Arrow keys / WASD to move',
    back:          'Menu',
    gameover:      'GAME OVER',
    score_label:   'SCORE: ',
    round_label:   'ROUND ',
    lap_label:     'LAP ',
    stage_label:   (s,t) => `${s.symbol} ${s.name_en}  →  ${t.symbol} ${t.name_en}`,
    delivery_banner: (s,t) => `${s.symbol} → ${t.symbol} Delivered!`,
    lap_clear_title: '1 LAP CLEAR!!',
    lap_clear_sub:   (r) => `Entering ROUND ${r}!`,
    rank_msg:      (r) => `Ranked #${r}!`,
    no_rank:       'Not ranked',
    gm_delivery:   ['Delivered!','Nice drive!','Yeah!','Good job!'],
    gm_damage:     ['Ouch!','Watch out!','Take care!'],
    gm_lap_clear:  ['One lap done!!','That\'s a trucker!','Woohoo!'],
  },
};

let lang = localStorage.getItem('gc_lang') || 'ja';
function t(k){ return I18N[lang][k] ?? k; }

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if(typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const v = t(el.dataset.i18nPlaceholder);
    if(typeof v === 'string') el.placeholder = v;
  });
  document.getElementById('btn-lang').textContent = lang==='ja' ? '🇯🇵 / 🇬🇧' : '🇬🇧 / 🇯🇵';
  document.documentElement.lang = lang;
}
document.getElementById('btn-lang').addEventListener('click', () => {
  lang = lang==='ja' ? 'en' : 'ja';
  localStorage.setItem('gc_lang', lang);
  applyLang();
});
applyLang();

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = 540, H = 540;

// ── Scrolling star background ─────────────────────────────────────────────────
// Two layers of stars for parallax
const STARS1 = genStars(60, 1);
const STARS2 = genStars(30, 2);
function genStars(n, layer){
  return Array.from({length:n}, (_,i) => {
    const s = lcg(i*7919 + layer*313);
    return { x: lcgf(s)*W, y: lcgf(lcg(s))*H, r: 0.4+layer*0.3, speed: 0.3*layer };
  });
}
function lcg(s){ return ((s>>>0)*1664525+1013904223)>>>0; }
function lcgf(s){ return (lcg(s)>>>0)/4294967295; }

let scrollY = 0; // vertical scroll offset

function renderBg(tick){
  scrollY = (tick * 0.9) % H;
  ctx.fillStyle = '#050510';
  ctx.fillRect(0,0,W,H);
  for(const st of STARS1) drawStar(st, scrollY*0.4, tick);
  for(const st of STARS2) drawStar(st, scrollY*0.7, tick);
}
function drawStar(st, off, tick){
  const y = ((st.y + off) % H + H) % H;
  const alpha = 0.3 + 0.25*Math.sin(tick*0.03 + st.x);
  ctx.beginPath();
  ctx.arc(st.x, y, st.r, 0, Math.PI*2);
  ctx.fillStyle = `rgba(200,220,255,${alpha.toFixed(2)})`;
  ctx.fill();
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws = null;
let lastState = null;

function connect(){
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/truckers`);
  ws.onmessage = e => handleMsg(JSON.parse(e.data));
  ws.onclose = () => { ws=null; setTimeout(connect,2000); };
}
function send(obj){ if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// ── Input ─────────────────────────────────────────────────────────────────────
const keys = { up:false, down:false, left:false, right:false };

document.addEventListener('keydown', e => { if(applyKey(e.code,true)) sendKeys(); if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup',   e => { if(applyKey(e.code,false)) sendKeys(); });

function applyKey(code, val){
  const map = { ArrowUp:'up',KeyW:'up', ArrowDown:'down',KeyS:'down',
                ArrowLeft:'left',KeyA:'left', ArrowRight:'right',KeyD:'right' };
  const k = map[code];
  if(k && keys[k]!==val){ keys[k]=val; return true; } return false;
}
function sendKeys(){ send({type:'input',keys:{...keys}}); }

// ── Message handler ───────────────────────────────────────────────────────────
let gmTimeout = null;
let prevEvent = null;

function handleMsg(msg){
  if(msg.type!=='state') return;
  lastState = msg;

  switch(msg.phase){
    case 'title':
      showScreen('title');
      renderTitleCanvas(msg);
      renderScoreList('title-scores', msg.scores||[]);
      break;
    case 'playing':
      showScreen('playing');
      renderGame(msg);
      if(msg.event && msg.event !== prevEvent){
        if(msg.event==='damage')   showGm(pickRandom(t('gm_damage')));
        if(msg.event==='delivery') showGm(pickRandom(t('gm_delivery')));
      }
      prevEvent = msg.event;
      break;
    case 'stage_clear':
      showScreen('playing');
      renderGame(msg);
      showStageClear(msg);
      break;
    case 'lap_clear':
      showScreen('playing');
      renderGame(msg);
      showLapClear(msg);
      break;
    case 'gameover':
      showScreen('gameover');
      document.getElementById('go-score').textContent = t('score_label') + (msg.score||0).toLocaleString();
      document.getElementById('go-rank').textContent  = msg.rank ? t('rank_msg')(msg.rank) : t('no_rank');
      renderScoreList('go-scores', msg.scores||[]);
      break;
  }
}

function showStageClear(msg){
  const sc = document.getElementById('screen-stageclear');
  sc.style.display = 'flex';
  document.getElementById('sc-title').textContent = t('delivery_banner')(msg.from, msg.to);
  document.getElementById('sc-sub').textContent   = t('score_label') + msg.score.toLocaleString();
  showGm(pickRandom(t('gm_delivery')));
}
function showLapClear(msg){
  const sc = document.getElementById('screen-stageclear');
  sc.style.display = 'flex';
  document.getElementById('sc-title').textContent = t('lap_clear_title');
  document.getElementById('sc-sub').textContent   = t('lap_clear_sub')(msg.round);
  showGm(pickRandom(t('gm_lap_clear')));
}

function showScreen(name){
  document.getElementById('screen-title').style.display      = name==='title'    ? 'flex'  : 'none';
  document.getElementById('screen-gameover').style.display   = name==='gameover' ? 'flex'  : 'none';
  document.getElementById('screen-stageclear').style.display = 'none'; // only shown by showStageClear
  document.getElementById('hud').style.display = (name==='playing') ? 'flex' : 'none';
  if(name==='playing') document.getElementById('screen-stageclear').style.display = 'none';
}

function showGm(text){
  const el = document.getElementById('gm-comment');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(gmTimeout);
  gmTimeout = setTimeout(()=>el.classList.remove('show'), 2200);
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderScoreList(id, scores){
  const el = document.getElementById(id);
  if(!scores.length){ el.innerHTML=''; return; }
  let html = '<table>';
  scores.slice(0,8).forEach((s,i) => {
    html += `<tr><td class="rank">${i+1}.</td><td>${esc(s.name)}</td><td>${s.score.toLocaleString()}</td></tr>`;
  });
  html += '</table>';
  el.innerHTML = html;
}

// ── Title canvas ──────────────────────────────────────────────────────────────
function renderTitleCanvas(msg){
  renderBg(0);
  // Faint station names at top and bottom
  ctx.textAlign = 'center';
  ctx.font = '18px DotGothic16, monospace';
  ctx.fillStyle = 'rgba(165,180,252,0.35)';
  ctx.fillText('♈  ♉  ♊  ♋  ♌  ♍', W/2, 30);
  ctx.fillText('♎  ♏  ♐  ♑  ♒  ♓', W/2, H-16);
}

// ── Game render ───────────────────────────────────────────────────────────────
function renderGame(s){
  renderBg(s.tick);
  renderDestination(s);
  renderAsteroids(s.asteroids);
  renderShip(s.ship, s.tick);
  renderHUD(s);
}

function renderDestination(s){
  const x = s.dest_x, y = 460;
  // Pulsing glow
  const pulse = 0.5 + 0.4*Math.sin(s.tick*0.08);
  const grd = ctx.createRadialGradient(x,y,4, x,y,50);
  grd.addColorStop(0, `rgba(250,204,21,${(0.35*pulse).toFixed(2)})`);
  grd.addColorStop(1, 'rgba(250,204,21,0)');
  ctx.beginPath();
  ctx.arc(x, y, 50, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();

  // Station icon
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(250,204,21,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = '16px DotGothic16, monospace';
  ctx.fillStyle = '#fde68a';
  ctx.fillText(s.to.symbol, x, y+6);

  const name = lang==='ja' ? s.to.name_ja : s.to.name_en;
  ctx.font = '10px DotGothic16, monospace';
  ctx.fillStyle = 'rgba(253,230,138,0.8)';
  ctx.fillText(name, x, y+28);

  // Top: departure station label
  const fromName = lang==='ja' ? s.from.name_ja : s.from.name_en;
  ctx.font = '10px DotGothic16, monospace';
  ctx.fillStyle = 'rgba(148,163,184,0.5)';
  ctx.fillText(`${s.from.symbol} ${fromName}`, W/2, 18);
}

function renderAsteroids(asteroids){
  if(!asteroids) return;
  for(const a of asteroids){
    ctx.save();
    ctx.translate(a.x, a.y);
    // slow rotation based on seed + time
    ctx.rotate(lcgf(a.seed)*Math.PI*2);

    const r = a.r;
    const pts = 6 + (lcg(a.seed)%4);
    ctx.beginPath();
    for(let i=0;i<pts;i++){
      const angle = (i/pts)*Math.PI*2;
      const jitter = 0.65 + lcgf(lcg(a.seed+i*31))*0.7;
      const px = Math.cos(angle)*r*jitter;
      const py = Math.sin(angle)*r*jitter;
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(110,90,70,0.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,150,130,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

function renderShip(ship, tick){
  if(!ship) return;
  // Blink during invincibility
  if(ship.invincible && Math.floor(tick/4)%2===1) return;

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);

  // Body (triangle, pointing right at angle=0, so "down" = angle=PI/2)
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(-10,  8);
  ctx.lineTo(-6,   0);
  ctx.lineTo(-10, -8);
  ctx.closePath();
  ctx.fillStyle = '#60a5fa';
  ctx.fill();
  ctx.strokeStyle = '#93c5fd';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Engine glow (behind ship = left at angle=0)
  const spd = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
  if(spd > 0.4){
    const flicker = 4 + Math.random()*6;
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-6-flicker, (Math.random()-0.5)*6);
    ctx.strokeStyle = `rgba(251,191,36,${(0.6+Math.random()*0.4).toFixed(2)})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  ctx.restore();
}

function renderHUD(s){
  // Score
  document.getElementById('hud-score').textContent = t('score_label') + s.score.toLocaleString();
  // HP
  const hearts = '❤️'.repeat(s.hp) + '🖤'.repeat(Math.max(0,3-s.hp));
  document.getElementById('hud-hp').textContent = hearts;
  // Round/Lap/Stage info
  document.getElementById('hud-info').textContent =
    t('round_label') + s.round + '  ' + t('lap_label') + s.lap + '  ' +
    (s.stage+1) + '/12';
}

// ── Title / Gameover buttons ──────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  const name = document.getElementById('name-input').value.trim() || (lang==='ja' ? '野郎' : 'Trucker');
  send({ type:'start', name });
});
document.getElementById('name-input').addEventListener('keydown', e => {
  if(e.key==='Enter'){ document.getElementById('btn-start').click(); e.preventDefault(); }
});
document.getElementById('btn-restart').addEventListener('click', () => {
  send({ type:'restart' });
});

// ── Virtual stick ─────────────────────────────────────────────────────────────
const vstickArea = document.getElementById('vstick-area');
const vstickKnob = document.getElementById('vstick-knob');
let vstickCenter = {x:0,y:0};
const STICK_MAX = 44;

if('ontouchstart' in window) vstickArea.style.display = 'block';

vstickArea.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = vstickArea.getBoundingClientRect();
  vstickCenter = { x: r.left+r.width/2, y: r.top+r.height/2 };
  updateStick(e.touches[0]);
}, {passive:false});
vstickArea.addEventListener('touchmove', e => { e.preventDefault(); updateStick(e.touches[0]); }, {passive:false});
document.addEventListener('touchend', () => {
  vstickKnob.style.transform = 'translate(-50%,-50%)';
  keys.up=keys.down=keys.left=keys.right=false;
  sendKeys();
});
function updateStick(touch){
  const dx=touch.clientX-vstickCenter.x, dy=touch.clientY-vstickCenter.y;
  const d=Math.sqrt(dx*dx+dy*dy), c=Math.min(d,STICK_MAX);
  const nx=d>0?dx/d:0, ny=d>0?dy/d:0;
  vstickKnob.style.transform=`translate(calc(-50% + ${nx*c}px),calc(-50% + ${ny*c}px))`;
  const th=0.4;
  keys.up=ny<-th; keys.down=ny>th; keys.left=nx<-th; keys.right=nx>th;
  sendKeys();
}

// ── Init ──────────────────────────────────────────────────────────────────────
showScreen('title');
renderTitleCanvas({});
connect();
</script>
