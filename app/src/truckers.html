<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>中型宇宙トラック野郎</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#050510;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh;
      font-family:'DotGothic16',monospace;
      color:#e2e8f0;
      user-select:none; overflow:hidden;
    }
    canvas { display:block; image-rendering:pixelated; }
    #wrap { position:relative; width:540px; max-width:100vw; }

    /* ── Overlays ── */
    .overlay {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(5,5,20,.88);
      gap:14px; z-index:10;
    }
    .overlay h1 {
      font-size:1.5rem; letter-spacing:.08em; color:#fff;
      text-shadow:0 0 8px #fff, 0 0 20px #a855f7, 0 0 40px #7c3aed;
    }
    .overlay h2 { font-size:1rem; color:#a855f7; }
    .overlay p  { font-size:0.8rem; color:#94a3b8; line-height:1.6; text-align:center; }
    .btn {
      padding:10px 28px;
      background:rgba(168,85,247,.2); border:1px solid rgba(168,85,247,.5);
      border-radius:8px; color:#e2e8f0; cursor:pointer;
      font-family:inherit; font-size:0.85rem; letter-spacing:.05em;
      transition:background .15s, box-shadow .15s;
    }
    .btn:hover { background:rgba(168,85,247,.35); box-shadow:0 0 12px rgba(168,85,247,.4); }

    #btn-back {
      position:absolute; top:10px; left:10px; z-index:20;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; padding:5px 12px; color:#9ca3af;
      font-family:inherit; font-size:0.7rem; cursor:pointer;
    }
    #btn-back:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }
    #btn-lang {
      position:fixed; top:10px; right:10px; z-index:200;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; padding:5px 12px; color:#9ca3af;
      font-family:inherit; font-size:0.7rem; cursor:pointer;
    }
    #btn-lang:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }

    /* ── Score list ── */
    .score-list { width:260px; }
    .score-list table { width:100%; border-collapse:collapse; font-size:0.75rem; }
    .score-list td { padding:3px 6px; color:#94a3b8; }
    .score-list tr:first-child td { color:#fde68a; }
    .score-list tr:nth-child(2) td { color:#e2e8f0; }
    .score-list tr:nth-child(3) td { color:#fdba74; }
    .score-list .rank { color:#6b7280; width:24px; }

    /* ── GM Comment ── */
    #gm-comment {
      position:absolute; bottom:50px; right:12px;
      font-size:0.75rem; color:#f9a8d4;
      text-shadow:0 0 8px #ec4899;
      pointer-events:none; z-index:6;
      transition:opacity .3s; opacity:0;
      max-width:180px; text-align:right;
    }
    #gm-comment.show { opacity:1; }

    /* ── Virtual stick ── */
    #vstick-area {
      position:absolute; bottom:16px; left:16px;
      width:120px; height:120px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
      border-radius:50%; display:none; z-index:8; touch-action:none;
    }
    #vstick-knob {
      position:absolute; width:48px; height:48px; border-radius:50%;
      background:rgba(168,85,247,.35); border:1px solid rgba(168,85,247,.6);
      top:50%; left:50%; transform:translate(-50%,-50%);
    }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="540" height="540"></canvas>
  <div id="gm-comment"></div>

  <!-- Title -->
  <div id="screen-title" class="overlay">
    <h1 data-i18n="title">🚛 宇宙トラック野郎 🚛</h1>
    <p data-i18n="title_sub">小惑星をかきわけ、宇宙ステーションへ荷物を届けろ！</p>
    <div style="display:flex;gap:10px;align-items:center;">
      <input id="name-input" type="text" maxlength="16"
        style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
               border-radius:6px;padding:8px 12px;color:#e2e8f0;font-family:inherit;font-size:0.85rem;width:160px;"
        data-i18n-placeholder="name_ph">
      <button class="btn" id="btn-start" data-i18n="btn_start">スタート！</button>
    </div>
    <div id="title-scores" class="score-list"></div>
    <p style="font-size:0.7rem;color:#4b5563;" data-i18n="controls">矢印キー / WASD で操作</p>
  </div>

  <!-- Gameover -->
  <div id="screen-gameover" class="overlay" style="display:none">
    <h1 data-i18n="go_title">GAME OVER</h1>
    <h2 id="go-score"></h2>
    <p id="go-rank"></p>
    <div id="go-scores" class="score-list"></div>
    <button class="btn" id="btn-restart" data-i18n="btn_restart">もう一度</button>
  </div>

  <!-- Stage/Lap clear flash -->
  <div id="screen-clear" class="overlay" style="display:none;background:rgba(5,5,20,.55);">
    <h1 id="cl-title" style="font-size:2rem;"></h1>
    <h2 id="cl-sub"></h2>
  </div>

  <button id="btn-back" onclick="location.href='/'">← <span data-i18n="back">メニュー</span></button>
  <button id="btn-lang">🇯🇵 / 🇬🇧</button>
  <div id="vstick-area"><div id="vstick-knob"></div></div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
const I18N = {
  ja: {
    title:    '🚛 宇宙トラック野郎 🚛',
    title_sub:'小惑星をかきわけ、宇宙ステーションへ荷物を届けろ！',
    name_ph:  'なまえ',
    btn_start:'スタート！',
    btn_restart:'もう一度',
    controls: '矢印キー / WASD で操作',
    back:     'メニュー',
    go_title: 'GAME OVER',
    score_lbl:'スコア: ',
    round_lbl:'ROUND ',
    lap_lbl:  'LAP ',
    dest_lbl: (to) => `目的地: ${to.symbol} ${to.name_ja}`,
    clear_title: (from,to) => `${from.symbol}→${to.symbol} 配達完了！`,
    lap_title:'1 LAP クリア！！',
    lap_sub:  (r) => `ROUND ${r} へ突入！難易度UP！`,
    rank_msg: (r) => `${r}位にランクイン！`,
    no_rank:  'ランク外',
    gm_ok:    ['届いたよっ！','ナイスドライブ！','よっしゃ！','グッジョブ！'],
    gm_hit:   ['いたっ！','こわれちゃう！','きをつけて！','うわあっ！'],
    gm_lap:   ['いっしゅうしたよ！！','さすがトラック野郎！','やったぁ！'],
  },
  en: {
    title:    '🚛 Space Truckers 🚛',
    title_sub:'Dodge the asteroids and deliver to the space station!',
    name_ph:  'Your name',
    btn_start:'Start!',
    btn_restart:'Try Again',
    controls: 'Arrow keys / WASD to move',
    back:     'Menu',
    go_title: 'GAME OVER',
    score_lbl:'SCORE: ',
    round_lbl:'ROUND ',
    lap_lbl:  'LAP ',
    dest_lbl: (to) => `Heading to: ${to.symbol} ${to.name_en}`,
    clear_title:(from,to) => `${from.symbol}→${to.symbol} Delivered!`,
    lap_title:'1 LAP CLEAR!!',
    lap_sub:  (r) => `Entering ROUND ${r}! Difficulty UP!`,
    rank_msg: (r) => `Ranked #${r}!`,
    no_rank:  'Not ranked',
    gm_ok:    ['Delivered!','Nice drive!','Yeah!','Good job!'],
    gm_hit:   ['Ouch!','Watch out!','Take care!','Whoa!'],
    gm_lap:   ['One lap done!!','That\'s a trucker!','Woohoo!'],
  },
};

let lang = localStorage.getItem('gc_lang') || 'ja';
const t = k => I18N[lang][k] ?? k;

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if(typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const v = t(el.dataset.i18nPlaceholder);
    if(typeof v === 'string') el.placeholder = v;
  });
  document.getElementById('btn-lang').textContent = lang==='ja' ? '🇯🇵 / 🇬🇧' : '🇬🇧 / 🇯🇵';
  document.documentElement.lang = lang;
}
document.getElementById('btn-lang').addEventListener('click', () => {
  lang = lang==='ja' ? 'en' : 'ja';
  localStorage.setItem('gc_lang', lang);
  applyLang();
});
applyLang();

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 540, H = 540;

// ── Stars (two layers, parallax scroll downward) ──────────────────────────────
function lcg(s){ return ((s>>>0)*1664525+1013904223)>>>0; }
function lcgf(s){ return (lcg(s)>>>0)/4294967295; }

// layer 1: slow/small   layer 2: fast/bigger
const STAR_LAYERS = [
  Array.from({length:70},(_,i)=>{ const s=lcg(i*1009+1); return {x:lcgf(s)*W, y:lcgf(lcg(s))*H, r:0.6, speed:0.6}; }),
  Array.from({length:35},(_,i)=>{ const s=lcg(i*7919+2); return {x:lcgf(s)*W, y:lcgf(lcg(s))*H, r:1.1, speed:1.2}; }),
];
// Nebula blobs (decorative, scroll slowly)
const NEBULAS = Array.from({length:5},(_,i)=>{
  const s=lcg(i*31337+3);
  return {x:lcgf(s)*W, y:lcgf(lcg(s))*H, r:60+lcgf(lcg(s))*80,
          hue:200+lcgf(lcg(lcg(s)))*60, speed:0.25};
});

// Scroll offsets are computed from tick so server is the source of truth
function scrollOffset(tick, speed){ return (tick * speed) % H; }

function renderBg(tick){
  ctx.fillStyle = '#050510';
  ctx.fillRect(0,0,W,H);

  // Nebulas
  for(const n of NEBULAS){
    const yo = ((n.y + scrollOffset(tick, n.speed)) % H + H) % H;
    const grd = ctx.createRadialGradient(n.x,yo,0,n.x,yo,n.r);
    grd.addColorStop(0,`hsla(${n.hue},60%,25%,0.07)`);
    grd.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.arc(n.x,yo,n.r,0,Math.PI*2);
    ctx.fillStyle=grd; ctx.fill();
    // wrap at edges
    if(yo < n.r){
      const grd2=ctx.createRadialGradient(n.x,yo+H,0,n.x,yo+H,n.r);
      grd2.addColorStop(0,`hsla(${n.hue},60%,25%,0.07)`);
      grd2.addColorStop(1,'transparent');
      ctx.beginPath(); ctx.arc(n.x,yo+H,n.r,0,Math.PI*2);
      ctx.fillStyle=grd2; ctx.fill();
    }
  }

  // Stars (two layers, scroll down = ship moves up)
  for(const layer of STAR_LAYERS){
    for(const st of layer){
      const yo = ((st.y + scrollOffset(tick, st.speed)) % H + H) % H;
      const flicker = 0.35 + 0.25*Math.sin(tick*0.04 + st.x*0.1);
      ctx.beginPath(); ctx.arc(st.x,yo,st.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(210,225,255,${flicker.toFixed(2)})`; ctx.fill();
      // wrap
      if(yo > H - 4){ ctx.beginPath(); ctx.arc(st.x,yo-H,st.r,0,Math.PI*2); ctx.fill(); }
      if(yo < 4)    { ctx.beginPath(); ctx.arc(st.x,yo+H,st.r,0,Math.PI*2); ctx.fill(); }
    }
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws = null;
function connect(){
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/truckers`);
  ws.onmessage = e => handleMsg(JSON.parse(e.data));
  ws.onclose = () => { ws=null; setTimeout(connect,2000); };
}
function send(obj){ if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// ── Input ─────────────────────────────────────────────────────────────────────
const keys = {up:false,down:false,left:false,right:false};
document.addEventListener('keydown', e => {
  if(applyKey(e.code,true)) sendKeys();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { if(applyKey(e.code,false)) sendKeys(); });
function applyKey(code,val){
  const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
  const k=map[code];
  if(k && keys[k]!==val){ keys[k]=val; return true; } return false;
}
function sendKeys(){ send({type:'input',keys:{...keys}}); }

// ── Message handler ───────────────────────────────────────────────────────────
let gmTimeout = null;
let lastEvent = null;

function handleMsg(msg){
  if(msg.type!=='state') return;

  switch(msg.phase){
    case 'title':
      showScreen('title');
      renderTitleBg();
      renderScoreList('title-scores', msg.scores||[]);
      break;
    case 'playing':
      showScreen('playing');
      render(msg);
      if(msg.event && msg.event!==lastEvent){
        if(msg.event==='damage')  showGm(pick(t('gm_hit')));
        if(msg.event==='delivery')showGm(pick(t('gm_ok')));
      }
      lastEvent = msg.event;
      break;
    case 'stage_clear':
      showScreen('playing');
      render(msg);
      showClear(t('clear_title')(msg.from,msg.to), t('score_lbl')+(msg.score||0).toLocaleString());
      if(msg.event==='delivery') showGm(pick(t('gm_ok')));
      break;
    case 'lap_clear':
      showScreen('playing');
      render(msg);
      showClear(t('lap_title'), t('lap_sub')(msg.round));
      showGm(pick(t('gm_lap')));
      break;
    case 'gameover':
      showScreen('gameover');
      document.getElementById('go-score').textContent = t('score_lbl')+(msg.score||0).toLocaleString();
      document.getElementById('go-rank').textContent  = msg.rank ? t('rank_msg')(msg.rank) : t('no_rank');
      renderScoreList('go-scores', msg.scores||[]);
      break;
  }
}

function showClear(title, sub){
  const el = document.getElementById('screen-clear');
  document.getElementById('cl-title').textContent = title;
  document.getElementById('cl-sub').textContent   = sub;
  el.style.display = 'flex';
}

function showScreen(name){
  document.getElementById('screen-title').style.display   = name==='title'    ? 'flex' : 'none';
  document.getElementById('screen-gameover').style.display= name==='gameover' ? 'flex' : 'none';
  document.getElementById('screen-clear').style.display   = 'none';
}

function showGm(text){
  const el=document.getElementById('gm-comment');
  el.textContent=text; el.classList.add('show');
  clearTimeout(gmTimeout);
  gmTimeout=setTimeout(()=>el.classList.remove('show'),2200);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderScoreList(id, scores){
  const el=document.getElementById(id);
  if(!scores.length){ el.innerHTML=''; return; }
  let h='<table>';
  scores.slice(0,8).forEach((s,i)=>{
    h+=`<tr><td class="rank">${i+1}.</td><td>${esc(s.name)}</td><td>${s.score.toLocaleString()}</td></tr>`;
  });
  h+='</table>'; el.innerHTML=h;
}

// ── Title background ──────────────────────────────────────────────────────────
let titleTick = 0;
function renderTitleBg(){
  titleTick++;
  renderBg(titleTick);
  // faint zodiac symbols floating upward
  ctx.textAlign='center';
  const syms='♈♉♊♋♌♍♎♏♐♑♒♓';
  ctx.font='20px DotGothic16, monospace';
  ctx.fillStyle='rgba(165,180,252,0.2)';
  for(let i=0;i<12;i++){
    const x=20+i*(W/12)+10;
    const yo=((i*44 + titleTick*0.4)%H+H)%H;
    ctx.fillText(syms[i], x, yo);
  }
  requestAnimationFrame(()=>{ if(document.getElementById('screen-title').style.display!=='none') renderTitleBg(); });
}

// ── Main render ───────────────────────────────────────────────────────────────
function render(s){
  renderBg(s.tick);
  renderProgressBar(s);
  renderHUDCanvas(s);
  renderAsteroids(s.asteroids);
  renderShip(s.ship, s.tick);
}

// Progress bar on the right edge
function renderProgressBar(s){
  const bx=W-14, by=30, bh=H-60, bw=8;
  // track
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();
  // fill (from bottom up = ship moving toward top = progress)
  const pct=(s.progress||0)/100;
  const fillH=bh*pct;
  const gradient=ctx.createLinearGradient(0,by+bh,0,by+bh-fillH);
  gradient.addColorStop(0,'rgba(168,85,247,0.9)');
  gradient.addColorStop(1,'rgba(251,191,36,0.9)');
  ctx.fillStyle=gradient;
  ctx.beginPath(); ctx.roundRect(bx,by+bh-fillH,bw,fillH,4); ctx.fill();
  // destination icon at top of bar
  ctx.font='12px DotGothic16, monospace';
  ctx.fillStyle=`rgba(251,191,36,${0.6+0.4*Math.sin(s.tick*0.1)})`;
  ctx.textAlign='center';
  ctx.fillText(s.to.symbol, bx+bw/2, by-4);
}

// HUD drawn onto canvas
function renderHUDCanvas(s){
  // Score + HP + info — top left strip
  ctx.textAlign='left';
  ctx.font='13px DotGothic16, monospace';
  ctx.fillStyle='rgba(5,5,20,0.6)';
  ctx.fillRect(0,0,W-24,32);

  ctx.fillStyle='#fde68a';
  ctx.fillText(t('score_lbl')+(s.score||0).toLocaleString(), 10, 20);

  const hearts='❤️'.repeat(s.hp)+'🖤'.repeat(Math.max(0,3-s.hp));
  ctx.fillText(hearts, 180, 20);

  ctx.fillStyle='#a5b4fc';
  ctx.fillText(t('round_lbl')+s.round+'  '+t('lap_lbl')+s.lap+'  '+(s.stage+1)+'/12', 320, 20);

  // Destination label at bottom
  ctx.fillStyle='rgba(5,5,20,0.55)';
  ctx.fillRect(0,H-26,W,26);
  ctx.fillStyle='#7dd3fc';
  ctx.textAlign='center';
  ctx.font='12px DotGothic16, monospace';
  ctx.fillText(t('dest_lbl')(s.to), W/2, H-8);
}

function renderAsteroids(asteroids){
  if(!asteroids) return;
  for(const a of asteroids){
    ctx.save();
    ctx.translate(a.x, a.y);
    // deterministic rotation per asteroid (seed-based offset)
    ctx.rotate(lcgf(a.seed)*Math.PI*2);
    const r=a.r, pts=6+(lcg(a.seed)%4);
    ctx.beginPath();
    for(let i=0;i<pts;i++){
      const ang=(i/pts)*Math.PI*2;
      const jitter=0.62+lcgf(lcg(a.seed+i*31))*0.72;
      const px=Math.cos(ang)*r*jitter, py=Math.sin(ang)*r*jitter;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(105,85,65,0.88)';
    ctx.fill();
    ctx.strokeStyle='rgba(165,145,125,0.65)';
    ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }
}

function renderShip(ship, tick){
  if(!ship) return;
  // Blink during invincibility
  if(ship.invincible && Math.floor(tick/4)%2===1) return;

  ctx.save();
  ctx.translate(ship.x, ship.y);
  // Ship faces up, so rotate -PI/2 from default "right-facing" triangle
  ctx.rotate(-Math.PI/2);

  // Body (triangle pointing up)
  ctx.beginPath();
  ctx.moveTo(0,-16);
  ctx.lineTo(10,10);
  ctx.lineTo(0,4);
  ctx.lineTo(-10,10);
  ctx.closePath();
  ctx.fillStyle='#60a5fa';
  ctx.fill();
  ctx.strokeStyle='#93c5fd';
  ctx.lineWidth=1.5; ctx.stroke();

  // Engine exhaust (below ship = pointing down in ship-space = left in rotated space)
  const spd=Math.sqrt((ship.vx||0)**2+(ship.vy||0)**2);
  const thrusting = spd > 0.3 || keys.up || keys.down || keys.left || keys.right;
  if(thrusting){
    const fl=8+Math.random()*8;
    // Exhaust shoots out the bottom of the ship (positive y in ship space)
    ctx.beginPath();
    ctx.moveTo(-4,10); ctx.lineTo((Math.random()-0.5)*6,10+fl); ctx.lineTo(4,10);
    ctx.closePath();
    ctx.fillStyle=`rgba(251,191,36,${(0.6+Math.random()*0.4).toFixed(2)})`;
    ctx.fill();
  }

  ctx.restore();
}

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', ()=>{
  const name=document.getElementById('name-input').value.trim()||(lang==='ja'?'野郎':'Trucker');
  send({type:'start',name});
});
document.getElementById('name-input').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ document.getElementById('btn-start').click(); e.preventDefault(); }
});
document.getElementById('btn-restart').addEventListener('click', ()=> send({type:'restart'}));

// ── Virtual stick ─────────────────────────────────────────────────────────────
const vstickArea=document.getElementById('vstick-area');
const vstickKnob=document.getElementById('vstick-knob');
let vstickCenter={x:0,y:0};
const STICK_MAX=44;
if('ontouchstart' in window) vstickArea.style.display='block';

vstickArea.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=vstickArea.getBoundingClientRect();
  vstickCenter={x:r.left+r.width/2,y:r.top+r.height/2};
  updateStick(e.touches[0]);
},{passive:false});
vstickArea.addEventListener('touchmove',e=>{ e.preventDefault(); updateStick(e.touches[0]); },{passive:false});
document.addEventListener('touchend',()=>{
  vstickKnob.style.transform='translate(-50%,-50%)';
  keys.up=keys.down=keys.left=keys.right=false; sendKeys();
});
function updateStick(touch){
  const dx=touch.clientX-vstickCenter.x, dy=touch.clientY-vstickCenter.y;
  const d=Math.sqrt(dx*dx+dy*dy), c=Math.min(d,STICK_MAX);
  const nx=d>0?dx/d:0, ny=d>0?dy/d:0;
  vstickKnob.style.transform=`translate(calc(-50% + ${nx*c}px),calc(-50% + ${ny*c}px))`;
  const th=0.4;
  keys.up=ny<-th; keys.down=ny>th; keys.left=nx<-th; keys.right=nx>th;
  sendKeys();
}

// ── Init ──────────────────────────────────────────────────────────────────────
showScreen('title');
renderTitleBg();
connect();
</script>
