<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>中型宇宙トラック野郎</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#050510;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100dvh;
      font-family:'DotGothic16',monospace; color:#e2e8f0;
      user-select:none; overflow-x:hidden;
      overflow-y:hidden;
      padding:0;
      gap:0;
    }
    canvas { display:block; image-rendering:pixelated; max-width:100%; height:auto; }
    #wrap { position:relative; width:540px; max-width:100vw; }
    #game-hud{
      width:min(540px,100vw);
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:0 0 8px;
      padding:0 8px;
      font-size:0.8rem;
      color:#e2e8f0;
      text-shadow:0 0 8px rgba(0,0,0,.55);
    }
    #game-hud .hud-block{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
      white-space:nowrap;
    }
    #hud-score{ color:#fde68a; }
    #hud-life{ color:#fca5a5; }
    #hud-round{ color:#a5b4fc; margin-left:auto; }

    .overlay {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(5,5,20,.88); gap:14px; z-index:10;
    }
    .overlay h1 {
      font-size:1.7rem; letter-spacing:.08em; color:#fff;
      position:relative; z-index:2;
      text-shadow:0 0 8px #fff, 0 0 20px #a855f7, 0 0 40px #7c3aed;
    }
    .overlay h2 { font-size:1rem; color:#a855f7; }
    .overlay p  { font-size:0.8rem; color:#94a3b8; line-height:1.6; text-align:center; position:relative; z-index:2; }
    #screen-title, #screen-gameover{
      justify-content:center;
      padding:18px 14px 14px;
    }
    #screen-title h1, #screen-gameover h1, #screen-title p, #screen-gameover p{
      transform:none;
      margin:0;
    }
    .btn {
      padding:10px 28px;
      background:rgba(168,85,247,.2); border:1px solid rgba(168,85,247,.5);
      border-radius:8px; color:#e2e8f0; cursor:pointer;
      font-family:inherit; font-size:0.85rem; letter-spacing:.05em;
      transition:background .15s, box-shadow .15s;
    }
    .btn:hover { background:rgba(168,85,247,.35); box-shadow:0 0 12px rgba(168,85,247,.4); }

    #btn-back {
      position:fixed; top:10px; left:10px; z-index:200;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; padding:5px 12px; color:#9ca3af;
      font-family:inherit; font-size:0.7rem; cursor:pointer;
    }
    #btn-back:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }
    #btn-lang {
      position:fixed; top:10px; right:10px; z-index:200;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; padding:5px 12px; color:#9ca3af;
      font-family:inherit; font-size:0.7rem; cursor:pointer;
    }
    #btn-lang:hover { background:rgba(255,255,255,.1); color:#e2e8f0; }

    .score-list { width:260px; }
    .score-list table { width:100%; border-collapse:collapse; font-size:0.75rem; }
    .score-list td { padding:3px 6px; color:#94a3b8; }
    .score-list tr:first-child td { color:#fde68a; }
    .score-list tr:nth-child(2) td { color:#e2e8f0; }
    .score-list tr:nth-child(3) td { color:#fdba74; }
    .score-list .rank { color:#6b7280; width:24px; }

    #gm-comment {
      width:min(540px,100vw);
      margin:8px 0 0;
      padding:0 8px;
      font-size:0.75rem; color:#f9a8d4;
      text-shadow:0 0 8px #ec4899;
      pointer-events:none; z-index:15;
      transition:opacity .3s; opacity:0;
      text-align:left;
      align-self:center;
    }
    #gm-comment.show { opacity:1; }

    #touch-controls {
      position:fixed;
      left:50%;
      bottom:8px;
      transform:translateX(-50%);
      width:min(540px,100vw);
      display:none;
      justify-content:space-between;
      align-items:flex-end;
      padding:0 14px 8px;
      gap:18px;
      pointer-events:none;
      z-index:40;
    }
    #vstick-area {
      position:relative;
      width:120px; height:120px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
      border-radius:50%; display:none; z-index:8; touch-action:none;
      pointer-events:auto;
      flex:0 0 auto;
    }
    #vstick-knob {
      position:absolute; width:48px; height:48px; border-radius:50%;
      background:rgba(168,85,247,.35); border:1px solid rgba(168,85,247,.6);
      top:50%; left:50%; transform:translate(-50%,-50%);
    }
    #action-buttons{
      display:none;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
      pointer-events:auto;
      flex:0 0 auto;
    }
    #btn-manip{
      width:86px; height:86px;
      border-radius:50%;
      border:1px solid rgba(251,191,36,.55);
      background:radial-gradient(circle at 35% 30%, rgba(253,230,138,.4), rgba(120,53,15,.7));
      color:#fde68a;
      font-family:inherit;
      font-size:.82rem;
      letter-spacing:.05em;
      cursor:pointer;
      box-shadow:0 0 18px rgba(245,158,11,.18);
    }
    #btn-manip:active { transform:scale(.96); }
    #touch-hint{
      font-size:.62rem;
      color:#7c6f9a;
      text-align:right;
      max-width:96px;
    }
  </style>
</head>
<body>
<div id="game-hud">
  <div id="hud-score" class="hud-block"></div>
  <div id="hud-life" class="hud-block"></div>
  <div id="hud-round" class="hud-block"></div>
</div>
<div id="wrap">
  <canvas id="canvas" width="540" height="540"></canvas>

  <!-- Title -->
  <div id="screen-title" class="overlay">
    <h1 data-i18n="title">🚛 宇宙トラック野郎 🚛</h1>
    <p data-i18n="title_sub">小惑星をかきわけ、宇宙ステーションへ荷物を届けろ！</p>
    <div class="title-controls" style="display:flex;gap:10px;align-items:center;">
      <input id="name-input" type="text" maxlength="16"
        style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
               border-radius:6px;padding:8px 12px;color:#e2e8f0;font-family:inherit;font-size:0.85rem;width:160px;"
        data-i18n-ph="name_ph">
      <button class="btn" id="btn-start" data-i18n="btn_start">スタート！</button>
    </div>
    <div id="title-scores" class="score-list"></div>
    <p class="title-help" style="font-size:0.7rem;color:#4b5563;" data-i18n="controls">矢印キー / WASD で操作</p>
  </div>

  <!-- Gameover -->
  <div id="screen-gameover" class="overlay" style="display:none">
    <h1 data-i18n="go_title">GAME OVER</h1>
    <h2 id="go-score"></h2>
    <p id="go-rank"></p>
    <div id="go-scores" class="score-list"></div>
    <button class="btn" id="btn-restart" data-i18n="btn_restart">もう一度</button>
  </div>

  <!-- Stage/Lap clear flash -->
  <div id="screen-clear" class="overlay" style="display:none;background:rgba(5,5,20,.55);">
    <h1 id="cl-title" style="font-size:1.8rem;"></h1>
    <h2 id="cl-sub"></h2>
  </div>

  <button id="btn-back" onclick="location.href='/'">← <span data-i18n="back">メニュー</span></button>
  <button id="btn-lang">🇯🇵 / 🇬🇧</button>
</div>
<div id="gm-comment"></div>
<div id="touch-controls">
  <div id="vstick-area"><div id="vstick-knob"></div></div>
  <div id="action-buttons">
    <button id="btn-manip">MAG</button>
    <div id="touch-hint">MANIP</div>
  </div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
const I18N = {
  ja: {
    title:    '🚛 宇宙トラック野郎 🚛',
    title_sub:'小惑星をかきわけ、宇宙ステーションへ荷物を届けろ！',
    name_ph:  'なまえ',
    btn_start:'スタート！',
    btn_restart:'もう一度',
    controls: '矢印キー / WASD で操作',
    back:     'メニュー',
    go_title: 'GAME OVER',
    score_lbl:'スコア: ',
    round_lbl:'ROUND ',
    lap_lbl:  'LAP ',
    dest_lbl: (to) => `→ ${to.symbol} ${to.name_ja} へ配達中`,
    dock_lbl: (to) => `▲ ${to.symbol} ${to.name_ja} のエアロックへ！`,
    clear_title:(from,to) => `${from.symbol}→${to.symbol} 配達完了！`,
    lap_title:'1 LAP クリア！！',
    lap_sub:  (r) => `ROUND ${r} へ突入！難易度UP！`,
    rank_msg: (r) => `${r}位にランクイン！`,
    no_rank:  'ランク外',
    launch_txt:(from) => `${from.symbol} ${from.name_ja} を出発！`,
    gm_ok:    ['届いたよっ！','ナイスドライブ！','よっしゃ！','グッジョブ！'],
    gm_hit:   ['いたっ！','こわれちゃう！','きをつけて！','うわあっ！'],
    gm_lap:   ['いっしゅうしたよ！！','さすがトラック野郎！','やったぁ！'],
    gm_dock:  ['エアロックへ！','もうすぐだよ！','狙いをさだめて！'],
  },
  en: {
    title:    '🚛 Space Truckers 🚛',
    title_sub:'Dodge the asteroids and deliver to the space station!',
    name_ph:  'Your name',
    btn_start:'Start!',
    btn_restart:'Try Again',
    controls: 'Arrow keys / WASD to move',
    back:     'Menu',
    go_title: 'GAME OVER',
    score_lbl:'SCORE: ',
    round_lbl:'ROUND ',
    lap_lbl:  'LAP ',
    dest_lbl: (to) => `→ En route to ${to.symbol} ${to.name_en}`,
    dock_lbl: (to) => `▲ Enter airlock: ${to.symbol} ${to.name_en}!`,
    clear_title:(from,to) => `${from.symbol}→${to.symbol} Delivered!`,
    lap_title:'1 LAP CLEAR!!',
    lap_sub:  (r) => `Entering ROUND ${r}! Difficulty UP!`,
    rank_msg: (r) => `Ranked #${r}!`,
    no_rank:  'Not ranked',
    launch_txt:(from) => `Departing ${from.symbol} ${from.name_en}!`,
    gm_ok:    ['Delivered!','Nice drive!','Yeah!','Good job!'],
    gm_hit:   ['Ouch!','Watch out!','Take care!','Whoa!'],
    gm_lap:   ['One lap done!!','That\'s a trucker!','Woohoo!'],
    gm_dock:  ['Head to airlock!','Almost there!','Line it up!'],
  },
};

let lang = localStorage.getItem('gc_lang') || 'ja';
const t = k => I18N[lang][k] ?? k;
let playerName = localStorage.getItem('truckers_player_name') || '';

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=t(el.dataset.i18n); if(typeof v==='string') el.textContent=v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const v=t(el.dataset.i18nPh); if(typeof v==='string') el.placeholder=v;
  });
  document.getElementById('btn-lang').textContent=lang==='ja'?'🇯🇵 / 🇬🇧':'🇬🇧 / 🇯🇵';
  document.documentElement.lang=lang;
}
document.getElementById('btn-lang').addEventListener('click',()=>{
  lang=lang==='ja'?'en':'ja'; localStorage.setItem('gc_lang',lang); applyLang();
});
applyLang();

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const W=540, H=540;

function lcg(s){ return ((s>>>0)*1664525+1013904223)>>>0; }
function lcgf(s){ return (lcg(s)>>>0)/4294967295; }

// ── Star layers (parallax, scroll downward with variable speed) ───────────────
const STAR_LAYERS=[
  Array.from({length:80},(_,i)=>{const s=lcg(i*1009+1);return{x:lcgf(s)*W,y:lcgf(lcg(s))*H,r:0.55,parallax:0.5};}),
  Array.from({length:40},(_,i)=>{const s=lcg(i*7919+2);return{x:lcgf(s)*W,y:lcgf(lcg(s))*H,r:1.0, parallax:1.0};}),
];
const NEBULAS=Array.from({length:6},(_,i)=>{
  const s=lcg(i*31337+3);
  return{x:lcgf(s)*W,y:lcgf(lcg(s))*H,r:55+lcgf(lcg(s))*90,hue:200+lcgf(lcg(lcg(s)))*70,parallax:0.18};
});

// Cumulative scroll offset — updated each frame based on ship velocity
const BASE_SCROLL = 0.7;
const SCROLL_MIN  = 0.2;
const SCROLL_MAX  = 3.5;
let scrollSpeed  = BASE_SCROLL;
let scrollOffset = 0;

function updateScroll(shipY){
  const y = shipY ?? (H * 0.67);
  const pct = 1 - Math.max(0, Math.min(1, y / H));
  const target = SCROLL_MIN + pct * (SCROLL_MAX - SCROLL_MIN);
  scrollSpeed += (target - scrollSpeed) * 0.08;
  scrollOffset += scrollSpeed;
}

function renderBg(tick, shipY){
  updateScroll(shipY);
  ctx.fillStyle='#050510'; ctx.fillRect(0,0,W,H);
  for(const n of NEBULAS){
    const yo=((n.y + scrollOffset*n.parallax)%H+H)%H;
    drawNebula(n.x,yo,n.r,n.hue);
    if(yo<n.r)    drawNebula(n.x,yo+H,n.r,n.hue);
    if(yo>H-n.r)  drawNebula(n.x,yo-H,n.r,n.hue);
  }
  for(const layer of STAR_LAYERS){
    for(const st of layer){
      const yo=((st.y + scrollOffset*st.parallax)%H+H)%H;
      const a=0.3+0.25*Math.sin(tick*0.04+st.x*0.1);
      ctx.beginPath(); ctx.arc(st.x,yo,st.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(210,225,255,${a.toFixed(2)})`; ctx.fill();
      if(yo>H-3){ ctx.beginPath(); ctx.arc(st.x,yo-H,st.r,0,Math.PI*2); ctx.fill(); }
      if(yo<3)  { ctx.beginPath(); ctx.arc(st.x,yo+H,st.r,0,Math.PI*2); ctx.fill(); }
    }
  }
}
function drawNebula(x,y,r,hue){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`hsla(${hue},55%,22%,0.07)`);
  g.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
}

// ── Station drawing helpers ───────────────────────────────────────────────────
// Draw a space station: body + solar panels + airlock
function drawStation(cx, cy, symbol, name, isDestination, airlockX, pulse){
  // Main body
  ctx.save();
  ctx.translate(cx,cy);

  // Core ring
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2);
  ctx.strokeStyle=isDestination?`rgba(251,191,36,${0.5+0.4*pulse})`:'rgba(99,102,241,0.5)';
  ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2);
  ctx.fillStyle=isDestination?'rgba(45,30,10,0.8)':'rgba(20,20,40,0.8)';
  ctx.fill();

  // Solar panels
  ctx.fillStyle=isDestination?'rgba(251,191,36,0.35)':'rgba(99,102,241,0.3)';
  ctx.fillRect(-52,-6,24,12);  // left panel
  ctx.fillRect(28,-6,24,12);   // right panel
  ctx.strokeStyle=isDestination?'rgba(251,191,36,0.5)':'rgba(99,102,241,0.4)';
  ctx.lineWidth=1;
  ctx.strokeRect(-52,-6,24,12);
  ctx.strokeRect(28,-6,24,12);
  // Panel struts
  ctx.beginPath(); ctx.moveTo(-24,0); ctx.lineTo(-28,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24,0);  ctx.lineTo(28,0);  ctx.stroke();

  // Symbol + name
  ctx.textAlign='center';
  ctx.font='14px DotGothic16, monospace';
  ctx.fillStyle=isDestination?`rgba(253,230,138,${0.7+0.3*pulse})`:'rgba(165,180,252,0.8)';
  ctx.fillText(symbol,0,5);
  ctx.font='9px DotGothic16, monospace';
  ctx.fillStyle=isDestination?'rgba(253,230,138,0.6)':'rgba(148,163,184,0.5)';
  ctx.fillText(name,0,20);

  ctx.restore();

  // Airlock marker (separate from station center, at airlockX)
  if(isDestination){
    const ax=airlockX, ay=cy;
    // Connector tube from station to airlock
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ax,ay);
    ctx.strokeStyle=`rgba(251,191,36,${0.2+0.15*pulse})`; ctx.lineWidth=1;
    ctx.setLineDash([4,6]); ctx.stroke(); ctx.setLineDash([]);

    // Airlock opening (glowing)
    const glowR=14+4*pulse;
    const grd=ctx.createRadialGradient(ax,ay,2,ax,ay,glowR);
    grd.addColorStop(0,`rgba(34,197,94,${0.6+0.3*pulse})`);
    grd.addColorStop(1,'rgba(34,197,94,0)');
    ctx.beginPath(); ctx.arc(ax,ay,glowR,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();

    ctx.beginPath(); ctx.arc(ax,ay,8,0,Math.PI*2);
    ctx.fillStyle=`rgba(34,197,94,${0.4+0.3*pulse})`; ctx.fill();
    ctx.strokeStyle=`rgba(134,239,172,${0.7+0.3*pulse})`; ctx.lineWidth=2; ctx.stroke();

    // Arrow pointing down to airlock
    ctx.fillStyle=`rgba(134,239,172,${0.6+0.3*pulse})`;
    ctx.textAlign='center'; ctx.font='12px sans-serif';
    ctx.fillText('▼',ax,ay+28);
  }
}

// Draw departure station (at bottom)
function drawDepartStation(cx, sy, symbol, name, departX){
  ctx.save(); ctx.translate(cx,sy);
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2);
  ctx.strokeStyle='rgba(99,102,241,0.4)'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2);
  ctx.fillStyle='rgba(20,20,40,0.8)'; ctx.fill();
  // Panels
  ctx.fillStyle='rgba(99,102,241,0.25)'; ctx.fillRect(-44,-5,20,10); ctx.fillRect(24,-5,20,10);
  ctx.textAlign='center'; ctx.font='12px DotGothic16, monospace';
  ctx.fillStyle='rgba(165,180,252,0.6)'; ctx.fillText(symbol,0,4);
  ctx.restore();

  // Departure airlock (green, at departX)
  ctx.beginPath(); ctx.arc(departX,sy,7,0,Math.PI*2);
  ctx.fillStyle='rgba(34,197,94,0.3)'; ctx.fill();
  ctx.strokeStyle='rgba(134,239,172,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
}

// ── Ship drawing (upward-facing van/truck with directional thrusters) ─────────
function drawTruck(x, y, vx, vy, invincible, tick){
  if(invincible && Math.floor(tick/4)%2===1) return;

  ctx.save();
  ctx.translate(x,y);

  const tw=14, th=28;

  // ── Thrusters (drawn BEHIND ship body, in opposite direction of velocity) ──
  drawThrusters(tw, th);

  // Body (vertical rectangle, facing up)
  ctx.fillStyle='#2563eb';
  ctx.fillRect(-tw/2,-th/2, tw, th);

  // Front (top) — cab window
  ctx.fillStyle='#bfdbfe';
  ctx.fillRect(-tw/2+2,-th/2+2, tw-4, 9);

  // Windshield tint lines
  ctx.strokeStyle='rgba(147,197,253,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-tw/2+4,-th/2+4); ctx.lineTo(-tw/2+4,-th/2+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-tw/2+8,-th/2+4); ctx.lineTo(-tw/2+8,-th/2+10); ctx.stroke();

  // Cargo section (lower)
  ctx.fillStyle='#1e3a8a';
  ctx.fillRect(-tw/2,-th/2+13, tw, th/2+2);

  // Stripe between cab and cargo
  ctx.fillStyle='#1d4ed8';
  ctx.fillRect(-tw/2,-th/2+12, tw, 2);

  // Outline
  ctx.strokeStyle='#93c5fd'; ctx.lineWidth=1.5;
  ctx.strokeRect(-tw/2,-th/2, tw, th);

  // Front lights
  ctx.fillStyle='#fde68a';
  ctx.fillRect(-tw/2+1,-th/2+1, 3,3);
  ctx.fillRect(tw/2-4,-th/2+1, 3,3);

  // Rear lights
  ctx.fillStyle='#ef4444';
  ctx.fillRect(-tw/2+1, th/2-4, 3,3);
  ctx.fillRect(tw/2-4,  th/2-4, 3,3);

  ctx.restore();
}

function drawThrusters(tw, th){
  const MAIN_COLOR  = 'rgba(251,191,36,'; // メインエンジン: 黄炎
  const SIDE_COLOR  = 'rgba(147,197,253,'; // サイドスラスター: 青白

  // 入力中だけ噴射、慣性移動中は止める
  if(keys.up){
    const fl=10+Math.random()*12, fw=4+Math.random()*3;
    ctx.beginPath();
    ctx.moveTo(-fw/2, th/2);
    ctx.lineTo((Math.random()-0.5)*4, th/2+fl);
    ctx.lineTo( fw/2, th/2);
    ctx.closePath();
    ctx.fillStyle=MAIN_COLOR+(0.7+Math.random()*0.3)+')';
    ctx.fill();
  }
  // 下に動いている(vy>0): 上(リトロスラスター)
  if(keys.down){
    const fl=5+Math.random()*7;
    ctx.beginPath();
    ctx.moveTo(-3, -th/2);
    ctx.lineTo((Math.random()-0.5)*3, -th/2-fl);
    ctx.lineTo( 3, -th/2);
    ctx.closePath();
    ctx.fillStyle=SIDE_COLOR+(0.55+Math.random()*0.3)+')';
    ctx.fill();
  }
  // 右に動いている(vx>0): 左からサイドスラスター噴射
  if(keys.right){
    const fl=4+Math.random()*6;
    ctx.beginPath();
    ctx.moveTo(-tw/2, -4);
    ctx.lineTo(-tw/2-fl, (Math.random()-0.5)*4);
    ctx.lineTo(-tw/2,  4);
    ctx.closePath();
    ctx.fillStyle=SIDE_COLOR+(0.5+Math.random()*0.3)+')';
    ctx.fill();
  }
  // 左に動いている(vx<0): 右からサイドスラスター噴射
  if(keys.left){
    const fl=4+Math.random()*6;
    ctx.beginPath();
    ctx.moveTo(tw/2, -4);
    ctx.lineTo(tw/2+fl, (Math.random()-0.5)*4);
    ctx.lineTo(tw/2,  4);
    ctx.closePath();
    ctx.fillStyle=SIDE_COLOR+(0.5+Math.random()*0.3)+')';
    ctx.fill();
  }
}

function drawMinerals(minerals){
  if(!minerals) return;
  for(const m of minerals){
    const isRare = m.kind === 'rare';
    const fill = isRare ? 'rgba(192,132,252,0.9)' : 'rgba(251,191,36,0.92)';
    const stroke = isRare ? 'rgba(233,213,255,0.7)' : 'rgba(254,240,138,0.7)';
    const r = 5;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate((m.seed % 628) / 100);
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

function drawManipulator(ship, manipLen){
  if(!ship || !manipLen || manipLen <= 0) return;
  const x = ship.x;
  const y1 = ship.y - 10;
  const y2 = ship.y - 10 - manipLen;
  ctx.save();
  ctx.strokeStyle = 'rgba(226,232,240,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y1);
  ctx.lineTo(x, y2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(148,163,184,0.65)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 4, y2 - 3);
  ctx.lineTo(x, y2);
  ctx.lineTo(x + 4, y2 - 3);
  ctx.stroke();
  ctx.restore();
}

// ── Asteroid drawing (color-coded by speed tier) ─────────────────────────────
// tier 0(遅): グレー, 1: 茶, 2: オレンジ, 3: 赤みオレンジ, 4(速): 赤白熱
const ASTEROID_COLORS=[
  ['rgba(90,85,80,0.88)',  'rgba(140,135,130,0.65)'], // tier0: 遅・灰
  ['rgba(105,85,55,0.88)', 'rgba(160,140,110,0.65)'], // tier1: 茶
  ['rgba(140,80,40,0.88)', 'rgba(200,140,80,0.65)'],  // tier2: オレンジ
  ['rgba(160,60,30,0.88)', 'rgba(220,110,60,0.65)'],  // tier3: 赤橙
  ['rgba(180,40,20,0.88)', 'rgba(240,80,40,0.85)'],   // tier4: 速・赤熱
];

function drawAsteroids(asteroids){
  if(!asteroids) return;
  for(const a of asteroids){
    const tier = Math.min(4, a.tier ?? 0);
    const [fill, stroke] = ASTEROID_COLORS[tier];
    ctx.save(); ctx.translate(a.x,a.y);
    ctx.rotate(lcgf(a.seed)*Math.PI*2);
    const r=a.r, pts=6+(lcg(a.seed)%4);
    ctx.beginPath();
    for(let i=0;i<pts;i++){
      const ang=(i/pts)*Math.PI*2;
      const j=0.60+lcgf(lcg(a.seed+i*31))*0.75;
      const px=Math.cos(ang)*r*j, py=Math.sin(ang)*r*j;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    ctx.strokeStyle=stroke; ctx.lineWidth=tier>=3?1.5:1; ctx.stroke();
    // 速いやつは速度感のある軌跡グロー
    if(tier>=3){
      const glowLen=r*0.8*(tier===4?1.6:1.0);
      const grd=ctx.createLinearGradient(0,0,0,glowLen);
      grd.addColorStop(0, tier===4?'rgba(255,120,60,0.35)':'rgba(220,100,40,0.25)');
      grd.addColorStop(1,'transparent');
      ctx.beginPath(); ctx.ellipse(0,0,r*0.55,glowLen,0,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
    }
    ctx.restore();
  }
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function drawProgressBar(progress, phase){
  const bx=W-14, by=40, bh=H-80, bw=8;
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,4); ctx.fill();

  const pct=(progress||0)/100;
  if(pct>0){
    const fh=bh*pct;
    const g=ctx.createLinearGradient(0,by+bh,0,by+bh-fh);
    g.addColorStop(0,'rgba(168,85,247,0.9)');
    g.addColorStop(0.8,'rgba(251,191,36,0.9)');
    g.addColorStop(1,'rgba(34,197,94,0.9)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.roundRect(bx,by+bh-fh,bw,fh,4); ctx.fill();
  }
  // Docking zone marker at top
  const dockZoneY=by + bh*(1-0.80) - 3;
  ctx.strokeStyle='rgba(34,197,94,0.5)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(bx-4,dockZoneY); ctx.lineTo(bx+bw+4,dockZoneY); ctx.stroke();
  ctx.setLineDash([]);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(s){
  document.getElementById('hud-score').textContent = t('score_lbl')+(s.score||0).toLocaleString();
  document.getElementById('hud-life').textContent = '❤️'.repeat(s.hp)+'🖤'.repeat(Math.max(0,3-s.hp));
  document.getElementById('hud-round').textContent = t('round_lbl')+s.round+'  '+t('lap_lbl')+s.lap+'  '+(s.stage+1)+'/12';

  // Bottom bar
  ctx.fillStyle='rgba(5,5,20,0.55)'; ctx.fillRect(0,H-30,W,30);
  ctx.textAlign='center';
  const isDocking = s.phase==='docking';
  ctx.font = isDocking ? '14px DotGothic16, monospace' : '12px DotGothic16, monospace';
  ctx.fillStyle = isDocking ? '#86efac' : '#7dd3fc';
  const label = isDocking ? t('dock_lbl')(s.to) : t('dest_lbl')(s.to);
  ctx.fillText(label, W/2, H-9);
  ctx.textAlign='left';
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws=null;
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/truckers`);
  ws.onmessage=e=>handleMsg(JSON.parse(e.data));
  ws.onclose=()=>{ ws=null; setTimeout(connect,2000); };
}
function send(obj){ if(ws&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// ── Input ─────────────────────────────────────────────────────────────────────
const keys={up:false,down:false,left:false,right:false,manip:false};
document.addEventListener('keydown',e=>{
  if(applyKey(e.code,true)){ updateThrusterAudio(); sendKeys(); }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>{ if(applyKey(e.code,false)){ updateThrusterAudio(); sendKeys(); } });
function applyKey(code,val){
  const m={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'manip',KeyJ:'manip'};
  const k=m[code]; if(k&&keys[k]!==val){keys[k]=val;return true;} return false;
}
function sendKeys(){ send({type:'input',keys:{...keys}}); }

let audioCtx = null;
let mainEngineOsc = null;
let mainEngineGain = null;
let mainEngineActive = false;
let sideThrusterLast = {left:false,right:false,down:false};
function ensureAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
}
function resumeAudio(){ if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
function beep(freq=880, duration=0.08, type='square', gain=0.06){
  ensureAudio(); if(!audioCtx) return;
  resumeAudio();
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(gain, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(g).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function noiseBurst(duration=0.06, gain=0.045){
  ensureAudio(); if(!audioCtx) return;
  resumeAudio();
  const len = Math.floor(audioCtx.sampleRate * duration);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  src.buffer = buf;
  g.gain.value = gain;
  src.connect(g).connect(audioCtx.destination);
  src.start();
}
function setMainEngine(on){
  ensureAudio(); if(!audioCtx) return;
  resumeAudio();
  if(on){
    if(!mainEngineOsc){
      mainEngineOsc = audioCtx.createOscillator();
      mainEngineGain = audioCtx.createGain();
      mainEngineOsc.type = 'sawtooth';
      mainEngineOsc.frequency.value = 92;
      mainEngineGain.gain.value = 0.0001;
      mainEngineOsc.connect(mainEngineGain).connect(audioCtx.destination);
      mainEngineOsc.start();
    }
    mainEngineGain.gain.cancelScheduledValues(audioCtx.currentTime);
    mainEngineGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.05);
  } else if(mainEngineGain){
    mainEngineGain.gain.cancelScheduledValues(audioCtx.currentTime);
    mainEngineGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
  }
  mainEngineActive = on;
}
function updateThrusterAudio(){
  setMainEngine(!!keys.up);
  for(const k of ['left','right','down']){
    if(keys[k] && !sideThrusterLast[k]) noiseBurst();
    sideThrusterLast[k] = !!keys[k];
  }
}

// ── Message handler ───────────────────────────────────────────────────────────
let gmTimeout=null, lastEvent=null, prevPhase=null;

function handleMsg(msg){
  if(msg.type!=='state') return;
  switch(msg.phase){
    case 'title':
      showScreen('title'); renderTitleBg(); renderScoreList('title-scores',msg.scores||[]); break;
    case 'launching':
    case 'playing':
    case 'docking':
      showScreen('playing'); renderGame(msg);
      if(msg.event && msg.event!==lastEvent){
        if(msg.event==='damage')  showGm(pick(t('gm_hit')));
        if(msg.event==='delivery')showGm(pick(t('gm_ok')));
        if(msg.event==='mineral_gold'){ showGm(lang==='ja'?'金鉱石ゲット！':'Gold ore get!'); beep(1040,0.07,'square',0.05); }
        if(msg.event==='mineral_rare'){ showGm(lang==='ja'?'レアメタルきた！':'Rare metal!'); beep(1320,0.09,'triangle',0.06); }
      }
      // On first tick of docking phase
      if(msg.phase==='docking' && prevPhase!=='docking') showGm(pick(t('gm_dock')));
      lastEvent=msg.event; prevPhase=msg.phase;
      break;
    case 'stage_clear':
      showScreen('playing'); renderGame(msg);
      showClear(t('clear_title')(msg.from,msg.to), t('score_lbl')+(msg.score||0).toLocaleString());
      showGm(pick(t('gm_ok'))); prevPhase=msg.phase; break;
    case 'lap_clear':
      showScreen('playing'); renderGame(msg);
      showClear(t('lap_title'),t('lap_sub')(msg.round));
      showGm(pick(t('gm_lap'))); prevPhase=msg.phase; break;
    case 'gameover':
      showScreen('gameover');
      document.getElementById('go-score').textContent=t('score_lbl')+(msg.score||0).toLocaleString();
      document.getElementById('go-rank').textContent=msg.rank?t('rank_msg')(msg.rank):t('no_rank');
      renderScoreList('go-scores',msg.scores||[]); break;
  }
}

function showClear(title,sub){
  document.getElementById('cl-title').textContent=title;
  document.getElementById('cl-sub').textContent=sub;
  document.getElementById('screen-clear').style.display='flex';
}
function showScreen(name){
  document.getElementById('screen-title').style.display   =name==='title'   ?'flex':'none';
  document.getElementById('screen-gameover').style.display=name==='gameover'?'flex':'none';
  document.getElementById('screen-clear').style.display   ='none';
  const showTopButtons = name !== 'playing';
  document.getElementById('btn-back').style.display = showTopButtons ? '' : 'none';
  document.getElementById('btn-lang').style.display = showTopButtons ? '' : 'none';
  document.getElementById('game-hud').style.display = name === 'playing' ? 'flex' : 'none';
  touchControls.style.display = (name === 'playing' && isTouchDevice) ? 'flex' : 'none';
}
function showGm(text){
  const el=document.getElementById('gm-comment');
  el.textContent=text; el.classList.add('show');
  clearTimeout(gmTimeout); gmTimeout=setTimeout(()=>el.classList.remove('show'),2200);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderScoreList(id,scores){
  const el=document.getElementById(id); if(!scores.length){el.innerHTML='';return;}
  let h='<table>';
  scores.slice(0,5).forEach((s,i)=>{h+=`<tr><td class="rank">${i+1}.</td><td>${esc(s.name)}</td><td>${s.score.toLocaleString()}</td></tr>`;});
  h+='</table>'; el.innerHTML=h;
}

// ── Main render ───────────────────────────────────────────────────────────────
function renderGame(s){
  const tick=s.tick||0;
  renderBg(tick, s.ship ? s.ship.y : undefined);
  drawProgressBar(s.progress, s.phase);

  const pulse=0.5+0.5*Math.sin(tick*0.1);
  const name = lang==='ja' ? s.to.name_ja : s.to.name_en;

  // ── Departure station (bottom) — visible during launch ──
  if(s.phase==='launching' || s.stage_tick < 120){
    const fromName=lang==='ja'?s.from.name_ja:s.from.name_en;
    const alpha=s.stage_tick<90?1.0:Math.max(0,1-(s.stage_tick-90)/30);
    if(alpha>0){
      ctx.globalAlpha=alpha;
      // Station body slightly below screen bottom, airlock at depart_x
      const stationY=H+20;  // mostly off-screen
      const airlockY=H-40;
      // Draw airlock at bottom
      const grd=ctx.createRadialGradient(s.depart_x,airlockY,2,s.depart_x,airlockY,18);
      grd.addColorStop(0,'rgba(99,102,241,0.6)');
      grd.addColorStop(1,'rgba(99,102,241,0)');
      ctx.beginPath(); ctx.arc(s.depart_x,airlockY,18,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
      ctx.beginPath(); ctx.arc(s.depart_x,airlockY,7,0,Math.PI*2);
      ctx.fillStyle='rgba(99,102,241,0.5)'; ctx.fill();
      ctx.strokeStyle='rgba(165,180,252,0.7)'; ctx.lineWidth=2; ctx.stroke();
      // "LAUNCH" text
      ctx.textAlign='center'; ctx.font='10px DotGothic16, monospace';
      ctx.fillStyle='rgba(165,180,252,0.7)';
      ctx.fillText(t('launch_txt')(s.from), s.depart_x, airlockY-24);
      ctx.globalAlpha=1.0;
    }
  }

  // ── Destination station (top) — appears when progress >= 80% or docking ──
  if(s.phase==='docking' || (s.progress||0)>=78){
    const stationX=270, stationY=30;
    drawStation(stationX, stationY, s.to.symbol, name, true, s.airlock_x, pulse);
  }

  drawAsteroids(s.asteroids);
  drawMinerals(s.minerals);
  drawManipulator(s.ship, s.manip_len);
  drawTruck(s.ship.x, s.ship.y, s.ship.vx, s.ship.vy, s.ship.invincible, tick);
  drawHUD(s);
}

// ── Title background animation ────────────────────────────────────────────────
let titleTick=0;
function renderTitleBg(){
  titleTick++;
  renderBg(titleTick, 0);
  ctx.textAlign='center';
  const syms='♈♉♊♋♌♍♎♏♐♑♒♓';
  ctx.font='18px DotGothic16, monospace';
  for(let i=0;i<12;i++){
    const x=22+i*(W/12)+5;
    const yo=((i*46+titleTick*0.5)%H+H)%H;
    ctx.fillStyle=`rgba(165,180,252,${0.15+0.1*Math.sin(titleTick*0.05+i)})`;
    ctx.fillText(syms[i],x,yo);
  }
  requestAnimationFrame(()=>{ if(document.getElementById('screen-title').style.display!=='none') renderTitleBg(); });
}

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click',()=>{
  ensureAudio(); resumeAudio();
  const n=document.getElementById('name-input').value.trim()||(lang==='ja'?'野郎':'Trucker');
  playerName = n;
  localStorage.setItem('truckers_player_name', playerName);
  send({type:'start',name:n});
});
document.getElementById('name-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){document.getElementById('btn-start').click();e.preventDefault();}
});
document.getElementById('btn-restart').addEventListener('click',()=>send({type:'restart'}));

// ── Virtual stick ─────────────────────────────────────────────────────────────
const vstickArea=document.getElementById('vstick-area');
const vstickKnob=document.getElementById('vstick-knob');
const btnManip=document.getElementById('btn-manip');
const actionButtons=document.getElementById('action-buttons');
const touchControls=document.getElementById('touch-controls');
const isTouchDevice = 'ontouchstart' in window;
let vstickCenter={x:0,y:0};
const STICK_MAX=44;
if(isTouchDevice){ vstickArea.style.display='block'; actionButtons.style.display='flex'; }
vstickArea.addEventListener('touchstart',e=>{
  e.preventDefault();
  ensureAudio(); resumeAudio();
  const r=vstickArea.getBoundingClientRect();
  vstickCenter={x:r.left+r.width/2,y:r.top+r.height/2};
  updateStick(e.touches[0]);
},{passive:false});
vstickArea.addEventListener('touchmove',e=>{e.preventDefault();updateStick(e.touches[0]);},{passive:false});
document.addEventListener('touchend',()=>{
  vstickKnob.style.transform='translate(-50%,-50%)';
  keys.up=keys.down=keys.left=keys.right=false; updateThrusterAudio(); sendKeys();
});
function updateStick(t2){
  const dx=t2.clientX-vstickCenter.x,dy=t2.clientY-vstickCenter.y;
  const d=Math.sqrt(dx*dx+dy*dy),c=Math.min(d,STICK_MAX);
  const nx=d>0?dx/d:0,ny=d>0?dy/d:0;
  vstickKnob.style.transform=`translate(calc(-50% + ${nx*c}px),calc(-50% + ${ny*c}px))`;
  const th=0.4;
  keys.up=ny<-th; keys.down=ny>th; keys.left=nx<-th; keys.right=nx>th; updateThrusterAudio(); sendKeys();
}

['touchstart','mousedown'].forEach(ev=>{
  btnManip.addEventListener(ev,e=>{
    e.preventDefault();
    ensureAudio(); resumeAudio();
    keys.manip = true;
    sendKeys();
  }, {passive:false});
});
['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>{
  btnManip.addEventListener(ev,e=>{
    e.preventDefault();
    keys.manip = false;
    sendKeys();
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
showScreen('title');
document.getElementById('name-input').value = playerName;
renderTitleBg();
connect();
</script>
