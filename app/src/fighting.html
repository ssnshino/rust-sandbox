<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>あやかファイティング</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a12;color:#fff;font-family:'M PLUS 1p',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;overflow:hidden;touch-action:none}
#wrap{width:540px;max-width:100vw;display:flex;flex-direction:column;align-items:center}
canvas{display:block;width:540px;max-width:100vw;height:auto;image-rendering:pixelated;touch-action:none}

/* ── HUD ── */
#hud{width:100%;padding:4px 8px;display:flex;justify-content:space-between;font-size:12px;color:#aaa;letter-spacing:1px}
#hp-row{width:100%;display:flex;align-items:center;gap:6px;padding:4px 8px}
.hp-label{font-size:11px;color:#aaa;white-space:nowrap;width:80px}
.hp-label.right{text-align:right}
.hp-bar-wrap{flex:1;height:14px;background:#222;border-radius:3px;overflow:hidden;border:1px solid #333}
.hp-bar{height:100%;transition:width .1s;border-radius:2px}
#hp-p{background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .1s}
#hp-c{background:linear-gradient(90deg,#ef4444,#dc2626);transition:width .1s;float:right}
.hp-bar-wrap.right{direction:rtl}

/* ── GM ── */
#gm-wrap{width:100%;min-height:38px;padding:4px 10px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.07)}
#gm-icon{font-size:20px;flex-shrink:0}
#gm-text{font-size:13px;color:#fde68a;line-height:1.4}

/* ── Controls ── */
#controls{width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:8px;gap:8px;background:rgba(0,0,0,.3)}
#stick-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
#stick-base{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15)}
#stick-knob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.4);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#btn-wrap{position:relative;width:150px;height:130px;flex-shrink:0}
.fight-btn{position:absolute;width:60px;height:60px;border-radius:50%;border:none;font-size:11px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.2}
#btn-punch{top:0;right:0;background:radial-gradient(circle at 40% 35%,#fbbf24,#d97706);color:#7c2d12}
#btn-kick{top:0;left:0;background:radial-gradient(circle at 40% 35%,#60a5fa,#2563eb);color:#dbeafe}
#btn-guard{bottom:0;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 40% 35%,#4ade80,#16a34a);color:#052e16}
.fight-btn:active{filter:brightness(.8)}

/* ── Title screen ── */
#title-screen{position:fixed;inset:0;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
#title-screen h1{font-size:28px;color:#fde68a;letter-spacing:2px;text-shadow:0 0 20px rgba(253,230,138,.5)}
#title-screen h2{font-size:14px;color:#aaa}
.title-btn{padding:12px 32px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin:4px}
#btn-1p{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
#btn-lang{background:rgba(255,255,255,.1);color:#aaa;font-size:12px;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:6px;cursor:pointer}
#scores-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 20px;min-width:200px}
#scores-box h3{font-size:12px;color:#aaa;margin-bottom:6px;text-align:center}
.score-row{display:flex;justify-content:space-between;font-size:13px;gap:16px;padding:2px 0}
.score-rank{color:#fde68a;width:20px}
.score-name{color:#ddd;flex:1}
.score-pts{color:#4ade80;font-variant-numeric:tabular-nums}

/* ── Name input ── */
#name-screen{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:11;display:none}
#name-screen input{padding:10px 16px;font-size:16px;border-radius:8px;border:2px solid #fde68a;background:#1a1a2e;color:#fff;text-align:center;width:220px}
#name-screen button{padding:10px 28px;border-radius:8px;border:none;background:#fde68a;color:#1a1a2e;font-size:15px;font-weight:700;cursor:pointer}

/* ── Overlay ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:12;display:none}
#overlay h2{font-size:26px;color:#fde68a}
#overlay p{color:#ddd;font-size:14px}
#overlay button{padding:12px 32px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:#22c55e;color:#fff;margin:4px}

</style>
    <link rel="icon" href="/favicon.ico" />
  </head>
<body>

<!-- Title -->
<div id="title-screen">
  <h1 id="t-title">あやかファイティング</h1>
  <h2 id="t-sub">〜イーアル拳法〜</h2>
  <div id="scores-box">
    <h3 id="t-hiscore">ハイスコア</h3>
    <div id="score-list"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="title-btn" id="btn-1p">1人プレイ</button>
    <div style="position:relative">
      <button class="title-btn" id="btn-2p" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">2人対戦</button>
      <span id="waiting-badge" style="display:none;position:absolute;top:-6px;right:-6px;background:#f59e0b;color:#1a1a2e;font-size:10px;font-weight:700;padding:2px 5px;border-radius:10px;white-space:nowrap">待機中!</span>
    </div>
  </div>
  <a id="btn-menu" href="/" style="color:#aaa;font-size:13px;text-decoration:none;padding:6px 14px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.06)">← メニューへ</a>
  <button id="btn-lang">🇯🇵 日本語 / 🇬🇧 English</button>
</div>

<!-- Name input -->
<div id="name-screen">
  <p id="ns-label">なまえをいれてね！</p>
  <input id="name-input" maxlength="12" placeholder="NAME">
  <button id="name-ok">OK！</button>
</div>

<!-- Main game area -->
<div id="wrap">
  <div id="hud">
    <span id="hud-name" style="color:#fde68a;font-weight:700"></span>
    <span id="hud-score">SCORE 0</span>
    <span id="hud-stage">STAGE 1</span>
    <span id="hud-high">HIGH 0</span>
  </div>
  <div id="hp-row">
    <div class="hp-label" id="hp-p-label">あやか</div>
    <div class="hp-bar-wrap"><div class="hp-bar" id="hp-p" style="width:100%"></div></div>
    <div style="width:8px"></div>
    <div class="hp-bar-wrap right"><div class="hp-bar" id="hp-c" style="width:100%"></div></div>
    <div class="hp-label right" id="hp-c-label">ヨワヨワくん</div>
  </div>
  <canvas id="canvas" width="540" height="360"></canvas>
  <div id="gm-wrap">
    <div id="gm-icon">🌸</div>
    <div id="gm-text">ファイトだよっ！</div>
  </div>
  <div id="controls">
    <div id="stick-wrap">
      <div id="stick-base"></div>
      <div id="stick-knob"></div>
    </div>
    <div id="btn-wrap">
      <button class="fight-btn" id="btn-punch">👊<br>PUNCH</button>
      <button class="fight-btn" id="btn-kick">🦵<br>KICK</button>
      <button class="fight-btn" id="btn-guard">🛡<br>GUARD</button>
    </div>
  </div>
</div>

<!-- Stage clear / Game over overlay -->
<div id="overlay">
  <h2 id="ov-title"></h2>
  <p id="ov-sub"></p>
  <p id="ov-score"></p>
  <button id="ov-btn"></button>
</div>


<script>
// ── I18N ──────────────────────────────────────────────────────────────────────
const I18N = {
  ja: {
    title:'あやかファイティング', sub:'〜イーアル拳法〜',
    hiscore:'ハイスコア', btn1p:'1人プレイ', btn2p:'2人対戦',
    waiting:'対戦相手を待っています…',
    nameLabel:'なまえをいれてね！', nameOk:'OK！',
    punch:'PUNCH', kick:'KICK',
    stage:'ステージ', score:'スコア', high:'ハイ',
    stageClear:'ステージクリア！', allClear:'全員倒した！！',
    gameover:'ゲームオーバー', nextBtn:'次のステージへ！',
    retryBtn:'もう一度！', titleBtn:'タイトルへ',
    bonus:'ボーナス', ssTitle:'ハイスコア！', ssLabel:'なまえをいれてね',
    ssOk:'登録！',
    matchWin:'WIN!!', matchLose:'LOSE...',
    roundWin:'ラウンド勝利！', roundLose:'ラウンド敗北…',
    menuBtn:'← メニューへ',
    hpP:'あやか', hpCPrefix:'VS',
    GM: {
      stage_start:['ファイト！','いくよっ！！','まけないよ！'],
      player_hit:['よし！当たった！','ナイスヒット！','そこだっ！','いい感じ！'],
      cpu_hit:['あいたっ！','くらった！','あやかピンチ！','うう…'],
      player_low_hp:['HPやばい！！','回復できないの！？','もう少しがんばれ！'],
      player_dead:['やられた…','ゲームオーバー…','うう、悔しい！'],
      stage_clear:['クリア！！','やったね！','次はもっと強いよっ！'],
      all_clear:['全ステージクリア！！','最強かも！！','すごすぎっ！！'],
      gameover:['ドンマイ！','また挑戦してね！','次はかてるよ！'],
      guard_success:['ガード！','ふせいだ！','そこ！カウンターのチャンスだよっ！'],
    }
  },
  en: {
    title:'Ayaka Fighting', sub:'~Ee-Ar Kung Fu~',
    hiscore:'HIGH SCORES', btn1p:'1 PLAYER', btn2p:'2P BATTLE',
    waiting:'Waiting for opponent...',
    nameLabel:'Enter your name!', nameOk:'OK!',
    punch:'PUNCH', kick:'KICK',
    stage:'STAGE', score:'SCORE', high:'HIGH',
    stageClear:'STAGE CLEAR!', allClear:'ALL STAGES CLEAR!!',
    gameover:'GAME OVER', nextBtn:'NEXT STAGE',
    retryBtn:'RETRY', titleBtn:'TITLE',
    bonus:'BONUS', ssTitle:'HIGH SCORE!', ssLabel:'Enter your name',
    ssOk:'SUBMIT',
    matchWin:'WIN!!', matchLose:'LOSE...',
    roundWin:'ROUND WIN!', roundLose:'ROUND LOST...',
    menuBtn:'← MENU',
    hpP:'AYAKA', hpCPrefix:'VS',
    GM: {
      stage_start:['FIGHT!','Let\'s go!!','I won\'t lose!'],
      player_hit:['Hit!','Nice!','Got \'em!','Good hit!'],
      cpu_hit:['Ouch!','Got hit!','Ayaka in trouble!'],
      player_low_hp:['HP critical!!','Almost out!','Hang in there!'],
      player_dead:['Defeated...','Game Over...','So close!'],
      stage_clear:['Clear!!','Nice work!','Next one\'s tougher!'],
      all_clear:['ALL CLEAR!!','You\'re the best!!','Amazing!!'],
      gameover:['Good try!','Try again!','You can do it!'],
      guard_success:['Guard!','Blocked!','Counter time!'],
    }
  }
};
let lang = localStorage.getItem('gc_lang') || 'ja';
function t(k){ return I18N[lang][k] || I18N.ja[k]; }
function gm(k){ const arr = I18N[lang].GM[k]; return arr ? arr[Math.floor(Math.random()*arr.length)] : ''; }
function applyLang(){
  document.getElementById('t-title').textContent  = t('title');
  document.getElementById('t-sub').textContent    = t('sub');
  document.getElementById('t-hiscore').textContent= t('hiscore');
  document.getElementById('btn-1p').textContent   = t('btn1p');
  document.getElementById('btn-2p').textContent   = t('btn2p');
  document.getElementById('ns-label').textContent = t('nameLabel');
  document.getElementById('name-ok').textContent  = t('nameOk');
  document.getElementById('btn-punch').innerHTML  = `👊<br>${t('punch')}`;
  document.getElementById('btn-kick').innerHTML   = `🦵<br>${t('kick')}`;
  document.getElementById('hp-p-label').textContent = t('hpP');
  document.getElementById('btn-menu').textContent = t('menuBtn');
}

document.getElementById('btn-lang').addEventListener('click',()=>{
  lang = lang==='ja'?'en':'ja';
  localStorage.setItem('gc_lang',lang);
  applyLang();
  renderScoreList(lastScores);
});

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = 540, H = 360;
const GROUND = 300;

// ── State ─────────────────────────────────────────────────────────────────────
let state = null;
let lastScores = [];
let highScore  = 0;
let playerName = localStorage.getItem('fighting_player_name') || '';
let gameActive = false;
let animFrame  = 0;
let floatingScores = [];
let floatingDamages = [];
let bloodBursts = [];

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws = null;
let gameMode = '1p'; // '1p' or '2p'
function connect(mode){
  gameMode = mode || '1p';
  const proto = location.protocol==='https:'?'wss':'ws';
  const path  = gameMode === '2p' ? '/ws/fighting/2p' : '/ws/fighting';
  if(ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket(`${proto}://${location.host}${path}`);
  ws.onmessage = e => handleMsg(JSON.parse(e.data));
  ws.onclose   = () => { if(gameMode==='1p') setTimeout(()=>connect('1p'), 2000); };
}
function send(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }

function handleMsg(msg){
  if(msg.type==='title'){
    lastScores = msg.scores||[];
    highScore  = lastScores.length ? Math.max(...lastScores.map(s=>s.score)) : 0;
    renderScoreList(lastScores);
    if(!gameActive) showTitle();
  } else if(msg.type==='state'){
    if(msg.phase==='waiting'){
      showWaiting(); return;
    }
    if(msg.phase==='name_input'){
      // 2P接続直後 — 名前入力画面へ
      return;
    }
    if(msg.phase==='opponent_left'){
      setGm(lang==='ja'?'相手が切断しました…':'Opponent disconnected...');
      showOverlay('gameover', {score:0}); return;
    }
    hideWaiting();
    state = msg;
    if(msg.hit_fx){
      floatingScores.push({
        x: msg.hit_fx.x,
        y: msg.hit_fx.y - 26,
        score: msg.hit_fx.score,
        life: 0,
        maxLife: 84,
      });
    }
    if(msg.damage_fx){
      floatingDamages.push({
        x: msg.damage_fx.x,
        y: msg.damage_fx.y,
        damage: msg.damage_fx.damage,
        life: 0,
        maxLife: 24,
      });
      const count = 8 + Math.min(6, msg.damage_fx.damage * 2);
      for(let i=0;i<count;i++){
        const ang = (-1.9 + Math.random()*1.1);
        const spd = 1.2 + Math.random()*2.1;
        bloodBursts.push({
          x: msg.damage_fx.x + (Math.random()*8-4),
          y: msg.damage_fx.y + (Math.random()*6-3),
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - (Math.random()*0.8),
          r: 2 + Math.random()*3,
          life: 0,
          maxLife: 18 + Math.floor(Math.random()*10),
        });
      }
    }
    if(msg.event) handleEvent(msg.event);
    updateHUD();
    renderFrame();
    if(msg.mode==='2p'){
      if(msg.phase==='win')              { showOverlay('match_win',  msg); gameActive=false; }
      else if(msg.phase==='lose')        { showOverlay('match_lose', msg); gameActive=false; }
      else if(msg.phase==='round_win')     showRoundResult(true,  msg);
      else if(msg.phase==='round_lose')    showRoundResult(false, msg);
      else if(msg.phase==='playing')       document.getElementById('overlay').style.display='none';
    } else {
      if(msg.phase==='stage_clear') showOverlay('stageClear', msg);
      if(msg.phase==='gameover')    showOverlay('gameover',   msg);
    }
  } else if(msg.type==='submitted'){
    lastScores = msg.scores||[];
    highScore  = lastScores.length ? Math.max(...lastScores.map(s=>s.score)) : 0;
    hideSubmit();
    showTitle();
  }
}

// ── Title ─────────────────────────────────────────────────────────────────────
function showTitle(){
  gameActive = false;
  state = null; // 古いゲーム状態をクリア
  document.getElementById('title-screen').style.display='flex';
  document.getElementById('overlay').style.display='none';
  hideWaiting();
  renderScoreList(lastScores);
  // 2Pモード終了後は必ず 1P 接続に切り替える
  // （サーバー側は run_2p がソケットを閉じないため readyState は OPEN のままになる）
  if(gameMode === '2p'){
    connect('1p'); // connect() 内で古い WS を閉じてから新規接続
  } else if(!ws || ws.readyState !== WebSocket.OPEN){
    connect('1p');
  }
}
function showWaiting(){
  document.getElementById('title-screen').style.display='none';
  document.getElementById('ov-title').textContent = t('waiting');
  document.getElementById('ov-sub').textContent   = '';
  document.getElementById('ov-score').textContent = '';
  document.getElementById('ov-btn').style.display = 'none';
  document.getElementById('overlay').style.display='flex';
}
function hideWaiting(){
  document.getElementById('ov-btn').style.display = '';
  document.getElementById('overlay').style.display='none';
}
function renderScoreList(scores){
  const el = document.getElementById('score-list');
  if(!scores||!scores.length){ el.innerHTML=`<div style="color:#555;font-size:12px;text-align:center">-</div>`; return; }
  el.innerHTML = scores.slice(0,5).map((s,i)=>
    `<div class="score-row"><span class="score-rank">${i+1}</span><span class="score-name">${s.name}</span><span class="score-pts">${s.score.toLocaleString()}</span></div>`
  ).join('');
}

// ── Name input ────────────────────────────────────────────────────────────────
document.getElementById('btn-1p').addEventListener('click',()=>{
  gameMode = '1p';
  document.getElementById('title-screen').style.display='none';
  document.getElementById('name-screen').style.display='flex';
  document.getElementById('name-input').value = playerName;
  document.getElementById('name-input').focus();
});
document.getElementById('btn-2p').addEventListener('click',()=>{
  gameMode = '2p';
  document.getElementById('title-screen').style.display='none';
  document.getElementById('name-screen').style.display='flex';
  document.getElementById('name-input').value = playerName;
  document.getElementById('name-input').focus();
});
function startGame(){
  const name = document.getElementById('name-input').value.trim() || 'PLAYER';
  playerName = name;
  localStorage.setItem('fighting_player_name', playerName);
  document.getElementById('name-screen').style.display='none';
  document.getElementById('hud-name').textContent = name;
  document.getElementById('hp-p-label').textContent = name;
  gameActive = true;
  startRenderLoop();
  if(gameMode === '2p'){
    connect('2p');
    ws.onopen = () => send({type:'start', profile:{name}});
  } else {
    // 既存の接続をそのまま使う（再接続すると title が来てしまう）
    send({type:'start', profile:{name}});
  }
}
document.getElementById('name-ok').addEventListener('click', startGame);
document.getElementById('name-input').addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(); });

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(){
  if(!state) return;
  const s = state;
  const hi = Math.max(highScore, s.score);
  document.getElementById('hud-score').textContent = `${t('score')} ${s.score}`;
  if(s.mode==='2p'){
    const w = s.my_wins||0;
    document.getElementById('hud-stage').textContent = '●'.repeat(w) + '○'.repeat(2-w);
  } else {
    document.getElementById('hud-stage').textContent = `${t('stage')} ${s.stage}`;
  }
  document.getElementById('hud-high').textContent = `${t('high')} ${hi}`;

  // 2P P2: left bar = P1 (opponent), right bar = P2 (me)
  const swapBars = s.mode==='2p' && s.role==='p2';
  const leftFighter  = swapBars ? s.cpu    : s.player;
  const rightFighter = swapBars ? s.player : s.cpu;
  const leftName  = swapBars ? (s.cpu_name||'P1')  : (playerName||t('hpP'));
  const rightName = swapBars ? (playerName||t('hpP')) : `VS ${lang==='ja'?s.cpu_name:s.cpu_name_en}`;

  document.getElementById('hp-p-label').textContent = leftName;
  document.getElementById('hp-c-label').textContent = rightName;
  // 自分側を常に緑、相手側を常に赤にする
  const barL = document.getElementById('hp-p');
  const barR = document.getElementById('hp-c');
  const leftIsMe = !swapBars;
  barL.style.background = leftIsMe
    ? 'linear-gradient(90deg,#22c55e,#16a34a)'
    : 'linear-gradient(90deg,#ef4444,#dc2626)';
  barR.style.background = leftIsMe
    ? 'linear-gradient(90deg,#ef4444,#dc2626)'
    : 'linear-gradient(90deg,#22c55e,#16a34a)';
  if(leftFighter){
    barL.style.width = Math.max(0, leftFighter.hp/leftFighter.max_hp*100).toFixed(1)+'%';
  }
  if(rightFighter){
    barR.style.width = Math.max(0, rightFighter.hp/rightFighter.max_hp*100).toFixed(1)+'%';
  }
}

// ── GM ────────────────────────────────────────────────────────────────────────
function setGm(txt){ document.getElementById('gm-text').textContent = txt; }
function handleEvent(ev){
  const txt = gm(ev);
  if(txt) setGm(txt);
}

// ── Overlay ───────────────────────────────────────────────────────────────────
function showOverlay(kind, msg){
  const ov = document.getElementById('overlay');
  const btn = document.getElementById('ov-btn');

  // 2P match result
  if(kind==='match_win'||kind==='match_lose'){
    const isWin = kind==='match_win';
    document.getElementById('ov-title').textContent = isWin ? t('matchWin') : t('matchLose');
    document.getElementById('ov-sub').textContent   = '';
    document.getElementById('ov-score').textContent = '';
    btn.style.display = '';
    btn.textContent = t('titleBtn');
    btn.onclick = ()=>{ ov.style.display='none'; showTitle(); };
    ov.style.display='flex';
    return;
  }

  const isWin = kind==='stageClear';
  const isAll = msg && msg.event==='all_clear';
  const isGameOver = !isWin || isAll;
  if(isGameOver) gameActive = false;
  document.getElementById('ov-title').textContent  = isAll ? t('allClear') : (isWin ? t('stageClear') : t('gameover'));
  document.getElementById('ov-score').textContent  = `${t('score')}: ${msg ? msg.score : ''}`;
  if(isWin && !isAll){
    btn.style.display = '';
    btn.textContent = t('nextBtn');
    btn.onclick = ()=>{ ov.style.display='none'; send({type:'next'}); };
  } else {
    btn.style.display = '';
    btn.textContent = t('retryBtn');
    btn.onclick = ()=>{
      ov.style.display='none';
      const score = msg ? msg.score : 0;
      if(score > 0 && (lastScores.length < 5 || score > (lastScores[lastScores.length-1]?.score ?? 0))){
        send({type:'submit', name: playerName||'PLAYER', score});
      } else {
        send({type:'restart'});
      }
    };
  }
  document.getElementById('ov-sub').textContent = '';
  ov.style.display='flex';
}

function showRoundResult(won, msg){
  const ov = document.getElementById('overlay');
  document.getElementById('ov-title').textContent = won ? t('roundWin') : t('roundLose');
  const w = msg.my_wins||0;
  const l = msg.opp_wins||0;
  document.getElementById('ov-sub').textContent   = '●'.repeat(w)+'○'.repeat(2-w) + '  :  ' + '●'.repeat(l)+'○'.repeat(2-l);
  document.getElementById('ov-score').textContent = '';
  document.getElementById('ov-btn').style.display = 'none';
  ov.style.display='flex';
}

function hideSubmit(){ /* no-op: submit screen removed */ }

// ── Rendering ─────────────────────────────────────────────────────────────────
let rafId = null;
function startRenderLoop(){
  if(rafId) return;
  function loop(){ rafId=requestAnimationFrame(loop); animFrame++; renderFrame(); }
  rafId = requestAnimationFrame(loop);
}

function renderFrame(){
  ctx.clearRect(0,0,W,H);

  // BG
  ctx.fillStyle='#1a0a2e'; ctx.fillRect(0,0,W,H);

  // Ground
  ctx.fillStyle='#2d1a4a'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4a2d6a'; ctx.fillRect(0,GROUND,W,6);

  if(!state||!state.player){
    ctx.fillStyle='rgba(253,230,138,.2)';
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    ctx.fillText('READY?', W/2, H/2);
    ctx.textAlign='left';
    return;
  }

  drawStick(state.player, false);
  drawStick(state.cpu, true);

  // Hit flash
  if(state.event==='cpu_hit'||state.event==='player_dead'){
    ctx.fillStyle='rgba(255,0,0,.18)';
    ctx.fillRect(0,0,W,H);
  }

  for(const fx of floatingScores){
    const t = fx.life / fx.maxLife;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = '#fde68a';
    ctx.strokeStyle = 'rgba(30,20,10,.68)';
    ctx.lineWidth = 4;
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    const yy = fx.y - (t * 54);
    const txt = `+${fx.score}`;
    ctx.strokeText(txt, fx.x, yy);
    ctx.fillText(txt, fx.x, yy);
    ctx.restore();
    fx.life += 1;
  }
  floatingScores = floatingScores.filter(fx => fx.life < fx.maxLife);

  for(const fx of floatingDamages){
    const t = fx.life / fx.maxLife;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = '#f87171';
    ctx.strokeStyle = 'rgba(60,0,0,.6)';
    ctx.lineWidth = 3;
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    const yy = fx.y - 10 - (t * 26);
    const txt = `-${fx.damage}`;
    ctx.strokeText(txt, fx.x, yy);
    ctx.fillText(txt, fx.x, yy);
    ctx.restore();
    fx.life += 1;
  }
  floatingDamages = floatingDamages.filter(fx => fx.life < fx.maxLife);

  for(const p of bloodBursts){
    const t = p.life / p.maxLife;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.18;
    ctx.save();
    ctx.globalAlpha = 0.7 * (1 - t);
    ctx.fillStyle = p.life < p.maxLife * 0.4 ? '#ef4444' : '#b91c1c';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.8, p.r * (1 - t * 0.45)), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    p.life += 1;
  }
  bloodBursts = bloodBursts.filter(p => p.life < p.maxLife);
}

// ── Stick figure ──────────────────────────────────────────────────────────────
// All coords relative to feet (0,0). Y is up = negative.
const POSES = {
  //           head    neck   hip   lsh   rsh   lelb  relb  lwrist rwrist lhip  rhip  lkn   rkn   lft   rft
  idle:        [[ 0,-80],[ 0,-62],[ 0,-38],[-10,-58],[10,-58],[-18,-48],[18,-48],[-22,-40],[22,-40],[-8,-38],[8,-38],[-12,-18],[12,-18],[-14,0],[14,0]],
  walkf:       null, // animated
  walkb:       null,
  punch:       [[ 0,-80],[ 0,-62],[ 0,-38],[-10,-58],[10,-58],[-16,-46],[28,-60],[-18,-38],[48,-64],[-8,-38],[8,-38],[-12,-18],[12,-18],[-14,0],[14,0]],
  kick:        [[ 0,-80],[ 0,-62],[ 0,-38],[-10,-58],[10,-58],[-16,-48],[14,-48],[-20,-40],[16,-40],[-8,-38],[8,-38],[-12,-18],[32,-50],[-14,0],[48,-76]],
  crouch:       [[ 0,-54],[ 0,-44],[ 0,-26],[-10,-42],[10,-42],[-16,-32],[16,-32],[-20,-24],[20,-24],[-8,-26],[8,-26],[-16,-12],[16,-12],[-18,0],[18,0]],
  crouch_walkf: null, // animated
  crouch_walkb: null,
  crouch_punch: [[ 0,-54],[ 0,-44],[ 0,-26],[-10,-42],[10,-42],[-14,-30],[34,-28],[-16,-24],[50,-26],[-8,-26],[8,-26],[-16,-12],[16,-12],[-18,0],[18,0]],
  crouch_kick:  [[ 0,-54],[ 0,-44],[ 0,-26],[-10,-42],[10,-42],[-14,-32],[14,-32],[-18,-26],[16,-26],[-8,-26],[8,-26],[-16,-12],[36,-6],[-18,0],[46,2]],
  guard:        [[ 0,-80],[ 0,-62],[ 0,-38],[-10,-58],[10,-58],[-4,-44],[16,-52],[-2,-34],[18,-42],[-8,-38],[8,-38],[-12,-18],[12,-18],[-14,0],[14,0]],
  jump:        [[ 0,-90],[ 0,-72],[ 0,-48],[-10,-66],[10,-66],[-18,-52],[18,-52],[-22,-44],[22,-44],[-8,-48],[8,-48],[-18,-30],[18,-30],[-22,-14],[22,-14]],
  jump_punch:  [[ 0,-90],[ 0,-72],[ 0,-48],[-10,-66],[10,-66],[-14,-60],[36,-58],[-16,-52],[52,-56],[-8,-48],[8,-48],[-18,-30],[18,-30],[-22,-14],[22,-14]],
  jump_kick:   [[ 0,-90],[ 0,-72],[ 0,-48],[-10,-66],[10,-66],[-14,-64],[14,-64],[-18,-58],[16,-58],[-8,-48],[8,-48],[-12,-32],[40,-26],[-16,-18],[50,-14]],
  hurt:        [[ 0,-78],[ 0,-60],[ 4,-36],[-12,-56],[14,-56],[-20,-46],[20,-42],[-26,-38],[28,-36],[-6,-36],[10,-36],[-10,-16],[16,-16],[-12,0],[18,0]],
  dead:        [[ 0,-12],[ 0,-10],[ 0,-6], [-8,-10],[8,-10], [-16,-6],[16,-6], [-20,-2],[20,-2], [-8,-6],[8,-6], [-14,-2],[14,-2], [-16,0],[16,0]],
};

const STICK_LINES = [
  [1,2],[2,3],        // neck-hip, hip-lhip... body
  [0,1],              // head-neck
  [1,4],[4,6],[6,8],  // right arm: neck-rsh-relb-rwrist
  [1,3],[3,5],[5,7],  // left arm:  neck-lsh-lelb-lwrist
  [2,9],[9,11],[11,13], // left leg: hip-lhip-lkn-lft
  [2,10],[10,12],[12,14], // right leg: hip-rhip-rkn-rft
];

const BODY_PROFILES = {
  normal:   { scaleX:1.00, scaleY:1.00, armX:1.00, hipX:1.00, legY:1.00, headSize:1.00, torsoW:20, torsoH:24, lineWidth:1.00 },
  small:    { scaleX:0.72, scaleY:0.74, armX:0.84, hipX:0.82, legY:0.72, headSize:1.24, torsoW:15, torsoH:17, lineWidth:0.90 },
  tall:     { scaleX:0.94, scaleY:1.30, armX:0.98, hipX:0.90, legY:1.42, headSize:0.94, torsoW:18, torsoH:34, lineWidth:0.96 },
  fat:      { scaleX:1.42, scaleY:1.10, armX:1.18, hipX:1.55, legY:0.98, headSize:1.06, torsoW:40, torsoH:34, lineWidth:1.24 },
  muscular: { scaleX:1.34, scaleY:1.18, armX:1.42, hipX:1.20, legY:1.08, headSize:1.02, torsoW:36, torsoH:32, lineWidth:1.42 },
};

function transformPose(pts, bodyType){
  const p = BODY_PROFILES[bodyType] || BODY_PROFILES.normal;
  return pts.map(([x,y], idx)=>{
    let nx = x * p.scaleX;
    let ny = y * p.scaleY;
    if([3,4,5,6,7,8].includes(idx)) nx *= p.armX;
    if([9,10].includes(idx)) nx *= p.hipX;
    if([11,12,13,14].includes(idx)) { nx *= p.hipX; ny *= p.legY; }
    return [nx, ny];
  });
}

function getPose(st, frame){
  if(st==='walkf'||st==='walkb'){
    const t = Math.sin(frame * 0.25) * 14;
    return [
      [ 0,-80],[ 0,-62],[ 0,-38],[-10,-58],[10,-58],
      [-16,-46],[18,-46],[-20,-38],[22,-38],
      [-8,-38],[8,-38],
      [-10+t,-18],[10-t,-18],
      [-12+t*1.2,0],[12-t*1.2,0]
    ];
  }
  if(st==='crouch_walkf'||st==='crouch_walkb'){
    const t = Math.sin(frame * 0.3) * 8;
    return [
      [ 0,-54],[ 0,-44],[ 0,-26],[-10,-42],[10,-42],
      [-16,-32],[16,-32],[-20,-24],[20,-24],
      [-8,-26],[8,-26],
      [-16+t,-12],[16-t,-12],
      [-18+t*1.1,0],[18-t*1.1,0]
    ];
  }
  return POSES[st] || POSES.idle;
}

function drawStick(f, isCpu){
  if(!f) return;
  const blink = f.inv && Math.floor(animFrame/3)%2===0;
  if(blink) return;

  const bodyType = f.body_type || 'normal';
  const profile = BODY_PROFILES[bodyType] || BODY_PROFILES.normal;
  const pts = transformPose(getPose(f.state, animFrame), bodyType);
  if(!pts) return;

  // Mirror for facing left
  const fx = f.facing === 1 ? 1 : -1;
  const mapped = pts.map(([x,y])=>[ f.x + x*fx, f.y + y ]);

  const color = isCpu ? '#f87171' : '#4fc3f7';
  const hurt    = f.state==='hurt'||f.state==='dead';
  const guarding = f.state==='guard';
  const lineColor = hurt ? '#fbbf24' : guarding ? '#4ade80' : color;

  ctx.save();
  ctx.strokeStyle = lineColor;
  ctx.lineWidth   = (isCpu ? 3 : 3.5) * profile.lineWidth;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  const [neckX, neckY] = mapped[1];
  const [hipX, hipY] = mapped[2];
  const torsoY = (neckY + hipY) / 2;
  ctx.fillStyle = isCpu ? 'rgba(248,113,113,.16)' : 'rgba(79,195,247,.16)';
  ctx.beginPath();
  ctx.ellipse((neckX + hipX) / 2, torsoY, profile.torsoW / 2, profile.torsoH / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  for(const [a,b] of STICK_LINES){
    ctx.beginPath();
    ctx.moveTo(mapped[a][0], mapped[a][1]);
    ctx.lineTo(mapped[b][0], mapped[b][1]);
    ctx.stroke();
  }

  // Head circle
  const [hx,hy] = mapped[0];
  ctx.beginPath(); ctx.arc(hx, hy, 10 * profile.headSize, 0, Math.PI*2);
  ctx.strokeStyle = lineColor; ctx.stroke();

  // Player: ribbon
  if(!isCpu){
    ctx.fillStyle='#f472b6';
    ctx.beginPath(); ctx.arc(hx, hy-(8 * profile.headSize), 5, 0, Math.PI*2); ctx.fill();
  }

  // Name label
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  const label = isCpu ? (state.cpu_name||'CPU') : (playerName||'P1');
  ctx.fillText(label, f.x, f.y + 14);
  ctx.textAlign = 'left';

  ctx.restore();
}

// ── Input: Punicon style stick ────────────────────────────────────────────────
const stickWrap = document.getElementById('stick-wrap');
let stickActive = false, stickId = -1;
let stickX=0, stickY=0;
const input = { left:false, right:false, up:false, down:false, punch:false, kick:false, guard:false };

function updateStick(cx,cy){
  const rect = stickWrap.getBoundingClientRect();
  const ox = cx - rect.left - rect.width/2;
  const oy = cy - rect.top  - rect.height/2;
  const dist = Math.sqrt(ox*ox+oy*oy);
  const maxR = rect.width/2 - 12;
  const nx = dist>maxR ? ox/dist*maxR : ox;
  const ny = dist>maxR ? oy/dist*maxR : oy;
  const knob = document.getElementById('stick-knob');
  knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  const th = 22;
  input.left  = ox < -th;
  input.right = ox >  th;
  input.up    = oy < -th;
  input.down  = oy >  th;
}

stickWrap.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  stickId = t.identifier; stickActive=true;
  updateStick(t.clientX, t.clientY);
},{passive:false});
stickWrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===stickId) updateStick(t.clientX,t.clientY);
},{passive:false});
stickWrap.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===stickId){
    stickActive=false; stickId=-1;
    input.left=input.right=input.up=input.down=false;
    document.getElementById('stick-knob').style.transform='translate(-50%,-50%)';
  }
},{passive:false});

// Mouse fallback for desktop testing
stickWrap.addEventListener('mousedown',e=>{
  stickActive=true; updateStick(e.clientX,e.clientY);
  const mm=ev=>updateStick(ev.clientX,ev.clientY);
  const mu=()=>{
    stickActive=false; input.left=input.right=input.up=input.down=false;
    document.getElementById('stick-knob').style.transform='translate(-50%,-50%)';
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
  };
  document.addEventListener('mousemove',mm);
  document.addEventListener('mouseup',mu);
});

function setBtnInput(key,val){
  input[key]=val;
}
const btnPunch=document.getElementById('btn-punch');
const btnKick =document.getElementById('btn-kick');
const btnGuard=document.getElementById('btn-guard');
['touchstart','mousedown'].forEach(ev=>{
  btnPunch.addEventListener(ev,e=>{e.preventDefault();setBtnInput('punch',true);},{passive:false});
  btnKick.addEventListener(ev, e=>{e.preventDefault();setBtnInput('kick',true);},{passive:false});
  btnGuard.addEventListener(ev,e=>{e.preventDefault();setBtnInput('guard',true);},{passive:false});
});
['touchend','touchcancel','mouseup'].forEach(ev=>{
  btnPunch.addEventListener(ev,e=>{e.preventDefault();setBtnInput('punch',false);});
  btnKick.addEventListener(ev, e=>{e.preventDefault();setBtnInput('kick',false);});
  btnGuard.addEventListener(ev,e=>{e.preventDefault();setBtnInput('guard',false);});
});

// Keyboard
const keyMap={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down','z':'punch','x':'kick','Z':'punch','X':'kick','c':'guard','C':'guard'};
document.addEventListener('keydown',e=>{ if(keyMap[e.key]) input[keyMap[e.key]]=true; });
document.addEventListener('keyup',  e=>{ if(keyMap[e.key]) input[keyMap[e.key]]=false; });

// Send input loop
setInterval(()=>{
  if(!gameActive) return;
  send({type:'input', ...input});
},33);
