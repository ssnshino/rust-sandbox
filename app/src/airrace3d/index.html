<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | airraceUnity</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="airrace-debug">
      <div class="airrace-debug-title">AIRRACE 3D LOADING</div>
      <pre id="airrace-debug-log">booting...</pre>
      <div id="airrace-debug-stats">progress: 0% / speed: -- / eta: --</div>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">airraceUnity</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var debugPanel = document.querySelector("#airrace-debug");
      var debugLog = document.querySelector("#airrace-debug-log");
      var debugStats = document.querySelector("#airrace-debug-stats");
      var progressState = {
        startedAt: 0,
        lastProgress: 0,
        lastTs: 0
      };

      function airraceDebug(message) {
        var line = "[" + new Date().toLocaleTimeString() + "] " + message;
        console.log(line);
        debugLog.textContent += "\n" + line;
        debugPanel.style.display = "block";
      }

      function airraceWebglReport() {
        var probe = document.createElement("canvas");
        var gl2 = null;
        var gl1 = null;
        try { gl2 = probe.getContext("webgl2"); } catch (e) {}
        try { gl1 = probe.getContext("webgl") || probe.getContext("experimental-webgl"); } catch (e) {}
        var gl = gl2 || gl1;
        var gpu = "unknown";
        if (gl) {
          var ext = gl.getExtension("WEBGL_debug_renderer_info");
          if (ext) gpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
        }
        airraceDebug("browser: " + navigator.userAgent);
        airraceDebug("webgl2: " + (!!gl2) + " / webgl1: " + (!!gl1) + " / gpu: " + gpu);
        if (!gl2) {
          unityShowBanner("このUnity版はWebGL2必須です。Chromeで止まる場合は、Chromeのハードウェアアクセラレーション有効化、GPUドライバ更新、chrome://gpu のWebGL状態を確認してください。", "error");
        }
      }

      window.addEventListener("error", function(event) {
        airraceDebug("ERROR: " + event.message + " @ " + event.filename + ":" + event.lineno);
      });
      window.addEventListener("unhandledrejection", function(event) {
        airraceDebug("PROMISE: " + (event.reason && event.reason.message ? event.reason.message : event.reason));
      });

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "20260502_085025";
      var loaderUrl = buildUrl + "/WebGL.loader.js?v=" + buildVersion;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.gz?v=" + buildVersion,
        frameworkUrl: buildUrl + "/WebGL.framework.js.gz?v=" + buildVersion,
        codeUrl: buildUrl + "/WebGL.wasm.gz?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "shino",
        productName: "airraceUnity",
        productVersion: buildVersion,
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";
      airraceWebglReport();
      airraceDebug("loading Unity WebGL files...");
      progressState.startedAt = performance.now();
      progressState.lastTs = progressState.startedAt;

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        airraceDebug("loader ready, creating Unity instance...");
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          var now = performance.now();
          var elapsed = Math.max((now - progressState.startedAt) / 1000, 0.001);
          var pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
          var avgRate = progress / elapsed;
          var etaSec = avgRate > 0.0001 ? Math.max((1 - progress) / avgRate, 0) : null;
          var etaLabel = etaSec == null ? "--" : (etaSec > 99 ? "99s+" : (Math.round(etaSec) + "s"));
          var speedLabel = avgRate > 0.0001 ? (Math.round(avgRate * 1000) / 10) + "%/s" : "--";
          debugStats.textContent = "progress: " + pct + "% / speed: " + speedLabel + " / eta: " + etaLabel;
          progressState.lastProgress = progress;
          progressState.lastTs = now;
          if (progress >= 0.99) airraceDebug("Unity files loaded, starting runtime...");
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          airraceDebug("Unity runtime started.");
          setTimeout(function() {
            debugPanel.style.display = "none";
          }, 2500);
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          airraceDebug("UNITY FAILED: " + message);
        });
      };

      document.body.appendChild(script);
    </script>
    <style>
      #airrace-debug {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 9999;
        display: none;
        max-height: 45vh;
        overflow: auto;
        padding: 10px 12px;
        border: 1px solid rgba(255, 230, 128, .72);
        border-radius: 10px;
        background: rgba(4, 8, 14, .86);
        color: #e8f7ff;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .airrace-debug-title {
        margin-bottom: 4px;
        color: #ffe680;
        font-weight: 700;
        letter-spacing: .08em;
      }
      #airrace-debug-log {
        margin: 0;
        white-space: pre-wrap;
      }
      #airrace-debug-stats {
        margin-top: 8px;
        color: #b8eaff;
        font-size: 12px;
      }
    </style>
  </body>
</html>
