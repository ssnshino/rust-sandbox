<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06172b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Air Race">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ベクター・エアレース</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <link rel="manifest" href="/airrace.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 14%, rgba(71, 204, 255, 0.20), transparent 28%),
        linear-gradient(180deg, #06172b 0%, #0b2238 52%, #3c2918 53%, #15100d 100%);
      color: #e5f7ff;
      font-family: "DotGothic16", monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
      z-index: 20;
    }

    #app {
      width: min(100vw, 430px);
      height: 100dvh;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: max(4px, env(safe-area-inset-top)) 6px max(4px, env(safe-area-inset-bottom));
      position: relative;
      box-sizing: border-box;
    }

    #topbar {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      font-size: 12px;
      color: #b9f5ff;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.65);
    }

    .top-menu {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 8;
      display: inline-block;
      width: fit-content;
      padding: 4px 8px;
      border: 1px solid rgba(125, 249, 255, 0.24);
      border-radius: 999px;
      background: rgba(1, 12, 24, 0.46);
      color: #bae6fd;
      font-size: 13px;
      text-decoration: none;
      text-shadow: 0 0 8px #38bdf8;
    }

    .meter {
      border: 1px solid rgba(125, 249, 255, 0.35);
      border-radius: 10px;
      background: rgba(1, 12, 24, 0.58);
      padding: 6px 8px;
      box-shadow: inset 0 0 14px rgba(14, 165, 233, 0.12);
      min-height: 42px;
    }

    .meter strong {
      display: block;
      font-size: 11px;
      color: #5eead4;
      letter-spacing: 0.08em;
    }

    .meter span {
      display: block;
      font-size: 15px;
      margin-top: 2px;
      color: #f8fafc;
    }

    #canvas-wrap {
      position: relative;
      width: min(calc(100dvw - 12px), 980px);
      height: min(calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 680px);
      max-height: calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border: 1px solid rgba(125, 249, 255, 0.42);
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(103, 232, 249, 0.12), transparent 35%),
        linear-gradient(180deg, #0c2c4d 0%, #071827 50%, #7a5026 51%, #1c130d 100%);
      box-shadow:
        0 0 28px rgba(34, 211, 238, 0.20),
        inset 0 0 42px rgba(34, 211, 238, 0.08);
    }

    #guide {
      position: absolute;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      z-index: 7;
      min-width: 128px;
      padding: 4px 10px 7px;
      border: 1px solid rgba(250, 204, 21, 0.55);
      border-radius: 18px;
      background: rgba(8, 13, 28, 0.72);
      color: #facc15;
      text-align: center;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.80);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.18);
      animation: guide-blink 0.75s steps(2, end) infinite;
      pointer-events: none;
    }

    .guide-arrow {
      display: block;
      font-size: 54px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: 0;
    }

    .guide-meta {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #fef3c7;
    }

    @keyframes guide-blink {
      50% {
        opacity: 0.35;
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    #title,
    #result {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px;
      background: radial-gradient(circle, rgba(8, 47, 73, 0.92), rgba(2, 6, 23, 0.94));
      z-index: 10;
      text-align: center;
    }

    #result {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-shadow:
        0 0 8px #67e8f9,
        0 0 22px #0891b2;
    }

    .lead {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #b6efff;
    }

    .rankings {
      width: min(100%, 280px);
      border: 1px solid rgba(125, 249, 255, 0.28);
      border-radius: 14px;
      background: rgba(1, 12, 24, 0.52);
      padding: 10px 12px;
      font-size: 12px;
      color: #dff9ff;
      text-align: left;
    }

    .rankings h2 {
      margin: 0 0 6px;
      color: #facc15;
      font-size: 13px;
      letter-spacing: 0.10em;
      text-align: center;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.65);
    }

    .rankings table {
      width: 100%;
      border-collapse: collapse;
    }

    .rankings td {
      padding: 2px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .rankings td:last-child {
      text-align: right;
      color: #86efac;
    }

    #name-entry {
      display: none;
      width: min(100%, 280px);
      padding: 10px;
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 14px;
      background: rgba(67, 20, 7, 0.38);
    }

    .control-mode {
      display: none;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .control-mode button {
      font-size: 12px;
      padding: 6px 12px;
      background: rgba(8, 47, 73, 0.85);
      color: #cffafe;
    }

    .control-mode button.active {
      background: linear-gradient(180deg, #fef3c7, #facc15);
      color: #422006;
    }

    #gamepad-status {
      min-height: 16px;
      font-size: 11px;
      color: #bae6fd;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.70);
    }

    #name-input {
      width: 100%;
      margin: 8px 0;
      border: 1px solid rgba(250, 204, 21, 0.55);
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.78);
      color: #fef3c7;
      font-family: inherit;
      font-size: 16px;
      padding: 9px 12px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    button {
      border: 1px solid rgba(125, 249, 255, 0.65);
      border-radius: 999px;
      background: linear-gradient(180deg, #cffafe, #06b6d4);
      color: #082f49;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 10px 24px;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
      cursor: pointer;
      touch-action: manipulation;
    }

    #back {
      display: none;
    }

    #message {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      z-index: 7;
      min-height: 0;
      border: 1px solid rgba(125, 249, 255, 0.24);
      border-radius: 12px;
      background: rgba(1, 10, 20, 0.55);
      padding: 6px 10px;
      font-size: 13px;
      color: #fef3c7;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.50);
      pointer-events: none;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 132px;
      z-index: 6;
      pointer-events: none;
    }

    #stick {
      position: absolute;
      left: 14px;
      bottom: 58px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 1px solid rgba(125, 249, 255, 0.38);
      background: radial-gradient(circle, rgba(14, 165, 233, 0.18), rgba(15, 23, 42, 0.68));
      box-shadow: inset 0 0 20px rgba(34, 211, 238, 0.18);
      touch-action: none;
      pointer-events: auto;
    }

    #knob {
      position: absolute;
      left: 29px;
      top: 29px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ffffff, #22d3ee 44%, #075985);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.7);
      pointer-events: none;
    }

    #boost {
      position: absolute;
      right: 16px;
      bottom: 70px;
      width: 84px;
      height: 56px;
      border-radius: 20px;
      background: linear-gradient(180deg, #fed7aa, #f97316);
      border-color: rgba(251, 146, 60, 0.8);
      color: #431407;
      pointer-events: auto;
    }

    #help {
      position: absolute;
      left: 116px;
      right: 110px;
      bottom: 74px;
      font-size: 11px;
      line-height: 1.6;
      color: #93c5fd;
      text-align: center;
    }

    @media (max-height: 700px) {
      #app {
        justify-content: center;
        gap: 0;
      }

      #topbar {
        font-size: 10px;
      }

      .meter {
        min-height: 36px;
        padding: 5px 6px;
      }

      .meter span {
        font-size: 13px;
      }

      #canvas-wrap {
        width: min(calc(100dvw - 12px), 980px);
        height: min(calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 560px);
        max-height: calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }

      #stick {
        width: 82px;
        height: 82px;
        bottom: 52px;
      }

      #knob {
        left: 26px;
        top: 26px;
        width: 30px;
        height: 30px;
      }

      #boost {
        width: 78px;
        height: 52px;
        bottom: 64px;
      }

      #message {
        font-size: 12px;
        padding: 5px 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <a id="back" href="/">← menu</a>
    <div id="topbar">
      <div class="meter"><strong>SPEED</strong><span id="speed">320 km/h</span></div>
      <div class="meter"><strong>ALT</strong><span id="alt">120 m</span></div>
      <div class="meter"><strong>TIME</strong><span id="time">00.00</span></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="c" width="375" height="500"></canvas>
      <a class="top-menu" href="/">← MENU</a>
      <div id="guide">NEXT GATE →</div>
      <div id="message">左プニコンで旋回と高度。BOOSTで加速。</div>
      <div id="controls">
        <div id="stick"><div id="knob"></div></div>
        <div id="help">← → 旋回<br>↑ ↓ 高度<br>PCは矢印/WASD + Space</div>
        <button id="boost">BOOST</button>
      </div>
      <section id="title">
        <h1>VECTOR<br>AIR RACE</h1>
        <p class="lead">全5ROUNDのタイムアタック<br>ゲートを順番にくぐれ。パイロンに当たるな。</p>
        <div id="control-mode" class="control-mode">
          <button id="mode-stick" class="active">プニコン</button>
          <button id="mode-tilt">傾き操作</button>
          <button id="mode-gamepad">コントローラ</button>
        </div>
        <div id="gamepad-status">PS4/PS5 コントローラは接続後にボタンを1回押してね。</div>
        <div class="rankings">
          <h2>TOP 5 TIME</h2>
          <div id="title-rankings"></div>
        </div>
        <button id="start">START</button>
      </section>
      <section id="result">
        <h1>FINISH</h1>
        <p class="lead" id="result-text"></p>
        <div id="name-entry">
          <div>RECORD UPDATE!</div>
          <input id="name-input" maxlength="12" placeholder="名前">
          <button id="save-score">SAVE</button>
        </div>
        <button id="next-round">NEXT ROUND</button>
        <button id="retry">TITLE</button>
      </section>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W = canvas.width;
    let H = canvas.height;
    let horizon = 230;
    let centerX = W / 2;
    let centerY = 255;
    let worldWidth = 420;
    const minAlt = 0;
    const maxAlt = 720;
    const cruiseSpeed = 340;
    const maxBoostSpeed = 1500;
    const rollVisual = 0.88;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const cssW = Math.max(320, Math.round(rect.width));
      const cssH = Math.max(320, Math.round(rect.height));
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = cssW;
      H = cssH;
      centerX = W / 2;
      centerY = H * 0.51;
      horizon = H * 0.46;
      worldWidth = Math.max(420, W * 1.12);
    }

    const ui = {
      speed: document.getElementById("speed"),
      alt: document.getElementById("alt"),
      time: document.getElementById("time"),
      message: document.getElementById("message"),
      title: document.getElementById("title"),
      result: document.getElementById("result"),
      resultText: document.getElementById("result-text"),
      rankings: document.getElementById("title-rankings"),
      nameEntry: document.getElementById("name-entry"),
      nameInput: document.getElementById("name-input"),
      nextRound: document.getElementById("next-round"),
      retry: document.getElementById("retry"),
      start: document.getElementById("start"),
      saveScore: document.getElementById("save-score"),
      controlMode: document.getElementById("control-mode"),
      modeStick: document.getElementById("mode-stick"),
      modeTilt: document.getElementById("mode-tilt"),
      modeGamepad: document.getElementById("mode-gamepad"),
      gamepadStatus: document.getElementById("gamepad-status"),
      knob: document.getElementById("knob"),
      stick: document.getElementById("stick"),
      guide: document.getElementById("guide"),
    };

    const input = {
      x: 0,
      y: 0,
      boost: false,
      throttle: 0,
    };

    let game = null;
    let raf = null;
    let audio = null;
    let controlMode = "stick";
    let tiltBase = null;
    let tilt = { beta: 0, gamma: 0 };
    let tiltFiltered = { beta: 0, gamma: 0 };
    let activeGamepadIndex = null;
    let gamepadName = "";
    let gamepadPrevButtons = [];
    const keyboardTarget = { x: 0, y: 0 };
    window.airraceGhosts = [];

    const buttonLabels = {
      start: "START",
      saveScore: "SAVE",
      nextRound: "NEXT ROUND",
      retry: "TITLE",
    };

    function roundDifficulty(round) {
      return {
        spacingScale: Math.max(1.15, 3.0 - (round - 1) * 0.45),
        turnScale: 0.38 + (round - 1) * 0.16,
        lateralScale: 0.45 + (round - 1) * 0.18,
        verticalScale: 0.35 + (round - 1) * 0.22,
      };
    }

    function roundBriefing(round) {
      const briefings = [
        {
          title: "ROUND 1 / 離陸訓練",
          difficulty: 1,
          text: "ゆるい周回コース。まずは旋回とゲート通過に慣れよう。",
        },
        {
          title: "ROUND 2 / 高度変化",
          difficulty: 2,
          text: "上下移動の練習。高度計を見ながらゲートをくぐれ。",
        },
        {
          title: "ROUND 3 / 本格周回",
          difficulty: 3,
          text: "上下左右に動く標準コース。ライン取りがタイムを決める。",
        },
        {
          title: "ROUND 4 / 高速直線",
          difficulty: 4,
          text: "長い直線あり。BOOSTで伸ばして、次の旋回に備えろ。",
        },
        {
          title: "ROUND 5 / FINAL RACE",
          difficulty: 5,
          text: "最高速で上下左右に振られる最終面。攻め切れ！",
        },
      ];
      return briefings[Math.max(0, Math.min(briefings.length - 1, round - 1))];
    }

    function makeCourse(round) {
      const diff = roundDifficulty(round);
      const gates = [];
      const courseMarkers = [];
      const coursePath = [
        { x: 82, y: -95, z: -220, heading: 0 },
        { x: 82, y: -70, z: 260, heading: 0 },
        { x: 42, y: 35, z: 920, heading: 0 },
      ];
      const fixedLayouts = {
        1: [
          { x: 0, z: 1700, y: 58, h: 0.00 },
          { x: -650, z: 3400, y: 62 },
          { x: -1450, z: 4800, y: 58 },
          { x: -2500, z: 5200, y: 64 },
          { x: -3300, z: 3900, y: 60 },
          { x: -3600, z: 2100, y: 64 },
          { x: -3200, z: 300, y: 58 },
          { x: -2500, z: -1300, y: 62 },
          { x: -1400, z: -2100, y: 58 },
          { x: -450, z: -1700, y: 60 },
          { x: 0, z: -900, y: 58, h: 0.00 },
        ],
        2: [
          { x: 0, z: 1850, y: 54, h: 0.00 },
          { x: -520, z: 3650, y: 96 },
          { x: -1350, z: 5350, y: 28 },
          { x: -2450, z: 6550, y: 112 },
          { x: -3650, z: 6500, y: 48 },
          { x: -4550, z: 5200, y: 98 },
          { x: -4850, z: 3300, y: 42 },
          { x: -4450, z: 1250, y: 106 },
          { x: -3450, z: -600, y: 54 },
          { x: -2200, z: -2100, y: 92 },
          { x: -900, z: -2400, y: 46 },
          { x: -180, z: -1500, y: 72 },
          { x: 0, z: -900, y: 58, h: 0.00 },
        ],
        3: [
          { x: 0, z: 1950, y: 44, h: 0.00 },
          { x: -480, z: 3950, y: 170 },
          { x: -1300, z: 5900, y: -10 },
          { x: -2550, z: 7550, y: 230 },
          { x: -4050, z: 7950, y: 24 },
          { x: -5450, z: 6900, y: 285 },
          { x: -6100, z: 5000, y: -20 },
          { x: -5900, z: 2750, y: 245 },
          { x: -4950, z: 600, y: 32 },
          { x: -3450, z: -1300, y: 210 },
          { x: -1850, z: -2750, y: 0 },
          { x: -650, z: -2300, y: 150 },
          { x: 0, z: -950, y: 60, h: 0.00 },
        ],
        4: [
          { x: 0, z: 2100, y: 20, h: 0.00 },
          { x: -850, z: 4300, y: 240 },
          { x: -2400, z: 6400, y: -35 },
          { x: -4700, z: 7900, y: 360 },
          { x: -7300, z: 7600, y: 40 },
          { x: -9200, z: 5600, y: 420 },
          { x: -9000, z: 2900, y: -45 },
          { x: -6900, z: 900, y: 320 },
          { x: -3900, z: 350, y: 10 },
          { x: -1200, z: 1400, y: 380 },
          { x: 1400, z: 3600, y: -20 },
          { x: 3100, z: 2500, y: 300 },
          { x: 2600, z: 100, y: 40 },
          { x: 1200, z: -1800, y: 260 },
          { x: 0, z: -1050, y: 60, h: 0.00 },
        ],
        5: [
          { x: 0, z: 2200, y: -20, h: 0.00 },
          { x: -900, z: 4400, y: 300 },
          { x: -2600, z: 6600, y: -60 },
          { x: -5300, z: 8400, y: 460 },
          { x: -8600, z: 8200, y: -35 },
          { x: -11100, z: 6100, y: 500 },
          { x: -11200, z: 3100, y: -70 },
          { x: -9200, z: 900, y: 420 },
          { x: -6200, z: 200, y: -25 },
          { x: -3300, z: 1600, y: 360 },
          { x: -1200, z: 4300, y: -55 },
          { x: -2600, z: 6200, y: 480 },
          { x: -5400, z: 5600, y: 20 },
          { x: -6400, z: 3300, y: 440 },
          { x: -4300, z: 800, y: -65 },
          { x: -1000, z: -900, y: 390 },
          { x: 2600, z: 200, y: -40 },
          { x: 3800, z: 3000, y: 430 },
          { x: 1600, z: 1600, y: 30 },
          { x: 500, z: -2100, y: 320 },
          { x: 0, z: -1100, y: 60, h: 0.00 },
        ],
      };
      const fixedLayout = fixedLayouts[round] || null;
      let x = 0;
      let z = 1280;
      let heading = 0;
      const gateCount = fixedLayout ? fixedLayout.length : 12;
      for (let i = 0; i < gateCount; i += 1) {
        const prev = gates[gates.length - 1] || { x: 0, y: 35, z: 0 };
        let y = 35;
        if (fixedLayout) {
          const node = fixedLayout[i];
          const prevNode = fixedLayout[Math.max(0, i - 1)];
          const nextNode = fixedLayout[Math.min(fixedLayout.length - 1, i + 1)];
          x = node.x;
          z = node.z;
          y = node.y;
          heading = node.h ?? Math.atan2(nextNode.x - prevNode.x, nextNode.z - prevNode.z);
        } else {
          heading += (Math.sin(i * 1.27) * 0.46 + (i % 4 === 1 ? 0.34 : i % 4 === 3 ? -0.40 : 0)) * diff.turnScale;
          const spacing = (780 + (i % 3) * 120) * diff.spacingScale;
          x += Math.sin(heading) * spacing * diff.lateralScale;
          z += Math.cos(heading) * spacing;
          y = 35 + Math.sin(i * 0.62) * 120 * diff.verticalScale + (round >= 4 ? Math.sin(i * 1.8) * 70 : 0);
        }
        gates.push({ x, y, z, heading, passed: false });
        coursePath.push({ x, y, z, heading });
        for (let m = 1; m <= 5; m += 1) {
          const t = m / 6;
          courseMarkers.push({
            x: prev.x + (x - prev.x) * t,
            y: prev.y + (y - prev.y) * t,
            z: prev.z + (z - prev.z) * t,
          });
        }
      }

      const pylons = [];
      const scenery = [];
      for (let i = 0; i < gates.length; i += 1) {
        const gate = gates[i];
        const nx = Math.cos(gate.heading);
        const nz = -Math.sin(gate.heading);
        pylons.push({
          x: gate.x + nx * 78,
          y: -40,
          z: gate.z + nz * 78,
          h: 130,
          gateEdge: true,
          hit: false,
        });
        pylons.push({
          x: gate.x - nx * 78,
          y: -40,
          z: gate.z - nz * 78,
          h: 130,
          gateEdge: true,
          hit: false,
        });
        const hazardPylonCount = round === 1 ? 0 : round === 2 ? 2 : 5;
        const sceneryCount = round === 1 ? 8 : round === 2 ? 10 : 14;
        for (let j = 0; j < hazardPylonCount; j += 1) {
          const offset = 260 + j * 170;
          const side2 = j % 2 === 0 ? 1 : -1;
          pylons.push({
            x: gate.x + nx * side2 * (260 + j * 70),
            y: -40,
            z: gate.z + nz * side2 * (260 + j * 70) + offset,
            h: 110 + (j % 3) * 24,
            hit: false,
          });
        }
        for (let j = 0; j < sceneryCount; j += 1) {
          const side3 = j % 2 === 0 ? 1 : -1;
          scenery.push({
            type: j % 5 === 0 ? "tree" : "grass",
            x: gate.x + nx * side3 * (330 + (j % 7) * 95),
            z: gate.z + nz * side3 * (330 + (j % 7) * 95) + (j - 7) * 58,
            h: j % 5 === 0 ? 34 + ((i * 17 + j * 29) % 56) : 10 + (j % 3) * 5,
          });
        }
      }
      return { gates, pylons, scenery, courseMarkers, coursePath };
    }

    function makeRival(round, coursePath) {
      const saved = pickSavedGhost(round);
      if (saved) {
        const first = saved.samples[0] || { x: 82, y: -95, z: -220, h: 0, r: 0, s: 0 };
        return {
          active: true,
          kind: "ghost",
          name: saved.name || "GHOST",
          totalTime: saved.time_ms / 1000,
          samples: saved.samples,
          x: first.x,
          y: first.y,
          z: first.z,
          heading: first.h,
          roll: first.r || 0,
          finished: false,
        };
      }
      const finishZ = coursePath[coursePath.length - 1]?.z || 12000;
      const baseTime = Math.max(32, finishZ / (395 + round * 42));
      return {
        active: true,
        kind: "cpu",
        name: "CPU",
        totalTime: baseTime * (1.04 - Math.min(0.12, round * 0.018)),
        x: 82,
        y: -95,
        z: -220,
        heading: 0,
        finished: false,
      };
    }

    async function loadGhosts() {
      try {
        const res = await fetch("/api/airrace/ghosts");
        if (!res.ok) return [];
        const data = await res.json();
        window.airraceGhosts = Array.isArray(data.ghosts) ? data.ghosts : [];
        return window.airraceGhosts;
      } catch {
        return [];
      }
    }

    function saveGhost(record) {
      if (!record.samples || record.samples.length < 20) return;
      fetch("/api/airrace/ghosts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record),
      })
        .then((res) => (res.ok ? loadGhosts() : null))
        .catch(() => {});
    }

    function pickSavedGhost(round) {
      const ghosts = (window.airraceGhosts || []).filter((g) => g.round === round && Array.isArray(g.samples) && g.samples.length >= 2);
      if (ghosts.length === 0) return null;
      return ghosts[Math.floor(Math.random() * ghosts.length)];
    }

    function sampleFromGhost(samples, elapsedMs) {
      if (!samples || samples.length === 0) return null;
      if (elapsedMs <= samples[0].t) return samples[0];
      for (let i = 1; i < samples.length; i += 1) {
        const a = samples[i - 1];
        const b = samples[i];
        if (elapsedMs <= b.t) {
          const f = (elapsedMs - a.t) / Math.max(1, b.t - a.t);
          return {
            x: a.x + (b.x - a.x) * f,
            y: a.y + (b.y - a.y) * f,
            z: a.z + (b.z - a.z) * f,
            h: a.h + (b.h - a.h) * f,
            r: a.r + (b.r - a.r) * f,
            s: a.s + (b.s - a.s) * f,
          };
        }
      }
      return samples[samples.length - 1];
    }

    function resetGame(round = 1, carry = null) {
      const course = makeCourse(round);
      startAudio();
      const now = performance.now();
      game = {
        running: true,
        finished: false,
        round,
        totalStartMs: carry?.totalStartMs || now,
        roundStartMs: now,
        lastMs: now,
        distance: 0,
        phase: "countdown",
        countdownStartMs: now,
        speed: 0,
        altitude: 24,
        planeX: 0,
        planeZ: -520,
        heading: 0,
        roll: 0,
        loopAngle: 0,
        looping: false,
        damage: 0,
        gateIndex: 0,
        messageUntil: 0,
        ghostSamples: [],
        lastGhostSampleMs: -999,
        ...course,
      };
      game.rival = makeRival(round, game.coursePath);
      ui.title.style.display = "none";
      ui.result.style.display = "none";
      ui.nameEntry.style.display = "none";
      ui.nextRound.style.display = "none";
      ui.retry.style.display = "none";
      ui.guide.style.display = "none";
      setMessage("滑走路待機。シグナルを待て。", 1800);
    }

    function setMessage(text, ms = 1200) {
      ui.message.textContent = text;
      if (game) game.messageUntil = performance.now() + ms;
    }

    function encodeScore(round, ms) {
      return round * 10_000_000 + Math.max(0, 9_999_999 - Math.round(ms));
    }

    function decodeScore(score) {
      const round = Math.floor(score / 10_000_000);
      const ms = 9_999_999 - (score % 10_000_000);
      return { round, ms };
    }

    async function fetchScores() {
      const res = await fetch("/api/airrace/scores");
      if (!res.ok) return { scores: [], min_score: 0 };
      return res.json();
    }

    function scoreQualifies(score) {
      const scores = window.airraceScores || [];
      return scores.length < 5 || score > Number(scores[scores.length - 1]?.score || 0);
    }

    async function renderRankings() {
      const data = await fetchScores();
      window.airraceScores = data.scores || [];
      const scores = window.airraceScores;
      if (!scores.length) {
        ui.rankings.innerHTML = "<p class=\"lead\">NO RECORD</p>";
        return;
      }
      ui.rankings.innerHTML = `<table>${scores.map((row, i) => `
        <tr><td>${i + 1}.</td><td>${row.name}</td><td>${formatRank(row.score)}</td></tr>
      `).join("")}</table>`;
    }

    function formatRank(score) {
      const decoded = decodeScore(Number(score || 0));
      return `round${decoded.round} ${formatTime(decoded.ms)}`;
    }

    function formatTime(ms) {
      return (ms / 1000).toFixed(2);
    }

    function showTitle() {
      stopAudio();
      cancelAnimationFrame(raf);
      game = null;
      ui.title.style.display = "flex";
      ui.result.style.display = "none";
      ui.guide.style.display = "none";
      ui.nameEntry.style.display = "none";
      ui.nextRound.style.display = "none";
      ui.retry.style.display = "none";
      renderRankings();
      updateButtonHints();
      drawSplash();
      ui.message.textContent = "左プニコンで旋回と高度。BOOSTで加速。";
    }

    function startAudio() {
      if (audio?.ac?.state === "suspended") {
        audio.ac.resume();
        return;
      }
      if (audio) return;
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const prop = ac.createOscillator();
      const wobble = ac.createOscillator();
      const propGain = ac.createGain();
      const wobbleGain = ac.createGain();
      prop.type = "sawtooth";
      wobble.type = "square";
      prop.frequency.value = 84;
      wobble.frequency.value = 31;
      propGain.gain.value = 0.025;
      wobbleGain.gain.value = 0.0;
      prop.connect(propGain).connect(ac.destination);
      wobble.connect(wobbleGain).connect(ac.destination);
      prop.start();
      wobble.start();
      audio = { ac, prop, wobble, propGain, wobbleGain };
    }

    function stopAudio() {
      if (!audio) return;
      const t = audio.ac.currentTime;
      audio.propGain.gain.cancelScheduledValues(t);
      audio.wobbleGain.gain.cancelScheduledValues(t);
      audio.propGain.gain.setTargetAtTime(0.0, t, 0.04);
      audio.wobbleGain.gain.setTargetAtTime(0.0, t, 0.04);
    }

    function updateAudio() {
      if (!audio) return;
      const t = audio.ac.currentTime;
      audio.prop.frequency.setTargetAtTime(70 + game.speed * 0.10, t, 0.05);
      audio.propGain.gain.setTargetAtTime(0.024 + input.throttle * 0.025, t, 0.05);
      audio.wobble.frequency.setTargetAtTime(26 + input.throttle * 24, t, 0.04);
      audio.wobbleGain.gain.setTargetAtTime(input.throttle * 0.026, t, 0.04);
    }

    function hitSound(kind) {
      if (!audio) return;
      const ac = audio.ac;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain).connect(ac.destination);
      if (kind === "crash") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(90, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(28, ac.currentTime + 0.45);
        gain.gain.setValueAtTime(0.16, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.55);
        osc.start();
        osc.stop(ac.currentTime + 0.58);
        return;
      }
      osc.type = kind === "gate" ? "triangle" : "square";
      osc.frequency.setValueAtTime(kind === "gate" ? 760 : 130, ac.currentTime);
      gain.gain.setValueAtTime(kind === "gate" ? 0.055 : 0.10, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      osc.start();
      osc.stop(ac.currentTime + 0.2);
    }

    function projectPoint(x, y, z) {
      const dx = x - game.planeX;
      const dz = z - game.planeZ;
      const cos = Math.cos(game.heading);
      const sin = Math.sin(game.heading);
      const camX = dx * cos - dz * sin;
      const relZ = dx * sin + dz * cos;
      if (relZ <= 40) return null;
      const scale = 270 / relZ;
      const rawX = centerX + camX * scale;
      const rawY = horizon - (y - (game.altitude - 150)) * scale;
      const rotated = rollPoint(rawX, rawY);
      return {
        x: rotated.x,
        y: rotated.y,
        s: scale,
        z: relZ,
      };
    }

    function interpolatePath(path, t) {
      if (!path || path.length === 0) return null;
      const scaled = Math.max(0, Math.min(path.length - 1.001, t * (path.length - 1)));
      const i = Math.floor(scaled);
      const f = scaled - i;
      const a = path[i];
      const b = path[Math.min(path.length - 1, i + 1)];
      return {
        x: a.x + (b.x - a.x) * f,
        y: a.y + (b.y - a.y) * f,
        z: a.z + (b.z - a.z) * f,
        heading: a.heading + (b.heading - a.heading) * f,
      };
    }

    function rollPoint(x, y) {
      const angle = -game.roll * rollVisual;
      const dx = x - centerX;
      const dy = y - centerY;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: centerX + dx * cos - dy * sin,
        y: centerY + dx * sin + dy * cos,
      };
    }

    function drawLine(a, b, color, width = 1) {
      if (!a || !b) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function fillPoly(a, b, c, d, color) {
      if (!a || !b || !c || !d) return;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.closePath();
      ctx.fill();
    }

    function drawRolledBackground(leftHorizon, rightHorizon) {
      ctx.fillStyle = "#071827";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W, 0);
      ctx.lineTo(rightHorizon.x, rightHorizon.y);
      ctx.lineTo(leftHorizon.x, leftHorizon.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#2a1b0d";
      ctx.beginPath();
      ctx.moveTo(leftHorizon.x, leftHorizon.y);
      ctx.lineTo(rightHorizon.x, rightHorizon.y);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();
    }

    function drawGrid() {
      const leftHorizon = rollPoint(0, horizon);
      const rightHorizon = rollPoint(W, horizon);
      drawRolledBackground(leftHorizon, rightHorizon);

      ctx.strokeStyle = "rgba(125,249,255,.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(leftHorizon.x, leftHorizon.y);
      ctx.lineTo(rightHorizon.x, rightHorizon.y);
      ctx.stroke();

      drawWorldGroundGrid();
    }

    function drawWorldGroundGrid() {
      const step = 220;
      const near = 80;
      const activeGates = (game?.gates || []).slice(game?.gateIndex || 0);
      const xs = [game.planeX, ...(activeGates.map((gate) => gate.x))];
      const zs = [game.planeZ + near, ...(activeGates.map((gate) => gate.z))];
      const minGateX = Math.min(...xs);
      const maxGateX = Math.max(...xs);
      const minGateZ = Math.min(...zs);
      const maxGateZ = Math.max(...zs);
      const range = Math.max(1760, Math.max(Math.abs(minGateX - game.planeX), Math.abs(maxGateX - game.planeX)) + 660);
      const far = Math.max(3600, maxGateZ - game.planeZ + 900);
      const minX = Math.floor((game.planeX - range) / step) * step;
      const maxX = Math.ceil((game.planeX + range) / step) * step;
      const minZ = Math.floor(Math.min(game.planeZ + near, minGateZ - 440) / step) * step;
      const maxZ = Math.ceil((game.planeZ + far) / step) * step;

      for (let x = minX; x <= maxX; x += step) {
        drawLine(
          projectPoint(x, -110, game.planeZ + near),
          projectPoint(x, -110, game.planeZ + far),
          "rgba(251,191,36,.18)"
        );
      }

      for (let z = minZ; z <= maxZ; z += step) {
        drawLine(
          projectPoint(game.planeX - range, -110, z),
          projectPoint(game.planeX + range, -110, z),
          "rgba(251,191,36,.16)"
        );
      }
    }

    function groundPoint(side, forward) {
      const sin = Math.sin(game.heading);
      const cos = Math.cos(game.heading);
      const x = game.planeX + sin * forward + cos * side;
      const z = game.planeZ + cos * forward - sin * side;
      return projectPoint(x, -110, z);
    }

    function drawGate(gate, index) {
      const p = projectPoint(gate.x, gate.y, gate.z);
      if (!p || p.z > 3200) return;

      const r = 58 * p.s;
      const color = gate.passed
        ? "#facc15"
        : index === game.gateIndex
          ? "#67e8f9"
          : "rgba(148,163,184,.35)";
      const glow = gate.passed
        ? "rgba(250,204,21,.34)"
        : index === game.gateIndex
          ? "rgba(34,211,238,.45)"
          : "rgba(148,163,184,.14)";

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, 3 * p.s);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = Math.max(1, 1.2 * p.s);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.68, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = `${Math.max(10, 22 * p.s)}px DotGothic16`;
      ctx.textAlign = "center";
      ctx.fillText(`${index + 1}`, p.x, p.y - r - 6);
    }

    function drawPylon(pylon) {
      const base = projectPoint(pylon.x, -80, pylon.z);
      const top = projectPoint(pylon.x, -80 + (pylon.h || 120), pylon.z);
      if (!base || !top || base.z > 2800) return;
      const w = Math.max(3, (pylon.gateEdge ? 16 : 18) * base.s);

      ctx.strokeStyle = pylon.hit ? "rgba(239,68,68,.35)" : "#fb923c";
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(base.x, base.y);
      ctx.lineTo(top.x, top.y);
      ctx.stroke();

      ctx.strokeStyle = "#fed7aa";
      ctx.lineWidth = Math.max(1, w * 0.28);
      ctx.beginPath();
      ctx.moveTo(base.x, base.y);
      ctx.lineTo(top.x, top.y);
      ctx.stroke();
    }

    function drawScenery(item) {
      const base = projectPoint(item.x, -110, item.z);
      if (!base || base.z > 2800) return;
      const h = (item.h || (item.type === "tree" ? 46 : 16)) * base.s;
      const w = (item.type === "tree" ? 18 : 10) * base.s;
      const angle = -game.roll * rollVisual;
      const topX = base.x + Math.sin(angle) * h * 0.45;
      const topY = base.y - Math.cos(angle) * h;
      ctx.strokeStyle = item.type === "tree" ? "#22c55e" : "#84cc16";
      ctx.lineWidth = Math.max(1, w);
      ctx.beginPath();
      ctx.moveTo(base.x, base.y);
      ctx.lineTo(topX, topY);
      ctx.stroke();
      if (item.type === "tree") {
        ctx.fillStyle = "rgba(34,197,94,.35)";
        ctx.beginPath();
        ctx.arc(topX, topY, Math.max(2, 15 * base.s), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCourseMarker(marker) {
      const p = projectPoint(marker.x, marker.y, marker.z);
      if (!p || p.z > 3200) return;
      const r = Math.max(3, 24 * p.s);
      ctx.strokeStyle = "rgba(186,230,253,.34)";
      ctx.lineWidth = Math.max(1, 1.8 * p.s);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    function landingWorldPoint(side, forward) {
      const base = game.landing || { x: 0, z: game.planeZ, heading: game.heading };
      const sin = Math.sin(base.heading);
      const cos = Math.cos(base.heading);
      return {
        x: base.x + sin * forward + cos * side,
        z: base.z + cos * forward - sin * side,
      };
    }

    function drawRunway() {
      if (!game || !["countdown", "landing"].includes(game.phase)) return;
      const segments = game.phase === "landing"
        ? [[120, 2100], [2100, 2500]]
        : [[-420, 1120]];
      for (const [a, b] of segments) {
        const l1 = landingWorldPoint(-95, a);
        const r1 = landingWorldPoint(95, a);
        const l2 = landingWorldPoint(-95, b);
        const r2 = landingWorldPoint(95, b);
        fillPoly(
          projectPoint(l1.x, -108, l1.z),
          projectPoint(r1.x, -108, r1.z),
          projectPoint(r2.x, -108, r2.z),
          projectPoint(l2.x, -108, l2.z),
          "rgba(15,23,42,.52)"
        );
        const c1 = landingWorldPoint(0, a);
        const c2 = landingWorldPoint(0, b);
        drawLine(projectPoint(c1.x, -106, c1.z), projectPoint(c2.x, -106, c2.z), "rgba(250,204,21,.45)", 2);
      }
      for (let f = game.phase === "landing" ? 160 : -360; f <= (game.phase === "landing" ? 2380 : 1040); f += 120) {
        for (const side of [-118, 118]) {
          const light = landingWorldPoint(side, f);
          const p = projectPoint(light.x, -102, light.z);
          if (!p) continue;
          const r = Math.max(2, 10 * p.s);
          ctx.fillStyle = side < 0 ? "rgba(56,189,248,.72)" : "rgba(250,204,21,.72)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (game.phase === "landing") {
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "20px DotGothic16";
        ctx.fillStyle = "#fef3c7";
        ctx.textBaseline = "middle";
        ctx.fillText("着陸せよ", centerX, Math.max(72, H * 0.17));
        ctx.restore();
      }
    }

    function drawStartSignal() {
      if (!game || game.phase !== "countdown") return;
      const elapsed = (performance.now() - game.countdownStartMs) / 1000;
      const lit = Math.min(4, Math.floor(elapsed) + 1);
      const labels = ["●", "●", "●", "●"];
      const briefing = roundBriefing(game.round);
      const stars = "★".repeat(briefing.difficulty) + "☆".repeat(5 - briefing.difficulty);
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const panelW = Math.min(W - 34, 360);
      const panelH = 116;
      const panelX = centerX - panelW / 2;
      const panelY = Math.max(52, H * 0.16);
      ctx.fillStyle = "rgba(2, 6, 23, .70)";
      ctx.strokeStyle = "rgba(125, 249, 255, .34)";
      ctx.lineWidth = 1;
      roundRect(panelX, panelY, panelW, panelH, 14);
      ctx.fill();
      ctx.stroke();
      ctx.font = "16px DotGothic16";
      ctx.fillStyle = "#e0f2fe";
      ctx.fillText(briefing.title, centerX, panelY + 24);
      ctx.font = "20px DotGothic16";
      ctx.fillStyle = "#facc15";
      ctx.fillText(stars, centerX, panelY + 50);
      ctx.font = "12px DotGothic16";
      ctx.fillStyle = "#bae6fd";
      wrapCenterText(briefing.text, centerX, panelY + 78, panelW - 28, 17);
      ctx.font = "42px DotGothic16";
      for (let i = 0; i < 4; i += 1) {
        ctx.fillStyle = i < lit ? (i < 3 ? "#ef4444" : "#22c55e") : "rgba(148,163,184,.35)";
        ctx.fillText(labels[i], centerX - 72 + i * 48, panelY + panelH + 42);
      }
      ctx.font = "18px DotGothic16";
      ctx.fillStyle = lit >= 4 ? "#bbf7d0" : "#fecaca";
      ctx.fillText(lit >= 4 ? "GO!" : "READY...", centerX, panelY + panelH + 84);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    function wrapCenterText(text, x, y, maxWidth, lineHeight) {
      let line = "";
      let lineY = y;
      for (const char of text) {
        const test = line + char;
        if (line && ctx.measureText(test).width > maxWidth) {
          ctx.fillText(line, x, lineY);
          line = char;
          lineY += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, lineY);
    }

    function drawPlaneHud() {
      ctx.save();
      ctx.translate(centerX, H * 0.66);
      ctx.rotate(game.roll * 0.62 + game.loopAngle);
      ctx.strokeStyle = "#f8fafc";
      ctx.fillStyle = "rgba(14,165,233,.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(44, 12);
      ctx.lineTo(8, 8);
      ctx.lineTo(0, 22);
      ctx.lineTo(-8, 8);
      ctx.lineTo(-44, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = "rgba(255,255,255,.65)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(centerX - 42, centerY);
      ctx.lineTo(centerX - 12, centerY);
      ctx.moveTo(centerX + 12, centerY);
      ctx.lineTo(centerX + 42, centerY);
      ctx.stroke();
    }

    function drawRival() {
      if (!game.rival) return;
      if (game.rival.finished) return;
      const heightOffset = game.phase === "countdown" ? 28 : 32;
      const p = projectPoint(game.rival.x, game.rival.y + heightOffset, game.rival.z);
      if (!p || p.z > 3000) return;
      const size = Math.max(4, 24 * p.s);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(game.rival.heading - game.heading - game.roll * 0.2);
      ctx.fillStyle = "rgba(239,68,68,.75)";
      ctx.strokeStyle = "#fecaca";
      ctx.lineWidth = Math.max(1, 2 * p.s);
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 1.4, size * 0.7);
      ctx.lineTo(0, size * 0.25);
      ctx.lineTo(-size * 1.4, size * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawDamage() {
      if (game.damage <= 0) return;
      ctx.fillStyle = "rgba(239,68,68,.10)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fecaca";
      ctx.font = "12px DotGothic16";
      ctx.textAlign = "right";
      ctx.fillText(`DAMAGE ${game.damage}%`, W - 12, 54);
    }

    function drawSpeedGauge() {
      const x = 54;
      const y = 68;
      const r = 30;
      const pct = Math.max(0, Math.min(1, game.speed / maxBoostSpeed));
      const start = Math.PI * 0.78;
      const end = Math.PI * 2.22;
      const angle = start + (end - start) * pct;
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(186,230,253,.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r, start, end);
      ctx.stroke();
      for (let i = 0; i <= 10; i += 1) {
        const a = start + (end - start) * (i / 10);
        const inner = i % 5 === 0 ? r - 8 : r - 5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.stroke();
      }
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * (r - 10), Math.sin(angle) * (r - 10));
      ctx.stroke();
      ctx.fillStyle = "#e0f2fe";
      ctx.font = "10px DotGothic16";
      ctx.textAlign = "center";
      ctx.fillText("SPEED", 0, 8);
      ctx.fillText(`${Math.round(game.speed)}`, 0, 21);
      ctx.restore();
    }

    function drawAltTape() {
      const x = W - 28;
      const top = 80;
      const bottom = H - 132;
      const h = bottom - top;
      const alt = game.altitude;
      ctx.strokeStyle = "rgba(186,230,253,.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.stroke();
      for (let a = -200; a <= 900; a += 50) {
        const y = top + h / 2 - (a - alt) * 0.34;
        if (y < top || y > bottom) continue;
        const major = a % 100 === 0;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - (major ? 18 : 10), y);
        ctx.stroke();
        if (major) {
          ctx.fillStyle = "#bae6fd";
          ctx.font = "10px DotGothic16";
          ctx.textAlign = "right";
          ctx.fillText(`${a}`, x - 22, y + 3);
        }
      }
      ctx.fillStyle = "rgba(250,204,21,.90)";
      ctx.beginPath();
      ctx.moveTo(x - 26, top + h / 2);
      ctx.lineTo(x - 12, top + h / 2 - 8);
      ctx.lineTo(x - 12, top + h / 2 + 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#fef3c7";
      ctx.font = "11px DotGothic16";
      ctx.textAlign = "right";
      ctx.fillText(`${Math.round(alt)}m`, x - 30, top + h / 2 + 4);
    }

    function drawCompass() {
      const labels = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      const deg = ((game.heading * 180 / Math.PI) % 360 + 360) % 360;
      ctx.fillStyle = "rgba(1,12,24,.50)";
      ctx.fillRect(96, 14, 184, 24);
      ctx.strokeStyle = "rgba(125,249,255,.35)";
      ctx.strokeRect(96, 14, 184, 24);
      ctx.fillStyle = "#facc15";
      ctx.font = "14px DotGothic16";
      ctx.textAlign = "center";
      ctx.fillText(`${labels[Math.round(deg / 45) % 8]} ${Math.round(deg)}°`, centerX, 31);
      const elapsed = (performance.now() - game.totalStartMs) / 1000;
      ctx.textAlign = "right";
      ctx.fillStyle = "#67e8f9";
      ctx.fillText(`ROUND ${game.round}`, W - 12, 20);
      ctx.fillStyle = "#facc15";
      ctx.fillText(elapsed.toFixed(1), W - 12, 36);
    }

    function drawHud() {
      drawCompass();
      drawSpeedGauge();
      drawAltTape();
    }

    function update(dt) {
      applyTiltInput();
      applyGamepadInput();
      if (controlMode !== "tilt" && controlMode !== "gamepad" && stickPointer === null) {
        input.x += (keyboardTarget.x - input.x) * Math.min(1, dt * 4.0);
        input.y += (keyboardTarget.y - input.y) * Math.min(1, dt * 5.0);
      }
      if (game.phase === "countdown") {
        const elapsed = (performance.now() - game.countdownStartMs) / 1000;
        game.roll += (0 - game.roll) * Math.min(1, dt * 4);
        if (elapsed >= 3.2) {
          game.phase = "race";
          game.totalStartMs = performance.now();
          game.roundStartMs = game.totalStartMs;
          game.lastMs = game.totalStartMs;
          game.speed = 220;
          game.altitude = 34;
          ui.guide.style.display = "block";
          hitSound("gate");
          setMessage("GREEN! BOOSTで離陸だ！", 1300);
        }
        return;
      }
      const turnRate = 1.65 - Math.min(0.55, Math.max(0, game.speed - 320) * 0.001);
      game.heading += input.x * turnRate * dt;
      game.altitude += input.y * 175 * dt;
      game.altitude = Math.max(minAlt, Math.min(maxAlt, game.altitude));
      game.roll += (input.x * 1.45 - game.roll) * Math.min(1, dt * 5.8);
      updateLoop(dt);

      const throttle = Math.max(input.boost ? 1 : 0, input.throttle || 0);
      if (controlMode === "gamepad") {
        const accel = 430 * throttle - 135 * (1 - throttle);
        game.speed = Math.max(180, Math.min(maxBoostSpeed, game.speed + accel * dt));
      } else {
        const targetSpeed = cruiseSpeed + (maxBoostSpeed - cruiseSpeed) * throttle;
        game.speed += (targetSpeed - game.speed) * Math.min(1, dt * 1.8);
      }
      game.distance += game.speed * dt;
      game.planeX += Math.sin(game.heading) * game.speed * dt;
      game.planeZ += Math.cos(game.heading) * game.speed * dt;
      updateRival();
      updateAudio();

      if (game.phase === "landing") {
        updateLanding();
        return;
      }

      const gate = game.gates[game.gateIndex];
      if (gate && distance2d(gate.x, gate.z, game.planeX, game.planeZ) < 72) {
        const dx = Math.abs(lateralError(gate));
        const dy = Math.abs(gate.y - (game.altitude - 150));
        if (dx < 86 && dy < 72) {
          gate.passed = true;
          game.gateIndex += 1;
          hitSound("gate");
          setMessage(`GATE ${game.gateIndex} CLEAR!`, 900);
        } else {
          game.damage = Math.min(100, game.damage + 12);
          game.gateIndex += 1;
          hitSound("pylon");
          setMessage("ゲートミス！ +12 DAMAGE", 1200);
        }
      }

      for (const pylon of game.pylons) {
        if (pylon.hit) continue;
        if (distance2d(pylon.x, pylon.z, game.planeX, game.planeZ) < 34) {
          const dx = Math.abs(pylon.x - game.planeX);
          const dy = Math.abs(0 - (game.altitude - 150));
          const hitWidth = pylon.gateEdge ? 18 : 26;
          if (dx < hitWidth && dy < 86) {
            pylon.hit = true;
            game.damage = Math.min(100, game.damage + 18);
            hitSound("pylon");
            setMessage("パイロン接触！機体を立て直せ。", 1300);
          }
        }
      }

      if (game.altitude < 45) {
        setMessage("高度低下！引き起こせ！", 500);
      }

      if (game.altitude <= minAlt + 1 && game.phase !== "countdown") {
        hitSound("crash");
        setMessage("GROUND IMPACT!", 1200);
        finish(false, "crash");
        return;
      }

      if (game.damage >= 100) {
        hitSound("crash");
        finish(false, "crash");
      } else if (game.gateIndex >= game.gates.length) {
        beginLanding();
      }
    }

    function updateRival() {
      if (!game.rival || game.phase === "countdown") return;
      const elapsed = (performance.now() - game.totalStartMs) / 1000;
      if (game.rival.kind === "ghost") {
        const pos = sampleFromGhost(game.rival.samples, elapsed * 1000);
        if (!pos) return;
        game.rival.x = pos.x;
        game.rival.y = pos.y;
        game.rival.z = pos.z;
        game.rival.heading = pos.h;
        game.rival.roll = pos.r || 0;
        game.rival.finished = elapsed >= game.rival.totalTime;
      } else {
        const t = Math.min(1, elapsed / game.rival.totalTime);
        const pos = interpolatePath(game.coursePath, t);
        if (!pos) return;
        game.rival.x = pos.x;
        game.rival.y = pos.y;
        game.rival.z = pos.z;
        game.rival.heading = pos.heading;
        game.rival.finished = t >= 1;
      }
    }

    function recordGhostSample(now) {
      if (!game || game.phase === "countdown") return;
      const t = Math.round(now - game.totalStartMs);
      if (t - game.lastGhostSampleMs < 120) return;
      game.lastGhostSampleMs = t;
      game.ghostSamples.push({
        t,
        x: Number(game.planeX.toFixed(1)),
        y: Number((game.altitude - 150).toFixed(1)),
        z: Number(game.planeZ.toFixed(1)),
        h: Number(game.heading.toFixed(4)),
        r: Number(game.roll.toFixed(4)),
        s: Math.round(game.speed),
      });
    }

    function beginLanding() {
      if (game.phase === "landing") return;
      game.phase = "landing";
      game.landing = {
        x: game.planeX,
        z: game.planeZ,
        heading: game.heading,
      };
      setMessage("着陸せよ。滑走路中心へ進入！", 2600);
    }

    function landingProgress() {
      const base = game.landing;
      const dx = game.planeX - base.x;
      const dz = game.planeZ - base.z;
      return dx * Math.sin(base.heading) + dz * Math.cos(base.heading);
    }

    function landingLateral() {
      const base = game.landing;
      const dx = game.planeX - base.x;
      const dz = game.planeZ - base.z;
      return dx * Math.cos(base.heading) - dz * Math.sin(base.heading);
    }

    function updateLanding() {
      const progress = landingProgress();
      const lateral = Math.abs(landingLateral());
      if (progress > 160 && game.altitude < 46 && lateral < 105 && game.speed < 620) {
        setMessage("LANDING OK!", 1200);
        finishRound();
        return;
      }
      if (progress > 2450 || game.altitude <= 1) {
        hitSound("crash");
        setMessage("FAILED LANDING!", 1200);
        finish(false, "crash");
        return;
      }
      if (progress > 900 && game.speed > 620) {
        setMessage("速度が速すぎる！減速して接地！", 500);
      } else if (progress > 900 && lateral > 110) {
        setMessage("滑走路中心へ戻せ！", 500);
      } else if (progress > 900 && game.altitude > 80) {
        setMessage("高度を下げて着陸姿勢！", 500);
      }
    }

    function finishRound() {
      if (game.round < 5) {
        finish(true, "round_clear");
        return;
      }
      finish(true, "finish");
    }

    function distance2d(ax, az, bx, bz) {
      return Math.hypot(ax - bx, az - bz);
    }

    function guideInfo() {
      if (game.phase === "landing") {
        return { arrow: "↓", dist: Math.max(0, 1600 - landingProgress()) };
      }
      const gate = game.gates[game.gateIndex];
      if (!gate) return null;
      const dx = gate.x - game.planeX;
      const dz = gate.z - game.planeZ;
      const forward = dx * Math.sin(game.heading) + dz * Math.cos(game.heading);
      const side = dx * Math.cos(game.heading) - dz * Math.sin(game.heading);
      const dist = Math.hypot(dx, dz);
      let arrow = "↑";
      if (forward < -80) {
        arrow = side >= 0 ? "↻" : "↺";
      } else if (side > 55) {
        arrow = "→";
      } else if (side < -55) {
        arrow = "←";
      }
      return { arrow, dist };
    }

    function lateralError(gate) {
      const dx = gate.x - game.planeX;
      const dz = gate.z - game.planeZ;
      return dx * Math.cos(game.heading) - dz * Math.sin(game.heading);
    }

    function updateLoop(dt) {
      const wantsLoop = input.y > 0.82 && game.altitude > 520 && game.speed > 420;
      if (wantsLoop && !game.looping) {
        game.looping = true;
        setMessage("LOOP START! そのまま引き続けろ！", 900);
      }
      if (game.looping) {
        game.loopAngle += dt * 4.2;
        game.altitude = Math.max(180, game.altitude - 95 * dt);
        if (game.loopAngle >= Math.PI * 2) {
          game.loopAngle = 0;
          game.looping = false;
          setMessage("宙返り成功！", 1000);
        }
      } else {
        game.loopAngle *= Math.max(0, 1 - dt * 4);
      }
    }

    function draw() {
      drawGrid();
      drawRunway();
      for (const item of game.scenery) drawScenery(item);
      for (const marker of game.courseMarkers) drawCourseMarker(marker);
      for (const gate of game.gates) drawGate(gate, game.gates.indexOf(gate));
      for (const pylon of game.pylons) drawPylon(pylon);
      drawRival();
      drawPlaneHud();
      drawHud();
      drawDamage();
      drawStartSignal();
    }

    function frame(now) {
      if (!game || !game.running) return;
      resizeCanvas();
      const dt = Math.min(0.05, (now - game.lastMs) / 1000);
      game.lastMs = now;
      update(dt);
      recordGhostSample(now);
      draw();
      updateMeters(now);
      raf = requestAnimationFrame(frame);
    }

    function updateMeters(now) {
      const elapsed = (now - game.totalStartMs) / 1000;
      ui.speed.textContent = `${Math.round(game.speed)} km/h`;
      ui.alt.textContent = `${Math.round(game.altitude)} m`;
      ui.time.textContent = `R${game.round} ${elapsed.toFixed(2)}`;
      const diff = game.rival ? elapsed - game.rival.totalTime * Math.min(1, game.gateIndex / game.gates.length) : 0;
      const guide = guideInfo();
      ui.guide.innerHTML = guide
        ? `<span class="guide-arrow">${guide.arrow}</span><span class="guide-meta">${game.phase === "landing" ? "RUNWAY" : `GATE ${game.gateIndex + 1}`} / ${Math.round(guide.dist)}m / RIVAL ${diff >= 0 ? "+" : ""}${diff.toFixed(1)}s</span>`
        : `<span class="guide-arrow">★</span><span class="guide-meta">FINAL</span>`;
      if (game.altitude < 45 && now > game.messageUntil) {
        ui.message.textContent = "高度低下！地面効果で機体が暴れるぞ。";
      }
    }

    function finish(success, reason = "finish") {
      if (!game.running) return;
      game.running = false;
      cancelAnimationFrame(raf);
      stopAudio();
      const elapsedMs = performance.now() - game.totalStartMs;
      if (success || reason === "round_clear") {
        saveGhost({
          name: localStorage.getItem("airrace_name") || "PILOT",
          round: game.round,
          time_ms: Math.round(elapsedMs),
          samples: game.ghostSamples,
          created_at: new Date().toISOString(),
        });
      }
      const recordRound = success ? 5 : Math.max(0, game.round - 1);
      const recordScore = encodeScore(recordRound, elapsedMs);
      const title = ui.result.querySelector("h1");
      ui.guide.style.display = "none";
      ui.nextRound.style.display = "none";
      ui.retry.style.display = "inline-block";
      ui.nameEntry.style.display = "none";
      if (reason === "round_clear") {
        title.textContent = `ROUND ${game.round} CLEAR`;
        const result = game.rival?.finished ? "YOU LOSE" : "YOU WIN";
        ui.resultText.textContent = `${result} / TOTAL ${formatTime(elapsedMs)} / NEXT ROUND ${game.round + 1}`;
        ui.nextRound.style.display = "inline-block";
        ui.retry.style.display = "none";
      } else if (success) {
        title.textContent = "FINISH";
        const result = game.rival?.finished ? "YOU LOSE" : "YOU WIN";
        ui.resultText.textContent = `${result} / TOTAL TIME ${formatTime(elapsedMs)} / DAMAGE ${Math.round(game.damage)}%`;
        if (scoreQualifies(recordScore)) {
          ui.nameEntry.style.display = "block";
          ui.retry.style.display = "none";
          ui.nameInput.value = localStorage.getItem("airrace_name") || "";
          ui.nameInput.focus();
        }
      } else {
        title.textContent = reason === "crash" ? "CRASH" : "GAME OVER";
        ui.resultText.textContent = reason === "crash"
          ? `GROUND IMPACT / ROUND ${game.round}`
          : `DAMAGE ${Math.round(game.damage)}% / ROUND ${game.round}`;
        if (recordRound >= 1 && scoreQualifies(recordScore)) {
          ui.resultText.textContent += ` / RECORD round${recordRound}`;
          ui.nameEntry.style.display = "block";
          ui.retry.style.display = "none";
        }
      }
      ui.result.style.display = "flex";
      updateButtonHints();
    }

    async function start() {
      await loadGhosts();
      resetGame();
      raf = requestAnimationFrame(frame);
    }

    document.getElementById("start").addEventListener("click", start);
    document.getElementById("retry").addEventListener("click", showTitle);
    document.getElementById("next-round").addEventListener("click", () => {
      if (!game) return;
      const carry = { totalStartMs: game.totalStartMs };
      resetGame(game.round + 1, carry);
      raf = requestAnimationFrame(frame);
    });
    document.getElementById("save-score").addEventListener("click", () => {
      if (!game) return;
      const elapsedMs = performance.now() - game.totalStartMs;
      const recordRound = game.gateIndex >= game.gates.length && game.round >= 5 ? 5 : Math.max(0, game.round - 1);
      if (recordRound < 1) {
        showTitle();
        return;
      }
      const name = (ui.nameInput.value || "PILOT").trim().slice(0, 12) || "PILOT";
      localStorage.setItem("airrace_name", name);
      fetch("/api/airrace/scores", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name, score: encodeScore(recordRound, elapsedMs) }),
      }).finally(showTitle);
    });

    document.addEventListener("gesturestart", (ev) => ev.preventDefault());
    document.addEventListener("dblclick", (ev) => ev.preventDefault());
    document.addEventListener("contextmenu", (ev) => ev.preventDefault());

    function setControlMode(nextMode) {
      controlMode = nextMode;
      ui.modeStick.classList.toggle("active", controlMode === "stick");
      ui.modeTilt.classList.toggle("active", controlMode === "tilt");
      ui.modeGamepad.classList.toggle("active", controlMode === "gamepad");
      tiltBase = null;
      tiltFiltered = { beta: tilt.beta, gamma: tilt.gamma };
      if (controlMode !== "gamepad") {
        input.boost = false;
        input.throttle = 0;
      }
      updateGamepadStatus();
      updateButtonHints();
    }

    function applyTiltInput() {
      if (controlMode !== "tilt") return;
      if (!tiltBase) {
        tiltBase = { beta: tilt.beta, gamma: tilt.gamma };
        tiltFiltered = { beta: tilt.beta, gamma: tilt.gamma };
      }
      tiltFiltered.beta += (tilt.beta - tiltFiltered.beta) * 0.08;
      tiltFiltered.gamma += (tilt.gamma - tiltFiltered.gamma) * 0.08;
      const pitch = tiltFiltered.beta - tiltBase.beta;
      const roll = tiltFiltered.gamma - tiltBase.gamma;
      const pitchAmount = Math.min(1, Math.abs(pitch) / 38);
      const rollDamping = 1 - pitchAmount * 0.65;
      input.x = tiltAxis((roll * rollDamping) / 66);
      input.y = tiltAxis(pitch / 70);
    }

    function tiltAxis(value) {
      const deadZone = 0.08;
      if (Math.abs(value) < deadZone) return 0;
      const sign = Math.sign(value);
      const scaled = (Math.abs(value) - deadZone) / (1 - deadZone);
      return sign * Math.max(0, Math.min(0.72, scaled));
    }

    async function enableTiltMode() {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result !== "granted") return;
      }
      setControlMode("tilt");
    }

    function axisWithDeadzone(value, deadZone = 0.14) {
      if (Math.abs(value) < deadZone) return 0;
      const sign = Math.sign(value);
      const scaled = (Math.abs(value) - deadZone) / (1 - deadZone);
      return sign * Math.min(1, Math.max(0, scaled));
    }

    function getActiveGamepad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      if (activeGamepadIndex !== null && pads[activeGamepadIndex]) {
        return pads[activeGamepadIndex];
      }
      return Array.from(pads).find(Boolean) || null;
    }

    function updateGamepadStatus() {
      if (!ui.gamepadStatus) return;
      const pad = getActiveGamepad();
      if (pad) {
        gamepadName = pad.id || "Gamepad";
        ui.gamepadStatus.textContent = `GAMEPAD: ${gamepadName}`;
      } else {
        ui.gamepadStatus.textContent = "PS4/PS5 コントローラは接続後にボタンを1回押してね。";
      }
      updateButtonHints();
    }

    function useGamepadHints() {
      return controlMode === "gamepad" && !!getActiveGamepad();
    }

    function updateButtonHints() {
      const showHints = useGamepadHints();
      ui.start.textContent = showHints ? `× ${buttonLabels.start}` : buttonLabels.start;
      ui.saveScore.textContent = showHints ? `× ${buttonLabels.saveScore}` : buttonLabels.saveScore;
      ui.nextRound.textContent = showHints ? `× ${buttonLabels.nextRound}` : buttonLabels.nextRound;
      ui.retry.textContent = showHints ? `○ ${buttonLabels.retry}` : buttonLabels.retry;
    }

    function applyGamepadInput() {
      if (controlMode !== "gamepad") return;
      const pad = getActiveGamepad();
      if (!pad) {
        input.x = 0;
        input.y = 0;
        input.boost = false;
        input.throttle = 0;
        updateGamepadStatus();
        return;
      }
      activeGamepadIndex = pad.index;
      input.x = axisWithDeadzone(pad.axes[0] || 0);
      input.y = axisWithDeadzone(pad.axes[1] || 0);
      const cross = pad.buttons[0]?.pressed || false;
      const r1 = pad.buttons[5]?.pressed || false;
      const r2Value = pad.buttons[7]?.value || 0;
      input.throttle = Math.max(cross || r1 ? 1 : 0, r2Value);
      input.boost = input.throttle > 0.02;
    }

    function isVisible(el) {
      return !!el && getComputedStyle(el).display !== "none";
    }

    function gamepadPressedOnce(pad, index) {
      const pressed = pad.buttons[index]?.pressed || false;
      const wasPressed = gamepadPrevButtons[index] || false;
      gamepadPrevButtons[index] = pressed;
      return pressed && !wasPressed;
    }

    function pollGamepadUi() {
      const pad = getActiveGamepad();
      if (!pad || controlMode !== "gamepad") {
        requestAnimationFrame(pollGamepadUi);
        return;
      }

      // UI操作は「押した瞬間」だけ使う。BOOST押しっぱなしからの誤爆を避ける。
      const crossOnce = gamepadPressedOnce(pad, 0);
      const circleOnce = gamepadPressedOnce(pad, 1);
      const optionsOnce = gamepadPressedOnce(pad, 9);

      if (crossOnce) {
        if (isVisible(ui.title)) {
          start();
        } else if (isVisible(ui.nextRound)) {
          ui.nextRound.click();
        } else if (isVisible(ui.nameEntry)) {
          ui.saveScore.click();
        } else if (isVisible(ui.retry)) {
          ui.retry.click();
        }
      }

      if (circleOnce || optionsOnce) {
        if (isVisible(ui.result) || isVisible(ui.title)) {
          showTitle();
        }
      }

      requestAnimationFrame(pollGamepadUi);
    }

    window.addEventListener("deviceorientation", (ev) => {
      tilt.beta = Number(ev.beta || 0);
      tilt.gamma = Number(ev.gamma || 0);
    });

    if ("DeviceOrientationEvent" in window || "getGamepads" in navigator) {
      ui.controlMode.style.display = "flex";
    }
    ui.modeStick.addEventListener("click", () => setControlMode("stick"));
    ui.modeTilt.addEventListener("click", enableTiltMode);
    ui.modeGamepad.addEventListener("click", () => {
      setControlMode("gamepad");
      updateGamepadStatus();
    });

    window.addEventListener("gamepadconnected", (ev) => {
      activeGamepadIndex = ev.gamepad.index;
      gamepadName = ev.gamepad.id || "Gamepad";
      gamepadPrevButtons = [];
      updateGamepadStatus();
      if (controlMode === "stick") {
        setControlMode("gamepad");
      }
    });

    window.addEventListener("gamepaddisconnected", (ev) => {
      if (activeGamepadIndex === ev.gamepad.index) {
        activeGamepadIndex = null;
        gamepadPrevButtons = [];
        input.boost = false;
        input.throttle = 0;
      }
      updateGamepadStatus();
    });

    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft" || ev.key.toLowerCase() === "a") keyboardTarget.x = -0.72;
      if (ev.key === "ArrowRight" || ev.key.toLowerCase() === "d") keyboardTarget.x = 0.72;
      if (ev.key === "ArrowUp" || ev.key.toLowerCase() === "w") keyboardTarget.y = -0.86;
      if (ev.key === "ArrowDown" || ev.key.toLowerCase() === "s") keyboardTarget.y = 0.86;
      if (ev.code === "Space") {
        input.boost = true;
        input.throttle = 1;
      }
    });

    document.addEventListener("keyup", (ev) => {
      if (["ArrowLeft", "ArrowRight", "a", "d", "A", "D"].includes(ev.key)) keyboardTarget.x = 0;
      if (["ArrowUp", "ArrowDown", "w", "s", "W", "S"].includes(ev.key)) keyboardTarget.y = 0;
      if (ev.code === "Space") {
        input.boost = false;
        input.throttle = 0;
      }
    });

    document.getElementById("boost").addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      input.boost = true;
      input.throttle = 1;
    });
    document.getElementById("boost").addEventListener("pointerup", () => {
      input.boost = false;
      input.throttle = 0;
    });
    document.getElementById("boost").addEventListener("pointercancel", () => {
      input.boost = false;
      input.throttle = 0;
    });

    let stickPointer = null;
    ui.stick.addEventListener("pointerdown", (ev) => {
      stickPointer = ev.pointerId;
      ui.stick.setPointerCapture(stickPointer);
      updateStick(ev);
    });
    ui.stick.addEventListener("pointermove", (ev) => {
      if (ev.pointerId === stickPointer) updateStick(ev);
    });
    ui.stick.addEventListener("pointerup", resetStick);
    ui.stick.addEventListener("pointercancel", resetStick);

    function updateStick(ev) {
      const rect = ui.stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = ev.clientX - cx;
      const dy = ev.clientY - cy;
      const len = Math.min(38, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      const kx = Math.cos(angle) * len;
      const ky = Math.sin(angle) * len;
      input.x = kx / 38;
      input.y = ky / 38;
      ui.knob.style.transform = `translate(${kx}px, ${ky}px)`;
    }

    function resetStick() {
      stickPointer = null;
      input.x = 0;
      input.y = 0;
      ui.knob.style.transform = "translate(0, 0)";
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      if (!game) drawSplash();
    });
    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        resizeCanvas();
        if (!game) drawSplash();
      }, 250);
    });

    resizeCanvas();
    updateButtonHints();
    pollGamepadUi();
    loadGhosts();
    showTitle();

    function drawSplash() {
      ctx.fillStyle = "#071827";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(103,232,249,.45)";
      for (let i = -6; i <= 6; i += 1) {
        ctx.beginPath();
        ctx.moveTo(centerX, horizon);
        ctx.lineTo(centerX + i * 55, H);
        ctx.stroke();
      }
      ctx.fillStyle = "#67e8f9";
      ctx.font = "14px DotGothic16";
      ctx.textAlign = "center";
      ctx.fillText("VECTOR SCAN AIR COURSE", centerX, horizon + 15);
    }
  </script>
</body>
</html>
