<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06172b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Air Race">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ベクター・エアレース</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <link rel="manifest" href="/airrace.webmanifest">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 14%, rgba(71, 204, 255, 0.20), transparent 28%),
        linear-gradient(180deg, #06172b 0%, #0b2238 52%, #3c2918 53%, #15100d 100%);
      color: #e5f7ff;
      font-family: "DotGothic16", monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
      z-index: 20;
    }

    #app {
      width: min(100vw, 430px);
      height: 100dvh;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: max(4px, env(safe-area-inset-top)) 6px max(4px, env(safe-area-inset-bottom));
      position: relative;
      box-sizing: border-box;
    }

    #topbar {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      font-size: 12px;
      color: #b9f5ff;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.65);
    }

    .top-menu {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 8;
      display: inline-block;
      width: fit-content;
      padding: 4px 8px;
      border: 1px solid rgba(125, 249, 255, 0.24);
      border-radius: 999px;
      background: rgba(1, 12, 24, 0.46);
      color: #bae6fd;
      font-size: 13px;
      text-decoration: none;
      text-shadow: 0 0 8px #38bdf8;
    }

    .meter {
      border: 1px solid rgba(125, 249, 255, 0.35);
      border-radius: 10px;
      background: rgba(1, 12, 24, 0.58);
      padding: 6px 8px;
      box-shadow: inset 0 0 14px rgba(14, 165, 233, 0.12);
      min-height: 42px;
    }

    .meter strong {
      display: block;
      font-size: 11px;
      color: #5eead4;
      letter-spacing: 0.08em;
    }

    .meter span {
      display: block;
      font-size: 15px;
      margin-top: 2px;
      color: #f8fafc;
    }

    #canvas-wrap {
      position: relative;
      width: min(calc(100dvw - 12px), 980px);
      height: min(calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 680px);
      max-height: calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border: 1px solid rgba(125, 249, 255, 0.42);
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(103, 232, 249, 0.12), transparent 35%),
        linear-gradient(180deg, #0c2c4d 0%, #071827 50%, #7a5026 51%, #1c130d 100%);
      box-shadow:
        0 0 28px rgba(34, 211, 238, 0.20),
        inset 0 0 42px rgba(34, 211, 238, 0.08);
    }

    #guide {
      position: absolute;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      z-index: 7;
      min-width: 128px;
      padding: 4px 10px 7px;
      border: 1px solid rgba(250, 204, 21, 0.55);
      border-radius: 18px;
      background: rgba(8, 13, 28, 0.72);
      color: #facc15;
      text-align: center;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.80);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.18);
      animation: guide-blink 0.75s steps(2, end) infinite;
      pointer-events: none;
    }

    .guide-arrow {
      display: block;
      font-size: 54px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: 0;
    }

    .guide-meta {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #fef3c7;
    }

    @keyframes guide-blink {
      50% {
        opacity: 0.35;
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    #title,
    #result {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px;
      background: radial-gradient(circle, rgba(8, 47, 73, 0.92), rgba(2, 6, 23, 0.94));
      z-index: 10;
      text-align: center;
    }

    #result {
      display: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 12;
      background: rgba(2, 8, 23, 0.76);
      backdrop-filter: blur(2px);
    }

    .loading-panel {
      width: min(82%, 280px);
      padding: 18px 16px 16px;
      border: 1px solid rgba(125, 249, 255, 0.28);
      border-radius: 16px;
      background: rgba(1, 12, 24, 0.84);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.18);
      text-align: center;
    }

    .loading-panel strong {
      display: block;
      color: #f8fafc;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .loading-bar {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(14, 116, 144, 0.32);
      border: 1px solid rgba(125, 249, 255, 0.18);
    }

    .loading-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #67e8f9, #facc15);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.38);
      transition: width 0.18s ease;
    }

    .loading-meta {
      display: block;
      margin-top: 8px;
      color: #bae6fd;
      font-size: 11px;
      min-height: 1.4em;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-shadow:
        0 0 8px #67e8f9,
        0 0 22px #0891b2;
    }

    .lead {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #b6efff;
    }

    #name-entry {
      display: none;
      width: min(100%, 280px);
      padding: 10px;
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 14px;
      background: rgba(67, 20, 7, 0.38);
    }

    .control-mode {
      display: none;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .control-mode button {
      font-size: 12px;
      padding: 6px 12px;
      background: rgba(8, 47, 73, 0.85);
      color: #cffafe;
    }

    .control-mode button.active {
      background: linear-gradient(180deg, #fef3c7, #facc15);
      color: #422006;
    }

    .plane-select {
      width: min(100%, 320px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .field-mode {
      width: min(100%, 320px);
      margin-top: -4px;
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(8, 47, 73, 0.85);
      color: #cffafe;
    }

    .round-mode {
      width: min(100%, 320px);
      margin-top: -4px;
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(58, 47, 10, 0.88);
      color: #fef3c7;
    }

    .start-actions {
      width: min(100%, 320px);
      display: grid;
      gap: 8px;
    }

    .plane-nav {
      min-width: 0;
      width: 54px;
      padding: 10px 0;
      font-size: 22px;
      line-height: 1;
    }

    .plane-display {
      flex: 1;
      border: 1px solid rgba(125, 249, 255, 0.26);
      border-radius: 14px;
      background: rgba(1, 12, 24, 0.54);
      padding: 10px 12px;
      text-align: center;
    }

    .plane-display strong {
      display: block;
      color: #f8fafc;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .plane-display span {
      display: block;
      color: #bae6fd;
      font-size: 11px;
      line-height: 1.55;
    }

    .plane-display.active {
      border-color: rgba(250, 204, 21, 0.72);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.16);
    }

    #plane-preview {
      display: block;
      width: 100%;
      height: 42px;
      margin-bottom: 6px;
    }

    #gamepad-status {
      min-height: 16px;
      font-size: 11px;
      color: #bae6fd;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.70);
    }

    #name-input {
      width: 100%;
      margin: 8px 0;
      border: 1px solid rgba(250, 204, 21, 0.55);
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.78);
      color: #fef3c7;
      font-family: inherit;
      font-size: 16px;
      padding: 9px 12px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    button {
      border: 1px solid rgba(125, 249, 255, 0.65);
      border-radius: 999px;
      background: linear-gradient(180deg, #cffafe, #06b6d4);
      color: #082f49;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 10px 24px;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
      cursor: pointer;
      touch-action: manipulation;
    }

    #back {
      display: none;
    }

    #message {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      z-index: 7;
      min-height: 0;
      border: 1px solid rgba(125, 249, 255, 0.24);
      border-radius: 12px;
      background: rgba(1, 10, 20, 0.55);
      padding: 6px 10px;
      font-size: 13px;
      color: #fef3c7;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.50);
      pointer-events: none;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 132px;
      z-index: 6;
      pointer-events: none;
    }

    #stick {
      position: absolute;
      left: 14px;
      bottom: 58px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 1px solid rgba(125, 249, 255, 0.38);
      background: radial-gradient(circle, rgba(14, 165, 233, 0.18), rgba(15, 23, 42, 0.68));
      box-shadow: inset 0 0 20px rgba(34, 211, 238, 0.18);
      touch-action: none;
      pointer-events: auto;
    }

    #knob {
      position: absolute;
      left: 29px;
      top: 29px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ffffff, #22d3ee 44%, #075985);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.7);
      pointer-events: none;
    }

    #boost {
      position: absolute;
      right: 16px;
      bottom: 70px;
      width: 84px;
      height: 56px;
      border-radius: 20px;
      background: linear-gradient(180deg, #fed7aa, #f97316);
      border-color: rgba(251, 146, 60, 0.8);
      color: #431407;
      pointer-events: auto;
    }

    #help {
      position: absolute;
      left: 116px;
      right: 110px;
      bottom: 74px;
      font-size: 11px;
      line-height: 1.6;
      color: #93c5fd;
      text-align: center;
    }

    @media (max-height: 700px) {
      #app {
        justify-content: center;
        gap: 0;
      }

      #topbar {
        font-size: 10px;
      }

      .meter {
        min-height: 36px;
        padding: 5px 6px;
      }

      .meter span {
        font-size: 13px;
      }

      #canvas-wrap {
        width: min(calc(100dvw - 12px), 980px);
        height: min(calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 560px);
        max-height: calc(100dvh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }

      #stick {
        width: 82px;
        height: 82px;
        bottom: 52px;
      }

      #knob {
        left: 26px;
        top: 26px;
        width: 30px;
        height: 30px;
      }

      #boost {
        width: 78px;
        height: 52px;
        bottom: 64px;
      }

      #message {
        font-size: 12px;
        padding: 5px 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <a id="back" href="/">← menu</a>
    <div id="topbar">
      <div class="meter"><strong>SPEED</strong><span id="speed">320 km/h</span></div>
      <div class="meter"><strong>ALT</strong><span id="alt">120 m</span></div>
      <div class="meter"><strong>TIME</strong><span id="time">00.00</span></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="c" width="375" height="500"></canvas>
      <a class="top-menu" href="/">← MENU</a>
      <div id="guide">NEXT GATE →</div>
      <div id="message">左プニコンで旋回と高度。BOOSTで加速。</div>
      <div id="controls">
        <div id="stick"><div id="knob"></div></div>
        <div id="help">← → 旋回<br>↑ ↓ 高度<br>PCは矢印/WASD + Space</div>
        <button id="boost">BOOST</button>
      </div>
      <section id="title">
        <h1>VECTOR<br>AIR RACE</h1>
        <p class="lead">5機から自機を選んで参戦<br>Round 3 から World Grand Prix 全10コース。</p>
        <div id="control-mode" class="control-mode">
          <button id="mode-stick" class="active">プニコン</button>
          <button id="mode-tilt">傾き操作</button>
          <button id="mode-gamepad">コントローラ</button>
        </div>
        <div id="gamepad-status">PS4/PS5 コントローラは接続後にボタンを1回押してね。</div>
        <div id="plane-select" class="plane-select">
          <button id="plane-prev" class="plane-nav" type="button">＜</button>
          <div id="plane-display" class="plane-display active">
            <canvas id="plane-preview" width="220" height="42"></canvas>
            <strong id="plane-name"></strong>
            <span id="plane-summary"></span>
          </div>
          <button id="plane-next" class="plane-nav" type="button">＞</button>
        </div>
        <button id="field-mode" class="field-mode" type="button">FIELD NORMAL</button>
        <button id="round-mode" class="round-mode" type="button">START ROUND 3</button>
        <div class="start-actions">
          <button id="start">ROUND 1 START</button>
          <button id="start-main">ROUND 3 START</button>
        </div>
      </section>
      <section id="result">
        <h1>FINISH</h1>
        <p class="lead" id="result-text"></p>
        <div id="name-entry">
          <div>RECORD UPDATE!</div>
          <input id="name-input" maxlength="12" placeholder="名前">
          <button id="save-score">SAVE</button>
        </div>
        <button id="next-round">NEXT ROUND</button>
        <button id="retry">TITLE</button>
      </section>
      <section id="loading">
        <div class="loading-panel">
          <strong id="loading-label">NOW LOADING</strong>
          <div class="loading-bar"><div id="loading-fill" class="loading-fill"></div></div>
          <span id="loading-meta" class="loading-meta"></span>
        </div>
      </section>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W = canvas.width;
    let H = canvas.height;
    let horizon = 230;
    let centerX = W / 2;
    let centerY = 255;
    let worldWidth = 420;
    const minAlt = 0;
    const maxAlt = 1000;
    const cruiseSpeed = 340;
    const maxBoostSpeed = 1500;
    const rollVisual = 0.88;
    const groundY = -110;
    const gateWorldRadius = 86;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const cssW = Math.max(320, Math.round(rect.width));
      const cssH = Math.max(320, Math.round(rect.height));
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = cssW;
      H = cssH;
      centerX = W / 2;
      centerY = H * 0.51;
      horizon = H * 0.46;
      worldWidth = Math.max(420, W * 1.12);
    }

    const ui = {
      speed: document.getElementById("speed"),
      alt: document.getElementById("alt"),
      time: document.getElementById("time"),
      message: document.getElementById("message"),
      title: document.getElementById("title"),
      result: document.getElementById("result"),
      resultText: document.getElementById("result-text"),
      nameEntry: document.getElementById("name-entry"),
      nameInput: document.getElementById("name-input"),
      nextRound: document.getElementById("next-round"),
      retry: document.getElementById("retry"),
      start: document.getElementById("start"),
      startMain: document.getElementById("start-main"),
      saveScore: document.getElementById("save-score"),
      controlMode: document.getElementById("control-mode"),
      modeStick: document.getElementById("mode-stick"),
      modeTilt: document.getElementById("mode-tilt"),
      modeGamepad: document.getElementById("mode-gamepad"),
      gamepadStatus: document.getElementById("gamepad-status"),
      planeSelect: document.getElementById("plane-select"),
      planePrev: document.getElementById("plane-prev"),
      planeNext: document.getElementById("plane-next"),
      fieldMode: document.getElementById("field-mode"),
      roundMode: document.getElementById("round-mode"),
      planeDisplay: document.getElementById("plane-display"),
      planePreview: document.getElementById("plane-preview"),
      planeName: document.getElementById("plane-name"),
      planeSummary: document.getElementById("plane-summary"),
      loading: document.getElementById("loading"),
      loadingLabel: document.getElementById("loading-label"),
      loadingFill: document.getElementById("loading-fill"),
      loadingMeta: document.getElementById("loading-meta"),
      knob: document.getElementById("knob"),
      stick: document.getElementById("stick"),
      guide: document.getElementById("guide"),
    };

    const input = {
      x: 0,
      y: 0,
      boost: false,
      throttle: 0,
    };

    let game = null;
    let raf = null;
    let audio = null;
    let controlMode = "stick";
    let selectedAircraftId = localStorage.getItem("airrace_aircraft") || "skylancer";
    let selectedFieldModeId = localStorage.getItem("airrace_field_mode") || "normal";
    let selectedStartRound = Math.max(1, Math.min(10, Number(localStorage.getItem("airrace_start_round") || 3) || 3));
    let tiltBase = null;
    let tilt = { beta: 0, gamma: 0 };
    let tiltFiltered = { beta: 0, gamma: 0 };
    let activeGamepadIndex = null;
    let gamepadName = "";
    let gamepadPrevButtons = [];
    const keyboardTarget = { x: 0, y: 0 };
    window.airraceRoundCache = {};
    let loadingToken = 0;

    const buttonLabels = {
      start: "ROUND 1 START",
      startMain: "ROUND 3 START",
      saveScore: "SAVE",
      nextRound: "NEXT ROUND",
      retry: "TITLE",
    };

    const AIRCRAFTS = [
      {
        id: "skylancer",
        name: "スカイランサー号",
        summary: "平均的な優等生。初見コースの基準機。",
        speedMul: 1.0,
        boostMul: 1.0,
        turnMul: 1.0,
        climbMul: 1.0,
        color: "rgba(125, 211, 252, 0.78)",
        stroke: "#e0f2fe",
        shape: "standard",
      },
      {
        id: "thunderbolt",
        name: "サンダーボルト号",
        summary: "きびきび旋回。テクニカル向け。",
        speedMul: 0.94,
        boostMul: 0.94,
        turnMul: 1.24,
        climbMul: 1.08,
        color: "rgba(250, 204, 21, 0.78)",
        stroke: "#fef3c7",
        shape: "broad",
      },
      {
        id: "shootingstar",
        name: "シューティングスター号",
        summary: "高速番長。直線と大カーブで強い。",
        speedMul: 1.08,
        boostMul: 1.16,
        turnMul: 0.82,
        climbMul: 0.94,
        color: "rgba(248, 113, 113, 0.80)",
        stroke: "#fee2e2",
        shape: "dart",
      },
      {
        id: "spiralfang",
        name: "スパイラルファング号",
        summary: "ピーキーな軽量機。反応最速。",
        speedMul: 0.98,
        boostMul: 0.98,
        turnMul: 1.32,
        climbMul: 1.14,
        color: "rgba(192, 132, 252, 0.82)",
        stroke: "#f3e8ff",
        shape: "fang",
      },
      {
        id: "ironhawk",
        name: "アイアンホーク号",
        summary: "重いけど安定。崩れにくい。",
        speedMul: 1.03,
        boostMul: 1.08,
        turnMul: 0.9,
        climbMul: 0.92,
        color: "rgba(74, 222, 128, 0.76)",
        stroke: "#dcfce7",
        shape: "heavy",
      },
    ];

    const TOTAL_ROUNDS = 10;
    const GRAND_PRIX_START_ROUND = 3;
    const USE_GHOST_RIVALS = false;
    const POINT_TABLE = [10, 8, 6, 4, 2];

    function buildLaneOffsets(count) {
      const spacing = count >= 14 ? 38 : count >= 10 ? 46 : count >= 6 ? 60 : 104;
      const offsets = [];
      for (let i = 0; i < count; i += 1) {
        let offset = (i - (count - 1) / 2) * spacing;
        if (Math.abs(offset) < spacing * 0.45) offset += offset >= 0 ? spacing * 0.6 : -spacing * 0.6;
        offsets.push(Math.round(offset));
      }
      return offsets;
    }

    function buildRivalProfiles(count) {
      const offsets = buildLaneOffsets(count);
      return Array.from({ length: count }, (_, index) => {
        const base = RIVAL_ARCHETYPES[index % RIVAL_ARCHETYPES.length];
        const tier = Math.floor(index / RIVAL_ARCHETYPES.length);
        const paceShift = tier * 0.025 + (index >= count - 2 ? 0.03 : 0);
        const suffix = tier > 0 ? ` ${tier + 1}` : "";
        return {
          ...base,
          id: `${base.id}_${index}`,
          name: `${base.name}${suffix}`,
          laneOffset: offsets[index],
          aircraft: aircraftById(base.aircraftId),
          points: 0,

          wave: (base.wave || 0) + tier * 2,

      const cached = !forceRefresh ? currentRoundCache(round) : null;
      if (cached) return cached;
      onProgress(0.18, "course json");
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(`/api/airrace/round/${round}?ts=${Date.now()}`, {
        cache: "no-store",
        signal: controller.signal,
      }).finally(() => clearTimeout(timer));
      if (!res.ok) throw new Error(`round fetch failed: ${round}`);
      onProgress(0.56, "ghost data");
      const data = await res.json();
      const bundle = {
        round,
        course: data.course || {},
        ghosts: Array.isArray(data.ghosts) ? data.ghosts : [],
      };
      window.airraceRoundCache[round] = bundle;
      onProgress(0.82, "scan build");
      return bundle;

    function catmullRomPoint(p0, p1, p2, p3, t) {
      const t2 = t * t;
      const t3 = t2 * t;
      return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
        z: 0.5 * ((2 * p1.z) + (-p0.z + p2.z) * t + (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t2 + (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t3),
      };
    }

    function buildSmoothCoursePath(points, subdivisions = 12) {
      if (!points || points.length < 2) return points || [];
      const out = [];
      for (let i = 0; i < points.length - 1; i += 1) {
        const p0 = points[Math.max(0, i - 1)];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[Math.min(points.length - 1, i + 2)];
        for (let j = 0; j < subdivisions; j += 1) {
          out.push(catmullRomPoint(p0, p1, p2, p3, j / subdivisions));
        }
      }
      out.push({ ...points[points.length - 1] });
      for (let i = 0; i < out.length; i += 1) {
        const prev = out[Math.max(0, i - 1)];
        const next = out[Math.min(out.length - 1, i + 1)];
        out[i].heading = Math.atan2(next.x - prev.x, next.z - prev.z);
      }
      return out;
    }

    function sampleGuideMarkers(path, spacing) {
      if (!path || path.length < 2) return [];
      const markers = [];
      let traveled = 0;
      let target = spacing;
      for (let i = 1; i < path.length; i += 1) {
        const a = path[i - 1];
        const b = path[i];
        const seg = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
        if (seg <= 0.001) continue;
        while (traveled + seg >= target) {
          const f = (target - traveled) / seg;
          markers.push({
            x: a.x + (b.x - a.x) * f,
            y: a.y + (b.y - a.y) * f,
            z: a.z + (b.z - a.z) * f,
          });
          target += spacing;
        }
        traveled += seg;
      }
      return markers;
    }

    function pathLength(path) {
      if (!path || path.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < path.length; i += 1) {
        const a = path[i - 1];
        const b = path[i];
        total += Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
      }
      return total;
    }

    function buildUrbanTowers(path, options = {}) {
      if (!path || path.length < 3) return [];
      const towers = [];
      const laneGap = options.laneGap || 210;
      const outerGap = options.outerGap || 360;
      const depth = options.depth || 80;
      const minHeight = options.minHeight || 300;
      const maxHeight = options.maxHeight || 760;
      const step = options.step || 3;
      const skipStart = options.skipStart || 2;
      const skipEnd = options.skipEnd || 2;
      for (let i = skipStart; i < path.length - skipEnd; i += step) {
        const node = path[i];
        const next = path[Math.min(path.length - 1, i + 1)];
        const dx = next.x - node.x;
        const dz = next.z - node.z;
        const len = Math.max(1, Math.hypot(dx, dz));
        const nx = dz / len;
        const nz = -dx / len;
        const towerCount = 2 + (i % 2);
        for (const side of [-1, 1]) {
          for (let j = 0; j < towerCount; j += 1) {
            const radial = laneGap + outerGap * (j + 1) + (i % 3) * 34 + j * 16;
            const along = (j - (towerCount - 1) * 0.5) * 170 + ((i + j) % 2 === 0 ? 60 : -60);
            const x = node.x + nx * side * radial + (dx / len) * along;
            const z = node.z + nz * side * radial + (dz / len) * along;
            const h = minHeight + ((i * 97 + j * 71 + (side > 0 ? 37 : 0)) % (maxHeight - minHeight));
            towers.push({
              type: "tower",
              x,
              y: groundY,
              z,
              h,
              w: 90 + ((i + j) % 3) * 24,
              d: depth + (j % 2) * 18,
              glow: 0.16 + ((i + j) % 4) * 0.03,
              hit: false,
            });
          }
        }
      }
      return towers;
    }

          minHeight: 320,
          maxHeight: 860,
          step: 4,
          skipStart: 2,
          skipEnd: 1,
        }));
      }
      const boundsX = [0, 82, ...gates.map((gate) => gate.x)];
      const boundsZ = [-520, 0, ...smoothCoursePath.map((point) => point.z)];
      const courseBounds = {
        minX: Math.floor((Math.min(...boundsX) - 1200) / 200) * 200,
        maxX: Math.ceil((Math.max(...boundsX) + 1200) / 200) * 200,
        minZ: Math.floor((Math.min(...boundsZ) - 1200) / 200) * 200,
        maxZ: Math.ceil((Math.max(...boundsZ) + 1800) / 200) * 200,
      };
      return { gates, pylons, scenery, clouds, courseMarkers, coursePath: smoothCoursePath, courseBounds, courseSpec };
    }

    function makeCpuRival(round, coursePath, laneOffset, label, paceMul, profile = null) {
      const rivalAircraft = profile?.aircraft || (round >= 4 ? AIRCRAFTS[2] : round === 3 ? AIRCRAFTS[1] : AIRCRAFTS[0]);
      const courseDistance = Math.max(9600, pathLength(coursePath));
      const baseCruise = 430 + round * 34;
      const baseTime = courseDistance / baseCruise;
      return {
        active: true,
        kind: "cpu",
        aircraft: rivalAircraft,
        name: label,
        profileId: profile?.id || label,
        style: profile?.style || "steady",
        roleLabel: profile?.label || (round === 2 ? "ROOKIE" : "CPU"),
        lineWave: profile?.wave || 0,
        seed: (profile?.id || label).length * 0.83,
        totalTime: baseTime * paceMul,
        laneOffset,
        progress: 0,
        x: 82 + laneOffset,
        y: -95,
        z: -220,
        heading: 0,
        finished: false,
      };
    }

    function makeGhostRival(saved, laneOffset, label) {
      const ghostAircraft = AIRCRAFTS[saved?.samples?.length ? saved.samples.length % AIRCRAFTS.length : 0] || AIRCRAFTS[0];
      const first = saved.samples[0] || { x: 82, y: -95, z: -220, h: 0, r: 0, s: 0 };
      return {
        active: true,
        kind: "ghost",
        aircraft: ghostAircraft,
        name: label || saved.name || "GHOST",
        profileId: saved.name || "ghost",
        style: "ghost",
        roleLabel: "GHOST",
        lineWave: 0,
        seed: (saved.name || "ghost").length * 0.91,
        totalTime: saved.time_ms / 1000,
        samples: saved.samples,
        laneOffset,
        progress: 0,
        x: first.x + laneOffset,
        y: first.y,
        z: first.z,
        heading: first.h,
        roll: first.r || 0,
        finished: false,
      };
    }

    function makeRivals(round, coursePath) {
      if (round === 1) return [];
      const mode = selectedFieldMode();
      const savedGhosts = USE_GHOST_RIVALS
        ? (game?.roundGhosts || []).filter((g) => Array.isArray(g.samples) && g.samples.length >= 2)
        : [];
      if (round >= GRAND_PRIX_START_ROUND) {
        const tournament = game?.tournament || createTournamentState();
        return tournament.rivals.map((profile) => {
          const paceMul = profile.paceByRound?.[round] || 1.0;
          return makeCpuRival(round, coursePath, profile.laneOffset, profile.name, paceMul, profile);
        });
      }
      const rivals = [];
      const practiceCount = Math.max(0, mode.round2Size - 1);
      const practiceOffsets = buildLaneOffsets(practiceCount);
      for (let i = 0; i < practiceCount; i += 1) {
        if (savedGhosts[i]) {
          rivals.push(makeGhostRival(savedGhosts[i], practiceOffsets[i], savedGhosts[i].name || `GHOST ${i + 1}`));
          continue;
        }
        const rookieType = i % 2 === 0 ? aircraftById("skylancer") : aircraftById("thunderbolt");
        const rookiePace = 1.18 + i * 0.05;
        rivals.push(makeCpuRival(round, coursePath, practiceOffsets[i], `ROOKIE ${String.fromCharCode(65 + i)}`, rookiePace, {
          id: `rookie_${i}`,
          style: i % 3 === 1 ? "line" : "steady",
          label: "ROOKIE",
          aircraft: rookieType,
          wave: 3 + i,
        }));
      }
      return rivals;
    }

        targetCtx.lineTo(-0.52 * unit, 0.16 * unit);

      } else if (shape === "dart") {
        targetCtx.beginPath();

        targetCtx.lineTo(0.78 * unit, -0.12 * unit);
        targetCtx.lineTo(1.10 * unit, 0.56 * unit);
        targetCtx.lineTo(0.18 * unit, 0.20 * unit);
        targetCtx.lineTo(0, 1.00 * unit);
        targetCtx.lineTo(-0.18 * unit, 0.20 * unit);
        targetCtx.lineTo(-1.10 * unit, 0.56 * unit);
        targetCtx.lineTo(-0.78 * unit, -0.12 * unit);
        targetCtx.closePath();
      } else if (shape === "fang") {
        targetCtx.beginPath();
        targetCtx.moveTo(0, -1.05 * unit);
        targetCtx.lineTo(1.38 * unit, 0.02 * unit);
        targetCtx.lineTo(0.44 * unit, 0.22 * unit);
        targetCtx.lineTo(0.84 * unit, 0.92 * unit);
        targetCtx.lineTo(0.10 * unit, 0.42 * unit);
        targetCtx.lineTo(0, 1.04 * unit);
        targetCtx.lineTo(-0.10 * unit, 0.42 * unit);
        targetCtx.lineTo(-0.84 * unit, 0.92 * unit);
        targetCtx.lineTo(-0.44 * unit, 0.22 * unit);
        targetCtx.lineTo(-1.38 * unit, 0.02 * unit);
        targetCtx.closePath();
      } else if (shape === "heavy") {
        targetCtx.beginPath();
        targetCtx.moveTo(0, -0.88 * unit);

        targetCtx.lineTo(0.70 * unit, 0.52 * unit);

    function sampleFromGhost(samples, elapsedMs) {
      if (!samples || samples.length === 0) return null;
      if (elapsedMs <= samples[0].t) return samples[0];
      for (let i = 1; i < samples.length; i += 1) {
        const a = samples[i - 1];
        const b = samples[i];
        if (elapsedMs <= b.t) {
          const f = (elapsedMs - a.t) / Math.max(1, b.t - a.t);
          return {
            x: a.x + (b.x - a.x) * f,
            y: a.y + (b.y - a.y) * f,
            z: a.z + (b.z - a.z) * f,
            h: a.h + (b.h - a.h) * f,
            r: a.r + (b.r - a.r) * f,
            s: a.s + (b.s - a.s) * f,
          };
        }
      }
      return samples[samples.length - 1];
    }

    function raceStandings(success) {
      const playerPosition = success ? Math.max(1, Math.min(currentFieldSize(), game.racePosition || 1)) : currentFieldSize();
      const rivalEntries = (game.rivals || [])
        .map((rival) => ({
          kind: "rival",
          id: rival.profileId || rival.name,
          name: rival.name,
          progress: rival.progress || 0,
        }))
        .sort((a, b) => b.progress - a.progress);
      const remaining = [];
      for (let i = 1; i <= currentFieldSize(); i += 1) {
        if (i !== playerPosition) remaining.push(i);
      }
      const standings = [{
        kind: "player",
        id: "player",
        name: "YOU",
        position: playerPosition,
      }];
      for (let i = 0; i < rivalEntries.length; i += 1) {
        standings.push({
          ...rivalEntries[i],
          position: remaining[i] || currentFieldSize(),
        });
      }
      return standings.sort((a, b) => a.position - b.position);
    }

    function applyTournamentPoints(success) {
      if (!game?.tournament || game.round < GRAND_PRIX_START_ROUND) return null;
      const standings = raceStandings(success);
      const playerEntry = standings.find((entry) => entry.kind === "player");
      const playerRoundPoints = pointsForPosition(playerEntry?.position || currentFieldSize());
      game.tournament.playerPoints += playerRoundPoints;
      for (const entry of standings) {
        if (entry.kind !== "rival") continue;
        const rival = game.tournament.rivals.find((item) => item.id === entry.id);
        if (rival) rival.points += pointsForPosition(entry.position);
      }
      game.tournament.rounds.push({
        round: game.round,
        standings,
      });
      return {
        standings,
        playerPosition: playerEntry?.position || currentFieldSize(),
        playerRoundPoints,
        table: tournamentStatusText(game.tournament),
      };
    }

    function encodeScore(round, ms) {
      return round * 10_000_000 + Math.max(0, 9_999_999 - Math.round(ms));
    }

    function decodeScore(score) {
      const round = Math.floor(score / 10_000_000);
      const ms = 9_999_999 - (score % 10_000_000);
      return { round, ms };
    }

    async function startRound(round, carry = null) {
      const token = ++loadingToken;
      const label = round === 1 ? "START LOADING" : `ROUND ${round} LOADING`;
      setLoadingState(true, label, 0.08, "prepare request");
      try {
        const bundle = await fetchRoundBundle(round, (progress, meta) => {
          if (token !== loadingToken) return;
          setLoadingState(true, label, progress, meta);
        }, true);
        if (token !== loadingToken) return;
        setLoadingState(true, label, 0.94, "cockpit sync");
        resetGame(round, carry, bundle);
        raf = requestAnimationFrame(frame);
        setLoadingState(false);
        preloadRound(round + 1);
      } catch (err) {
        console.error(err);
        setLoadingState(false);
        showTitle();
        setMessage(`ROUND ${round} LOAD FAILED`, 1800);
      }
    }

    function startAudio() {
      if (audio?.ac?.state === "suspended") {
        audio.ac.resume();
        return;
      }
      if (audio) return;
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const prop = ac.createOscillator();
      const wobble = ac.createOscillator();
      const propGain = ac.createGain();
      const wobbleGain = ac.createGain();
      prop.type = "sawtooth";
      wobble.type = "square";
      prop.frequency.value = 84;
      wobble.frequency.value = 31;
      propGain.gain.value = 0.025;
      wobbleGain.gain.value = 0.0;
      prop.connect(propGain).connect(ac.destination);
      wobble.connect(wobbleGain).connect(ac.destination);
      prop.start();
      wobble.start();
      audio = { ac, prop, wobble, propGain, wobbleGain };
    }

    function stopAudio() {
      if (!audio) return;
      const t = audio.ac.currentTime;
      audio.propGain.gain.cancelScheduledValues(t);
      audio.wobbleGain.gain.cancelScheduledValues(t);
      audio.propGain.gain.setTargetAtTime(0.0, t, 0.04);
      audio.wobbleGain.gain.setTargetAtTime(0.0, t, 0.04);
    }

    function updateAudio() {
      if (!audio) return;
      const t = audio.ac.currentTime;
      audio.prop.frequency.setTargetAtTime(70 + game.speed * 0.10, t, 0.05);
      audio.propGain.gain.setTargetAtTime(0.024 + input.throttle * 0.025, t, 0.05);
      audio.wobble.frequency.setTargetAtTime(26 + input.throttle * 24, t, 0.04);
      audio.wobbleGain.gain.setTargetAtTime(input.throttle * 0.026, t, 0.04);
    }

    function hitSound(kind) {
      if (!audio) return;
      const ac = audio.ac;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain).connect(ac.destination);
      if (kind === "crash") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(90, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(28, ac.currentTime + 0.45);
        gain.gain.setValueAtTime(0.16, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.55);
        osc.start();
        osc.stop(ac.currentTime + 0.58);
        return;
      }
      osc.type = kind === "gate" ? "triangle" : "square";
      osc.frequency.setValueAtTime(kind === "gate" ? 760 : 130, ac.currentTime);
      gain.gain.setValueAtTime(kind === "gate" ? 0.055 : 0.10, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      osc.start();
      osc.stop(ac.currentTime + 0.2);
    }
