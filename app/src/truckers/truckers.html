<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>中型宇宙トラック野郎</title>
    <link rel="stylesheet" href="/truckers.css" />
    <script type="module" src="/truckers.js"></script>
  </head>
  <body>
    <div id="truckers-app">
      <div id="game-hud" style="display: none">
        <div id="hud-score" class="hud-block"></div>
        <div id="hud-life" class="hud-block"></div>
        <div id="hud-round" class="hud-block"></div>
      </div>

      <div id="wrap">
        <canvas id="canvas" width="540" height="540"></canvas>

        <div id="screen-title" class="overlay">
          <h1 id="title-heading"></h1>
          <p id="title-sub"></p>
          <div class="title-controls">
            <input
              id="name-input"
              type="text"
              maxlength="16"
              class="name-input"
            />
            <button class="btn" id="btn-start"></button>
          </div>
          <div id="title-scores" class="score-list"></div>
          <p class="title-help" id="title-help"></p>
        </div>

        <div id="screen-gameover" class="overlay" style="display: none">
          <h1 id="go-title"></h1>
          <h2 id="go-score"></h2>
          <p id="go-rank"></p>
          <div id="go-scores" class="score-list"></div>
          <button class="btn" id="btn-restart"></button>
        </div>

        <div id="screen-clear" class="overlay overlay-clear" style="display: none">
          <div id="clear-cast">
            <img
              class="clear-face left"
              src="/truckers/refs/girl.jpg"
              alt="GM portrait"
            />
            <img
              class="clear-face right"
              src="/truckers/refs/man.jpg"
              alt="Driver portrait"
            />
            <div id="clear-girl-line" class="clear-bubble left"></div>
            <div id="clear-man-line" class="clear-bubble right"></div>
          </div>
          <h1 id="cl-title" class="clear-title"></h1>
          <h2 id="cl-sub"></h2>
          <button class="btn" id="btn-continue" style="display: none"></button>
        </div>

        <button id="btn-back" type="button">← メニュー</button>
        <button id="btn-lang" type="button">🇯🇵 / 🇬🇧</button>
      </div>

      <div id="gm-comment"></div>

      <div id="touch-controls" style="display: none">
        <div id="vstick-area"><div id="vstick-knob"></div></div>
        <div id="action-buttons">
          <button id="btn-manip" type="button">MAG</button>
          <div id="touch-hint">MANIP</div>
        </div>
      </div>
    </div>
  </body>
</html>
