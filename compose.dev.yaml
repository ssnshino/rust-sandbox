services:
  rust-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayano-lab-rust-sandbox
    working_dir: /workspace/app
    command: ["cargo", "run"]
    ports:
      - "18081:3000"
    volumes:
      - ./app:/workspace/app
    environment:
      - VIRTUAL_HOST=rust-sandbox.wos.ktsys.jp
      - VIRTUAL_PORT=3000
      - CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
    networks:
      - default
      - wos-proxy-network

networks:
  wos-proxy-network:
    external: true
