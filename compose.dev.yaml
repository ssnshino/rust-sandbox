services:
  airrace-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ayano-lab-unity-rust-games-web
    working_dir: /workspace/web
    command: ["npm", "run", "dev"]
    ports:
      - "18093:3000"
    volumes:
      - ./web:/workspace/web
      - ./app/src/airrace:/workspace/app/src/airrace:ro
      - /workspace/web/node_modules
    environment:
      - VIRTUAL_HOST=airrace-web.wos.ktsys.jp
      - VIRTUAL_PORT=3000
      - AIRRACE_DATA_ROOT=/workspace/app/src/airrace
      - AIRRACE3D_ROOT=/workspace/web/public/airrace3d
    networks:
      - default
      - wos-proxy-network

  rust-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayano-lab-unity-rust-games
    working_dir: /workspace/app
    command: ["cargo", "run"]
    ports:
      - "18091:3000"
    volumes:
      - ./app:/workspace/app
    environment:
      - VIRTUAL_HOST=unity-rust-games.wos.ktsys.jp
      - VIRTUAL_PORT=3000
      - CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
    networks:
      - default
      - wos-proxy-network

networks:
  wos-proxy-network:
    external: true
