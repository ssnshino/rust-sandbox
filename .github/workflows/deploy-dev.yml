name: Deploy to Base (Dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to rust-sandbox.wos.ktsys.jp (base)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_DEV_HOST }}
          username: shino
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/shino/source/repos/upstream/rust-sandbox
            git fetch origin dev
            git checkout dev || git checkout -b dev origin/dev
            git reset --hard origin/dev
            docker compose -f compose.dev.yaml up --build -d
