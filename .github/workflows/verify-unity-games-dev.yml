name: Verify Unity games dev delivery
on:
  pull_request:
    branches: [dev]
    paths:
      - 'web/**'
      - 'app/src/airrace/**'
      - 'compose.dev.yaml'
      - 'scripts/*game*'
      - 'tests/*game*'
      - '.github/workflows/*unity-games-dev.yml'
      - '!**/*.md'
      - '!**/*.txt'
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - 'app/src/airrace/**'
      - 'compose.dev.yaml'
      - 'scripts/*game*'
      - 'tests/*game*'
      - '.github/workflows/*unity-games-dev.yml'
      - '!**/*.md'
      - '!**/*.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web
      - run: node --test tests/game-delivery.test.mjs
      - run: node scripts/verify-game-delivery.mjs . delivery-manifest.json
        env:
          SOURCE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-games-verified-${{ github.sha }}
          path: delivery-manifest.json
          if-no-files-found: warn
          retention-days: 30
