name: Deploy Unity games dev (gated)
on:
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - 'app/src/airrace/**'
      - 'compose.dev.yaml'
      - 'scripts/*game*'
      - 'tests/*game*'
      - '.github/workflows/*unity-games-dev.yml'
      - '!**/*.md'
      - '!**/*.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unity-games-dev-delivery
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web
      - run: node --test tests/game-delivery.test.mjs
      - run: node scripts/verify-game-delivery.mjs . delivery-manifest.json
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Deploy verified exact SHA to existing dev target
        run: bash scripts/deploy-unity-games-dev.sh
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEV_DEPLOY_ENABLED: ${{ vars.DEV_DEPLOY_ENABLED }}
          DEV_DEPLOY_TARGET_CONFIRMED: 'unity-games.wos.ktsys.jp'
          DEV_DEPLOY_HOST: ${{ secrets.DEPLOY_DEV_HOST }}
          DEV_DEPLOY_USER: 'shino'
          DEV_DEPLOY_PORT: ${{ secrets.DEPLOY_DEV_PORT }}
          DEV_DEPLOY_REPO_PATH: ${{ vars.DEV_DEPLOY_REPO_PATH }}
          DEV_DEPLOY_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Public artifact and API verification (not browser QA)
        run: node scripts/smoke-game-delivery.mjs delivery-manifest.json https://unity-games.wos.ktsys.jp .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-games-deployed-${{ github.sha }}
          path: delivery-manifest.json
          if-no-files-found: warn
          retention-days: 30
